<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Quản lý Huấn luyện ATVSLĐ DAKO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Công cụ quản lý huấn luyện an toàn vệ sinh lao động của Công ty Cổ phần Kỹ thuật Hàng hải DAKO: giảng viên, lịch phân công, chi phí, báo giá, hợp đồng.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap">
<style>
/* Layout: a light sky masthead echoing the DAKO banner (logo · company · title), a sticky royal-blue tab rail,
   then each tab's toolbar + content on a sky-tinted ground. Cards only for records; tables for lists. */
:root {
  --brand: #1446b8;        /* DAKO royal blue – banner headline */
  --brand-strong: #0b2e7a; /* deep navy – rail, headings */
  --brand-soft: #e6eefc;   /* tint for selected rows, chips */
  --accent: #ee6517;       /* orange – "TẠI DOANH NGHIỆP"; primary calls to action */
  --accent-soft: #fdeadf;
  --gold: #f2b100;         /* swoosh yellow */
  --bg: #f2f6fc;
  --surface: #ffffff;
  --surface-2: #f6f9fe;
  --line: #d9e3f2;
  --line-strong: #b9c9e3;
  --fg: #0e1b37;
  --fg-2: #46587c;
  --fg-3: #74839f;
  --on-brand: #ffffff;
  --ok: #12804a;   --ok-soft: #e2f4ea;
  --warn: #a96300; --warn-soft: #fdf1d9;
  --bad: #c42639;  --bad-soft: #fbe5e8;
  --info: #1d5fd6; --info-soft: #e5eefd;
  --r-nam: #1d5fd6; --r-trung: #0e9c8b; --r-bac: #8b4fd8; --r-x1: #b5651d; --r-x2: #c43c74; --r-x3: #4f6b8a;
  --shadow: 0 1px 2px rgba(14, 40, 92, .06), 0 4px 16px rgba(14, 40, 92, .06);
  --shadow-lg: 0 18px 48px rgba(8, 24, 64, .28);
  --font: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --brand: #7aa4ff; --brand-strong: #0f2457; --brand-soft: #1a2a50;
    --accent: #ff8a42; --accent-soft: #3a2416; --gold: #f6c53a;
    --bg: #0a1122; --surface: #111a2e; --surface-2: #16213a; --line: #24324f; --line-strong: #34466b;
    --fg: #e6ecf8; --fg-2: #a9b6cf; --fg-3: #7b89a5; --on-brand: #ffffff;
    --ok: #4cc98a; --ok-soft: #12301f; --warn: #f0b04a; --warn-soft: #33270f; --bad: #ff6b7d; --bad-soft: #3a1820;
    --info: #7aa4ff; --info-soft: #172848;
    --r-nam: #5b8ef0; --r-trung: #1fa897; --r-bac: #9b72e6; --r-x1: #d08a45; --r-x2: #e0679a; --r-x3: #7f97b5;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --brand: #7aa4ff; --brand-strong: #0f2457; --brand-soft: #1a2a50;
  --accent: #ff8a42; --accent-soft: #3a2416; --gold: #f6c53a;
  --bg: #0a1122; --surface: #111a2e; --surface-2: #16213a; --line: #24324f; --line-strong: #34466b;
  --fg: #e6ecf8; --fg-2: #a9b6cf; --fg-3: #7b89a5; --on-brand: #ffffff;
  --ok: #4cc98a; --ok-soft: #12301f; --warn: #f0b04a; --warn-soft: #33270f; --bad: #ff6b7d; --bad-soft: #3a1820;
  --info: #7aa4ff; --info-soft: #172848;
  --r-nam: #5b8ef0; --r-trung: #1fa897; --r-bac: #9b72e6; --r-x1: #d08a45; --r-x2: #e0679a; --r-x3: #7f97b5;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--brand-strong); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; text-wrap: balance; }
a { color: var(--brand); }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1360px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--fg-3); }
.small { font-size: 12.5px; }
.nowrap { white-space: nowrap; }
.right { text-align: right; }
.grow { flex: 1 1 auto; min-width: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- masthead ---------- */
.mast { position: relative; overflow: hidden; background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%); border-bottom: 1px solid var(--line); }
.mast::before { /* blue + gold swoosh from the banner's top-left corner */
  content: ""; position: absolute; left: -60px; top: -70px; width: 260px; height: 120px; border-radius: 0 0 100% 0;
  background: linear-gradient(160deg, var(--brand) 0 58%, var(--gold) 58% 70%, transparent 70%); opacity: .9; transform: rotate(-8deg); pointer-events: none;
}
.mast-in { position: relative; display: flex; align-items: center; gap: 14px; padding-block: 12px; flex-wrap: wrap; }
.mast-logo { width: 54px; height: 54px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px #fff, var(--shadow); flex: none; }
.mast-co { display: flex; flex-direction: column; line-height: 1.15; }
.mast-co-1 { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--brand); font-weight: 600; }
.mast-co-2 { font-size: 17px; font-weight: 800; color: var(--brand); text-transform: uppercase; letter-spacing: .01em; }
.mast-sep { width: 2px; align-self: stretch; background: var(--brand); opacity: .35; margin-block: 4px; }
.mast-title { display: flex; flex-direction: column; line-height: 1.12; }
.mast-t1 { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-2); }
.mast-t2 { font-size: 19px; font-weight: 800; text-transform: uppercase; color: var(--accent); letter-spacing: .01em; }
.mast-status { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 760px) {
  .mast-sep { display: none; }
  .mast-co-2 { font-size: 14px; }
  .mast-t2 { font-size: 15px; }
  .mast-logo { width: 44px; height: 44px; }
  .mast-status { margin-left: 0; width: 100%; justify-content: flex-start; }
}

/* ---------- tab rail ---------- */
.rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 25; background: var(--brand-strong); box-shadow: 0 2px 10px rgba(6, 22, 60, .18); }
:root:not([data-theme="dark"]) .rail { background: var(--brand); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .rail { background: var(--brand-strong); } }
.rail-in { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.rail-in::-webkit-scrollbar { display: none; }
.tab { flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 12px 14px 11px; color: rgba(255, 255, 255, .82); text-decoration: none; font-weight: 600; font-size: 14px; border-bottom: 3px solid transparent; white-space: nowrap; }
.tab svg { width: 17px; height: 17px; opacity: .85; }
.tab:hover { color: #fff; background: rgba(255, 255, 255, .08); }
.tab[aria-current="page"] { color: #fff; border-bottom-color: var(--gold); background: rgba(255, 255, 255, .12); }
.tab .badge { background: var(--accent); color: #fff; border-radius: 99px; font-size: 11px; padding: 0 6px; line-height: 18px; min-width: 18px; text-align: center; }

/* ---------- banners & status ---------- */
.banners .wrap { display: flex; flex-direction: column; gap: 8px; padding-block: 10px 0; }
.banner { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; }
.banner.demo { border-color: var(--accent); background: var(--accent-soft); }
.banner.warn { border-color: var(--warn); background: var(--warn-soft); }
.banner.info { border-color: var(--line-strong); background: var(--info-soft); }
.banner .grow { min-width: 200px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); color: var(--fg-2); white-space: nowrap; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, transparent); background: var(--ok-soft); }
.pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, transparent); background: var(--warn-soft); }
.pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, transparent); background: var(--bad-soft); }
.pill.info { color: var(--info); border-color: color-mix(in srgb, var(--info) 35%, transparent); background: var(--info-soft); }
.pill.accent { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); background: var(--accent-soft); }
.pill.muted { color: var(--fg-2); background: var(--surface-2); }

/* ---------- main & sections ---------- */
main { padding-block: 16px 48px; }
.page-head { display: flex; align-items: flex-end; gap: 12px 16px; flex-wrap: wrap; margin-bottom: 14px; }
.page-head h1 { font-size: 22px; font-weight: 800; color: var(--brand-strong); }
:root[data-theme="dark"] .page-head h1 { color: var(--fg); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .page-head h1 { color: var(--fg); } }
.page-head .sub { color: var(--fg-3); font-size: 13px; }
.page-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.toolbar { display: flex; gap: 8px 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); min-width: 0; }
.panel-h { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel-h h2 { font-size: 15px; font-weight: 700; }
.panel-h .actions { margin-left: auto; display: flex; gap: 6px; }
.panel-b { padding: 14px 16px; }
.panel-b.flush { padding: 0; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
@media (max-width: 1000px) { .grid-2 { grid-template-columns: minmax(0, 1fr); } }

/* ---------- buttons & inputs ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); font-weight: 600; font-size: 13.5px; cursor: pointer; text-decoration: none; white-space: nowrap; line-height: 1.2; }
.btn:hover { border-color: var(--brand); color: var(--brand); }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); color: #fff; }
.btn.cta { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.cta:hover { filter: brightness(1.06); color: #fff; }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
.btn.danger:hover { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 5px 10px; font-size: 12.5px; border-radius: 7px; }
.btn.xs { padding: 3px 8px; font-size: 12px; border-radius: 6px; }
.btn.icon { padding: 6px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
:root:not([data-theme="light"]) .btn.primary { color: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { background: #2a5fd8; border-color: #2a5fd8; } }
:root[data-theme="dark"] .btn.primary { background: #2a5fd8; border-color: #2a5fd8; }
.input, select.input, textarea.input { width: 100%; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); min-height: 38px; }
textarea.input { min-height: 72px; resize: vertical; }
.input:focus { outline: 2px solid color-mix(in srgb, var(--brand) 55%, transparent); outline-offset: 0; border-color: var(--brand); }
.input[readonly], .input:disabled { background: var(--surface-2); color: var(--fg-2); }
.search { position: relative; flex: 1 1 220px; max-width: 360px; min-width: 160px; }
.search .input { padding-left: 34px; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--fg-3); }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 9px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 12px; font-weight: 600; font-size: 13px; cursor: pointer; color: var(--fg-2); display: inline-flex; align-items: center; gap: 6px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button svg { width: 16px; height: 16px; flex: none; }
.seg button[aria-pressed="true"] { background: var(--brand); color: #fff; }
:root[data-theme="dark"] .seg button[aria-pressed="true"] { background: #2a5fd8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button[aria-pressed="true"] { background: #2a5fd8; } }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line-strong); background: var(--surface); font-weight: 600; font-size: 13px; cursor: pointer; color: var(--fg-2); }
.chip[aria-pressed="true"] { background: var(--brand-soft); color: var(--brand); border-color: var(--brand); }
.chip .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.chip .count { font-size: 11.5px; color: var(--fg-3); }
.tag { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 12px; background: var(--surface-2); border: 1px solid var(--line); color: var(--fg-2); white-space: nowrap; }
.rtag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--fg-2); white-space: nowrap; }
.rtag .sw { width: 9px; height: 9px; border-radius: 2px; flex: none; }

/* ---------- KPI tiles ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi .k { font-size: 12px; font-weight: 600; color: var(--fg-3); text-transform: uppercase; letter-spacing: .05em; }
.kpi .v { font-size: 24px; font-weight: 800; color: var(--fg); font-variant-numeric: tabular-nums; line-height: 1.2; }
.kpi .v small { font-size: 13px; font-weight: 600; color: var(--fg-3); }
.kpi .d { font-size: 12.5px; color: var(--fg-2); }
.kpi.hl { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.kpi.hl .v { color: var(--accent); }

/* ---------- lists ---------- */
.list { list-style: none; margin: 0; padding: 0; }
.list > li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 16px; border-top: 1px solid var(--line); }
.list > li:first-child { border-top: 0; }
.list .when { flex: none; width: 54px; text-align: center; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); padding: 4px 0; line-height: 1.1; }
.list .when b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.list .when span { font-size: 11px; color: var(--fg-3); font-weight: 600; text-transform: uppercase; }
.list .t { font-weight: 600; }
.list .s { font-size: 12.5px; color: var(--fg-2); }
.list .clickable { cursor: pointer; }
.list li.clickable:hover { background: var(--surface-2); }
.alert-i { flex: none; width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-weight: 800; font-size: 13px; }
.alert-i.bad { background: var(--bad-soft); color: var(--bad); }
.alert-i.warn { background: var(--warn-soft); color: var(--warn); }
.alert-i.info { background: var(--info-soft); color: var(--info); }
.empty { padding: 22px 16px; text-align: center; color: var(--fg-3); }
.empty b { color: var(--fg-2); display: block; margin-bottom: 4px; font-size: 14px; }

/* ---------- tables ---------- */
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
.tbl th { text-align: left; font-size: 12px; font-weight: 700; color: var(--fg-3); text-transform: uppercase; letter-spacing: .04em; padding: 9px 12px; border-bottom: 1px solid var(--line-strong); background: var(--surface-2); white-space: nowrap; position: sticky; top: 0; }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tbody tr { cursor: pointer; }
.tbl tbody tr:hover td { background: var(--surface-2); }
.tbl tfoot td { font-weight: 700; background: var(--surface-2); border-bottom: 0; }
.tbl td.r, .tbl th.r { text-align: right; font-variant-numeric: tabular-nums; }
.tbl .strong { font-weight: 600; }
.tbl .cell-files { display: flex; gap: 4px; flex-wrap: wrap; }
.tbl tr.cancel td { color: var(--fg-3); }
.tbl tr.cancel td .strong { text-decoration: line-through; }
.minibar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; min-width: 60px; }
.minibar > span { display: block; height: 100%; border-radius: 3px; }

/* ---------- calendar ---------- */
.cal-layout { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 16px; align-items: start; }
@media (max-width: 1080px) { .cal-layout { grid-template-columns: minmax(0, 1fr); } }
.cal-nav { display: flex; align-items: center; gap: 6px; }
.cal-nav h2 { font-size: 18px; font-weight: 800; min-width: 150px; text-align: center; color: var(--fg); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-left: 1px solid var(--line); border-top: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); box-shadow: var(--shadow); }
.cal-dow { padding: 8px 8px; font-size: 12px; font-weight: 700; color: var(--fg-3); text-transform: uppercase; letter-spacing: .05em; background: var(--surface-2); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.cal-dow.we { color: var(--accent); }
.cal-day { position: relative; min-height: 118px; padding: 6px 6px 8px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); cursor: pointer; display: flex; flex-direction: column; gap: 3px; min-width: 0; background: var(--surface); }
.cal-day:hover { background: var(--surface-2); }
.cal-day.out { background: var(--surface-2); }
.cal-day.out .dn { color: var(--fg-3); opacity: .6; }
.cal-day.sel { box-shadow: inset 0 0 0 2px var(--brand); }
.cal-day .dh { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.cal-day .dn { font-weight: 700; font-size: 13px; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; font-variant-numeric: tabular-nums; }
.cal-day.today .dn { background: var(--accent); color: #fff; }
.cal-day .add { opacity: 0; border: 1px dashed var(--line-strong); background: var(--surface); color: var(--brand); border-radius: 6px; width: 24px; height: 22px; display: grid; place-items: center; cursor: pointer; padding: 0; }
.cal-day:hover .add, .cal-day.sel .add { opacity: 1; }
@media (hover: none) { .cal-day .add { opacity: 1; } }
.ev { display: block; width: 100%; text-align: left; border: 0; border-left: 3px solid var(--rc, var(--brand)); background: color-mix(in srgb, var(--rc, var(--brand)) 12%, var(--surface)); border-radius: 5px; padding: 3px 6px; font-size: 12px; line-height: 1.3; cursor: pointer; color: var(--fg); overflow: hidden; }
.ev:hover { background: color-mix(in srgb, var(--rc, var(--brand)) 22%, var(--surface)); }
.ev .l1 { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev .l2 { display: block; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11.5px; }
.ev.st-cancelled { opacity: .55; }
.ev.st-cancelled .l1 { text-decoration: line-through; }
.ev.st-planned { border-left-style: dashed; }
.ev.conflict { box-shadow: inset 0 0 0 1.5px var(--bad); }
.ev.dim { opacity: .28; }

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

const clone = (o) => JSON.parse(JSON.stringify(o));
const sum = (arr, f) => arr.reduce((s, x) => s + (Number(f(x)) || 0), 0);
const uniq = (arr) => Array.from(new Set(arr));
const initials = (name) => {
  const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  const last = parts[parts.length - 1];
  return (parts.length > 1 ? parts[0][0] + last[0] : last.slice(0, 2)).toUpperCase();
};
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

/* ---------- dates (ISO yyyy-mm-dd, giờ địa phương) ---------- */
const pad = (n) => String(n).padStart(2, '0');

const todayISO = () => isoOf(new Date());
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return isoOf(d); };
const addMonths = (s, n) => {
  const d = parseISO(s); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n);
  const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, last)); return isoOf(d);
};

const ymOf = (s) => s.slice(0, 7);
const fmtYM = (ym) => `Tháng ${Number(ym.slice(5, 7))}/${ym.slice(0, 4)}`;
const ymAdd = (ym, n) => addMonths(ym + '-01', n).slice(0, 7);
const monthEnd = (ym) => { const [y, m] = ym.split('-').map(Number); return `${ym}-${pad(new Date(y, m, 0).getDate())}`; };
const fmtDateRange = (a, b) => {
  if (!a) return '';
  if (!b || a === b) return `${dowOf(a)} ${fmtD(a)}`;
  if (a.slice(0, 7) === b.slice(0, 7)) return `${a.slice(8, 10)}–${fmtD(b)}`;

const fmtStamp = (isoStr) => {

};

/* ---------- pricing & money per class ---------- */
function tierFor(n, tiers = settings().priceTiers) {
  n = Number(n) || 0;
  if (n <= 0) return null;
  return (tiers || []).find((t) => n >= Number(t.min) && n <= Number(t.max)) || null;
}
function tierText(n) {
  const t = tierFor(n);
  if (t) return `Bảng giá ${t.min}–${t.max} HV/lớp: ${moneyD(t.price)} (chưa VAT)`;
  const tiers = settings().priceTiers || [];
  const maxT = tiers.reduce((m, x) => Math.max(m, Number(x.max) || 0), 0);
  if (n > maxT && maxT) return `Trên ${maxT} HV/lớp: chưa có trong bảng giá – nhập giá thỏa thuận hoặc tách lớp`;
  return 'Nhập số học viên để tính giá theo bảng giá';
}
const classDays = (c) => (c.startDate && c.endDate ? Math.max(1, daysBetween(c.startDate, c.endDate) + 1) : 1);
const vatOf = (rec) => (rec.vatRate === 0 || rec.vatRate ? Number(rec.vatRate) : Number(settings().vatRate) || 0);
function classMoney(c) {
  const live = c.status !== 'cancelled';
  const rev = live ? Number(c.price) || 0 : 0;
  const vat = (rev * vatOf(c)) / 100;
  const cost = live ? (Number(c.costTrainer) || 0) + (Number(c.costTravel) || 0) + (Number(c.costOther) || 0) : 0;
  return { rev, vat, total: rev + vat, cost, profit: rev - cost, margin: rev ? (rev - cost) / rev : 0 };
}
function trainerCostAuto(trainerIds, days) {
  return sum(trainerIds || [], (id) => (Number(trainer(id)?.dailyRate) || 0) * days);
}

/* ---------- schedule conflicts ---------- */
const dateOverlap = (a, b) => a.startDate && b.startDate && a.startDate <= (b.endDate || b.startDate) && b.startDate <= (a.endDate || a.startDate);
const timeOverlap = (a, b) => (a.startTime || '00:00') < (b.endTime || '23:59') && (b.startTime || '00:00') < (a.endTime || '23:59');
function conflictsFor(c, list = S.classes) {
  if (!c || c.status === 'cancelled' || !(c.trainerIds || []).length) return [];
  const out = [];
  for (const o of list) {
    if (o.id === c.id || o.status === 'cancelled') continue;
    const shared = (c.trainerIds || []).filter((t) => (o.trainerIds || []).includes(t));
    if (shared.length && dateOverlap(c, o) && timeOverlap(c, o)) out.push({ cls: o, trainers: shared });
  }
  return out;
}
function busyClasses(trainerId, range, exceptId) {
  return S.classes.filter((o) => o.id !== exceptId && o.status !== 'cancelled' && (o.trainerIds || []).includes(trainerId) && dateOverlap(range, o) && timeOverlap(range, o));
}
const classesOn = (iso) => S.classes.filter((c) => c.startDate <= iso && iso <= (c.endDate || c.startDate));
const classInMonth = (c, ym) => c.startDate <= monthEnd(ym) && (c.endDate || c.startDate) >= ym + '-01';
const sortClasses = (a, b) => (a.startDate + (a.startTime || '')).localeCompare(b.startDate + (b.startTime || ''));
function classLabel(c) {
  return c.customerName || customer(c.customerId)?.name || c.title || 'Lớp chưa đặt tên';
}
const groupsText = (gs) => (gs && gs.length ? 'Nhóm ' + gs.slice().sort().join(', ') : '');
/** Tên ngắn cho ô lịch: bỏ "Công ty TNHH/CP…" để phần tên riêng không bị cắt mất. */
const shortName = (n) => String(n || '').replace(/^\s*(công ty|cong ty|cty)\.?\s+((tnhh|trách nhiệm hữu hạn)(\s+(mtv|một thành viên))?|cổ phần|cp)?\s*/i, '').trim() || String(n || '');
const groupsShort = (gs) => (gs && gs.length ? gs.slice().sort().map((g) => 'N' + g).join('·') : '');
function trainerNames(ids) {
  return (ids || []).map((id) => trainer(id)?.name || 'GV đã xóa').join(', ');
}
function suggestedDays(groups, kind) {
  const hrs = Math.max(0, ...(groups || []).map((g) => Number(settings().groupHours?.[g]) || 0));
  if (!hrs) return { hrs: 0, days: 0 };
  const h = kind === 'Huấn luyện định kỳ' ? Math.ceil(hrs / 2) : hrs;
  return { hrs: h, days: Math.max(1, Math.ceil(h / (Number(settings().hoursPerDay) || 8))) };
}

/* ---------- quotes & contracts ---------- */
function quoteMoney(q) {
  const amount = Number(q.amount) || 0;
  const vat = (amount * vatOf(q)) / 100;
  return { amount, vat, total: amount + vat };
}
const isContract = (q) => q.status === 'signed';
const quoteClasses = (q) => S.classes.filter((c) => c.quoteId === q.id);
function contractMoney(q) {
  const amount = q.contractAmount === 0 || q.contractAmount ? Number(q.contractAmount) : Number(q.amount) || 0;
  const vat = (amount * vatOf(q)) / 100;
  const total = amount + vat;
  const paid = sum(q.payments || [], (p) => p.amount);
  return { amount, vat, total, paid, remain: Math.max(0, total - paid) };
}
function contractState(q) {
  const m = contractMoney(q);
  const cls = quoteClasses(q).filter((c) => c.status !== 'cancelled');
  const allDone = cls.length > 0 && cls.every((c) => c.status === 'done');
  if (m.total > 0 && m.remain <= 0 && (allDone || !cls.length)) return { label: 'Hoàn tất', tone: 'ok' };
  if (m.remain > 0 && q.paymentDue && q.paymentDue < todayISO()) return { label: 'Quá hạn thanh toán', tone: 'bad' };
  if (allDone && m.remain > 0) return { label: 'Đã dạy xong – chờ thu', tone: 'warn' };
  if (m.total > 0 && m.remain <= 0) return { label: 'Đã thu đủ', tone: 'ok' };
  return { label: 'Đang thực hiện', tone: 'info' };
}
function nextQuoteNo(dateIso) {
  const y = (dateIso || todayISO()).slice(0, 4);
  let max = 0;
  for (const q of S.quotes) { const m = /^BG-(\d{4})-(\d+)/.exec(q.no || ''); if (m && m[1] === y) max = Math.max(max, Number(m[2])); }
  return `BG-${y}-${String(max + 1).padStart(3, '0')}`;
}

/* ---------- customers ---------- */
function findCustomerByName(name) {
  const n = norm(name);
  return n ? S.customers.find((c) => norm(c.name) === n) : null;
}
function customerStats(cid) {
  const cls = S.classes.filter((c) => c.customerId === cid && c.status !== 'cancelled');
  const done = cls.filter((c) => c.status === 'done');
  return {
    classes: cls.length,
    students: sum(done, (c) => c.students),
    revenue: sum(cls, (c) => classMoney(c).rev),
    last: done.reduce((m, c) => ((c.endDate || c.startDate) > m ? c.endDate || c.startDate : m), ''),
  };
}
/** Hạn huấn luyện định kỳ theo từng nhóm của khách hàng, dựa trên lớp hoàn thành gần nhất. */
function customerDues(cid) {
  const last = {};
  for (const c of S.classes) {
    if (c.customerId !== cid || c.status !== 'done') continue;
    const end = c.endDate || c.startDate;
    for (const g of c.groups || []) if (!last[g] || end > last[g]) last[g] = end;
  }
  const cyc = settings().cycleMonths || {};
  return Object.keys(last).map((g) => ({ group: Number(g), last: last[g], due: addMonths(last[g], Number(cyc[g]) || 24) }))
    .sort((a, b) => a.due.localeCompare(b.due));
}
function dueTone(dueIso) {
  const d = daysBetween(todayISO(), dueIso);
  if (d < 0) return { tone: 'bad', text: `Quá hạn ${-d} ngày` };
  if (d <= (Number(settings().warnDays) || 60)) return { tone: 'warn', text: `Còn ${d} ngày` };
  return { tone: 'ok', text: 'Còn hạn' };
}

/* ---------- trainers ---------- */
function trainerMonthLoad(tid, ym) {
  let days = 0; const cls = [];
  for (const c of S.classes) {
    if (c.status === 'cancelled' || !(c.trainerIds || []).includes(tid) || !classInMonth(c, ym)) continue;
    cls.push(c);
    const a = c.startDate < ym + '-01' ? ym + '-01' : c.startDate;
    const b = (c.endDate || c.startDate) > monthEnd(ym) ? monthEnd(ym) : c.endDate || c.startDate;
    days += daysBetween(a, b) + 1;
  }
  return { days, classes: cls };
}
function trainerNext(tid) {
  const t = todayISO();
  return S.classes.filter((c) => c.status !== 'cancelled' && (c.trainerIds || []).includes(tid) && (c.endDate || c.startDate) >= t).sort(sortClasses)[0] || null;
}
function trainersInRegion(region, { includePaused = false } = {}) {
  return S.trainers
    .filter((t) => includePaused || t.status !== 'paused')
    .filter((t) => region === 'all' || t.region === region || (t.otherRegions || []).includes(region))
    .sort((a, b) => (a.region === region ? 0 : 1) - (b.region === region ? 0 : 1) || a.name.localeCompare(b.name, 'vi'));
}

/* ---------- alerts for the dashboard ---------- */
function computeAlerts() {
  const out = []; const t = todayISO(); const st = settings();
  const seen = new Set();
  for (const c of S.classes) {
    const cx = conflictsFor(c);
    for (const x of cx) {
      const key = [c.id, x.cls.id].sort().join('|');
      if (seen.has(key) || (c.endDate || c.startDate) < t) continue; seen.add(key);
      out.push({ sev: 'bad', text: `Trùng lịch giảng viên ${trainerNames(x.trainers)}: ${classLabel(c)} (${fmtDateRange(c.startDate, c.endDate)}) và ${classLabel(x.cls)} (${fmtDateRange(x.cls.startDate, x.cls.endDate)})`, act: 'class-view', id: c.id });
    }
  }
  for (const c of S.classes) {
    if (c.status === 'cancelled' || c.status === 'done') continue;
    const end = c.endDate || c.startDate;
    if (!(c.trainerIds || []).length && c.startDate >= t && daysBetween(t, c.startDate) <= 21) out.push({ sev: 'warn', text: `Lớp ${classLabel(c)} ngày ${fmtD(c.startDate)} chưa phân công giảng viên`, act: 'class-view', id: c.id });
    if (end < t) out.push({ sev: 'warn', text: `Lớp ${classLabel(c)} (${fmtDateRange(c.startDate, c.endDate)}) đã qua ngày dạy – cập nhật trạng thái hoàn thành hoặc hủy`, act: 'class-view', id: c.id });
    if (c.status === 'planned' && c.startDate >= t && daysBetween(t, c.startDate) <= 7) out.push({ sev: 'info', text: `Lớp ${classLabel(c)} ngày ${fmtD(c.startDate)} vẫn ở trạng thái dự kiến – cần chốt lịch với khách`, act: 'class-view', id: c.id });
  }
  for (const c of S.classes) {
    if (c.status !== 'done') continue;
    const q = c.quoteId && quote(c.quoteId);
    if (!q || !isContract(q)) out.push({ sev: 'warn', text: `Lớp ${classLabel(c)} (${fmtD(c.startDate)}) đã dạy nhưng chưa gắn hợp đồng đã ký`, act: 'class-view', id: c.id });
  }
  for (const q of S.quotes) {
    if (['sent', 'negotiating'].includes(q.status) && q.date && daysBetween(q.date, t) >= (Number(st.quoteFollowDays) || 7)) out.push({ sev: 'info', text: `Báo giá ${q.no || ''} – ${q.customerName}: đã ${daysBetween(q.date, t)} ngày chưa có kết quả, cần liên hệ lại`, act: 'quote-view', id: q.id });
    if (q.status === 'accepted') out.push({ sev: 'info', text: `${q.customerName} đã đồng ý báo giá ${q.no || ''} – chờ ký hợp đồng`, act: 'quote-view', id: q.id });
    if (isContract(q)) {
      const m = contractMoney(q);
      if (m.remain > 0 && q.paymentDue && q.paymentDue < t) out.push({ sev: 'bad', text: `Hợp đồng ${q.contractNo || q.no} – ${q.customerName}: quá hạn thanh toán ${daysBetween(q.paymentDue, t)} ngày, còn phải thu ${moneyD(m.remain)}`, act: 'quote-view', id: q.id });
      if (!(q.contractFiles || []).length) out.push({ sev: 'info', text: `Hợp đồng ${q.contractNo || q.no} – ${q.customerName} chưa tải file hợp đồng lên`, act: 'quote-view', id: q.id });
    }
  }
  for (const tr of S.trainers) {
    if (tr.status === 'paused' || !tr.certExpiry) continue;
    const d = daysBetween(t, tr.certExpiry);
    if (d < 0) out.push({ sev: 'bad', text: `Chứng chỉ giảng viên ${tr.name} đã hết hạn ngày ${fmtD(tr.certExpiry)}`, act: 'trainer-view', id: tr.id });
    else if (d <= (Number(st.warnDays) || 60)) out.push({ sev: 'warn', text: `Chứng chỉ giảng viên ${tr.name} hết hạn sau ${d} ngày (${fmtD(tr.certExpiry)})`, act: 'trainer-view', id: tr.id });
  }
  for (const cu of S.customers) {
    for (const d of customerDues(cu.id)) {
      const k = daysBetween(t, d.due);
      if (k <= (Number(st.warnDays) || 60)) {
        const upcoming = S.classes.some((c) => c.customerId === cu.id && c.status !== 'cancelled' && c.startDate >= d.last && c.startDate > t && (c.groups || []).includes(d.group));
        if (!upcoming) out.push({ sev: k < 0 ? 'warn' : 'info', text: `${cu.name}: Nhóm ${d.group} ${k < 0 ? 'đã quá hạn' : 'sắp đến hạn'} huấn luyện định kỳ (${fmtD(d.due)}) – cơ hội gửi báo giá`, act: 'customer-view', id: cu.id });
      }
    }
  }
  const order = { bad: 0, warn: 1, info: 2 };
  return out.sort((a, b) => order[a.sev] - order[b.sev]);
}

/* ---------- file types ---------- */
const MIME_BY_EXT = {
  pdf: 'application/pdf', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', gif: 'image/gif',
  docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', doc: 'application/msword',
  xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', xls: 'application/vnd.ms-excel',
  pptx: 'application/vnd.openxmlformats-officedocument.presentationml.presentation', csv: 'text/csv', txt: 'text/plain',
  zip: 'application/zip', rar: 'application/vnd.rar', heic: 'image/heic',
};
const extOf = (name) => (String(name || '').match(/\.([a-z0-9]+)$/i)?.[1] || '').toLowerCase();
const mimeOf = (file) => file.type || MIME_BY_EXT[extOf(file.name)] || 'application/octet-stream';
function fileKind(meta) {
  const e = extOf(meta.name); const t = meta.type || '';
  if (t === 'application/pdf' || e === 'pdf') return 'pdf';
  if (/^image\/(png|jpeg|gif|webp)$/.test(t) || ['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(e)) return 'img';
  if (e === 'docx') return 'docx';
  if (['xlsx', 'xls', 'csv'].includes(e)) return 'sheet';
  if (e === 'doc') return 'doc';
  return 'other';
}
const extClass = (meta) => ({ pdf: 'pdf', img: 'img', docx: 'doc', doc: 'doc', sheet: 'xls' }[fileKind(meta)] || '');
const fmtSize = (b) => (b >= 1048576 ? (b / 1048576).toLocaleString('vi-VN', { maximumFractionDigits: 1 }) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB');

/* ============================================================
   STORE – 3 cách lưu dữ liệu, cùng một giao diện:
   • CloudBackend : bản dùng chung trên claude.ai (db + assets)
   • LocalBackend : mở file HTML trực tiếp – lưu IndexedDB trên máy
   • MemoryBackend: dữ liệu mẫu để xem thử (không lưu)
   ============================================================ */

const COLLECTIONS = ['trainers', 'classes', 'quotes', 'customers', 'settings', 'log'];
const RAW_UPLOAD = new Set(['application/pdf', 'image/png', 'image/jpeg', 'image/gif', 'image/webp']);
const MAX_RAW = 20 * 1024 * 1024;
const MAX_WRAPPED = Math.floor(MAX_RAW * 0.74);

function blobToBase64(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1] || '');
    r.onerror = () => rej(r.error);
    r.readAsDataURL(blob);
  });
}
function base64ToBlob(b64, type) {
  const bin = atob(b64.replace(/\s+/g, ''));
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new Blob([u8], { type: type || 'application/octet-stream' });
}
function uploadErrorText(e) {
  const map = {
    too_large: 'File quá lớn (tối đa 20 MB; file Word/Excel tối đa khoảng 14 MB).',
    unsupported_type: 'Định dạng file chưa được hỗ trợ.',
    quota_or_state: 'Kho lưu file của công cụ đã đầy – hãy xóa bớt file không dùng.',
    not_granted: 'Tài khoản này không có quyền tải file lên.',
    rate_limited: 'Thao tác quá nhanh – thử lại sau vài giây.',
    upstream_auth: 'Phiên đăng nhập đã hết – hãy tải lại trang.',
  };
  return map[e?.code] || e?.message || 'Tải file lên không thành công.';
}

class MemoryBackend {
  constructor(kind = 'demo') {
    this.kind = kind;
    this.data = {}; COLLECTIONS.forEach((c) => (this.data[c] = new Map()));
    this.files = new Map(); this.subs = {}; this.urls = new Map();
  }
  async init() {}
  list(col) { return Array.from(this.data[col].values()).map((x) => ({ ...x })); }
  subscribe(col, next) {
    (this.subs[col] = this.subs[col] || new Set()).add(next);
    queueMicrotask(() => next(this.list(col), { fromCache: false }));
    return () => this.subs[col].delete(next);
  }
  emit(col) { const l = this.list(col); (this.subs[col] || []).forEach((f) => f(l, { fromCache: false })); }
  async set(col, id, rec) { const r = clone(rec); r.id = id; this.data[col].set(id, r); await this.persist(col, id, r); this.emit(col); }
  async del(col, id) { this.data[col].delete(id); await this.persistDel(col, id); this.emit(col); }
  async persist() {} async persistDel() {} async persistFile() {} async persistFileDel() {} async loadFile() { return null; }
  async putFile(file, name, type) {
    const id = uid('f');
    const blob = file instanceof Blob ? file : new Blob([file], { type });
    this.files.set(id, blob);
    await this.persistFile(id, blob);
    return { id, name, type, size: blob.size, enc: 'raw', at: new Date().toISOString() };
  }
  async getBlob(meta) {
    let b = this.files.get(meta.id);
    if (!b) { b = await this.loadFile(meta.id); if (b) this.files.set(meta.id, b); }
    if (!b) throw new Error('Không tìm thấy file trên máy này.');
    return b;
  }
  directUrl() { return null; }
  async objectUrl(meta) {
    if (this.urls.has(meta.id)) return this.urls.get(meta.id);
    const u = URL.createObjectURL(await this.getBlob(meta)); this.urls.set(meta.id, u); return u;
  }
  async delFile(meta) {
    this.files.delete(meta.id);
    if (this.urls.has(meta.id)) { URL.revokeObjectURL(this.urls.get(meta.id)); this.urls.delete(meta.id); }
    await this.persistFileDel(meta.id);
  }
  async download(filename, data) {
    const blob = data instanceof Blob ? data : new Blob([data]);
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    return true;
  }
}

class LocalBackend extends MemoryBackend {
  constructor() { super('local'); }
  idb(storeName, mode, fn) {
    return new Promise((res, rej) => {
      const tx = this.db.transaction(storeName, mode); const st = tx.objectStore(storeName);
      let out; Promise.resolve(fn(st)).then((v) => (out = v));
      tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  }
  async init() {
    this.db = await new Promise((res, rej) => {
      const r = indexedDB.open('dako-atld', 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('records'); r.result.createObjectStore('files'); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    await new Promise((res, rej) => {
      const tx = this.db.transaction('records', 'readonly'); const cur = tx.objectStore('records').openCursor();
      cur.onsuccess = () => {
        const c = cur.result; if (!c) return;
        const [col, ...rest] = String(c.key).split('/'); const id = rest.join('/');
        if (this.data[col]) this.data[col].set(id, { ...c.value, id });
        c.continue();
      };
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  }
  persist(col, id, rec) { return this.idb('records', 'readwrite', (st) => { st.put(rec, `${col}/${id}`); }); }
  persistDel(col, id) { return this.idb('records', 'readwrite', (st) => { st.delete(`${col}/${id}`); }); }
  persistFile(id, blob) { return this.idb('files', 'readwrite', (st) => { st.put(blob, id); }); }
  persistFileDel(id) { return this.idb('files', 'readwrite', (st) => { st.delete(id); }); }
  loadFile(id) {
    return new Promise((res, rej) => {
      const tx = this.db.transaction('files', 'readonly'); const r = tx.objectStore('files').get(id);
      r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error);
    });
  }
}

class CloudBackend {
  constructor(db, assets) { this.kind = 'cloud'; this.db = db; this.assets = assets; this.urls = new Map(); }
  async init() {}
  subscribe(col, next, error) {
    let ref = this.db.collection(col);
    if (col === 'log') ref = ref.where('month', '>=', ymAdd(todayISO().slice(0, 7), -2));
    return ref.onSnapshot((snap) => next(snap.docs.map((d) => ({ ...d.data(), id: d.id })), snap.metadata), error);
  }
  async set(col, id, rec) {
    const r = JSON.parse(JSON.stringify(rec)); delete r.id;
    await this.db.collection(col).doc(id).set(r);
  }
  async del(col, id) { await this.db.collection(col).doc(id).delete(); }
  async putFile(file, name, type) {
    if (!this.assets) throw new Error('Tài khoản này không có quyền tải file lên (cần quyền Chỉnh sửa).');
    const at = new Date().toISOString();
    try {
      if (RAW_UPLOAD.has(type)) {
        if (file.size > MAX_RAW) throw { code: 'too_large' };
        const r = await this.assets.upload(file, { type });
        return { id: r.id, name, type, size: file.size, enc: 'raw', at };
      }
      if (file.size > MAX_WRAPPED) throw { code: 'too_large' };
      const b64 = await blobToBase64(file);
      const r = await this.assets.upload(new Blob([b64], { type: 'text/plain' }), { type: 'text/plain' });
      return { id: r.id, name, type, size: file.size, enc: 'b64', at };
    } catch (e) { throw new Error(uploadErrorText(e)); }
  }
  async getBlob(meta) {
    const res = await fetch('/_blob/' + meta.id);
    if (!res.ok) throw new Error(res.status === 404 ? 'File không còn trên hệ thống.' : 'Không tải được file (mã ' + res.status + ').');
    if (meta.enc === 'b64') return base64ToBlob((await res.text()).trim(), meta.type);
    return await res.blob();
  }
  directUrl(meta) { return meta.enc === 'raw' ? '/_blob/' + meta.id : null; }
  async objectUrl(meta) {
    const d = this.directUrl(meta); if (d) return d;
    if (this.urls.has(meta.id)) return this.urls.get(meta.id);
    const u = URL.createObjectURL(await this.getBlob(meta)); this.urls.set(meta.id, u); return u;
  }
  async delFile(meta) { try { if (this.assets) await this.assets.delete(meta.id); } catch (e) { /* đã xóa hoặc không có quyền */ } }
  async download(filename, data) {
    const dl = await window.claude.use('downloads');
    if (!dl) throw new Error('Trình xem này không cho phép tải file về.');
    try { await dl.save({ filename, data: data instanceof Blob ? data : new Blob([data]) }); return true; } catch (e) {
      if (e?.code === 'declined') return false;
      if (e?.code === 'rejected_extension') throw new Error('Định dạng file này không tải về được từ trang dùng chung – hãy nhờ người tải lên gửi bản PDF.');
      throw new Error(e?.message || 'Không tải được file.');
    }
  }
}

/* ---------- controller ---------- */
const Store = {
  backend: null, unsubs: [], loadTimer: null, logCache: {}, logQueue: Promise.resolve(),

  attach(backend) {
    this.unsubs.forEach((u) => { try { u(); } catch (e) { /* ignore */ } });
    this.unsubs = []; this.backend = backend; this.logCache = {};
    S.trainers = []; S.classes = []; S.quotes = []; S.customers = []; S.log = []; S.settings = clone(DEFAULT_SETTINGS);
    S.loaded = {}; rebuildIndex();
    S.sync = { state: 'loading', msg: 'Đang tải dữ liệu…' };
    clearTimeout(this.loadTimer);
    this.loadTimer = setTimeout(() => {
      if (COLLECTIONS.some((c) => !S.loaded[c])) { S.sync = { state: 'warn', msg: 'Chưa kết nối được kho dữ liệu – dữ liệu có thể chưa đầy đủ' }; renderChrome(); }
    }, 10000);
    for (const col of COLLECTIONS) {
      this.unsubs.push(backend.subscribe(col, (rows, meta) => this.onData(col, rows, meta), (err) => this.onError(col, err)));
    }
  },

  onData(col, rows, meta) {
    if (col === 'settings') {
      const main = rows.find((r) => r.id === 'main');
      S.settings = Object.assign(clone(DEFAULT_SETTINGS), main ? clone(main) : {});
      delete S.settings.id;
    } else {
      S[col] = rows;
    }
    if (!meta || !meta.fromCache) S.loaded[col] = true;
    if (COLLECTIONS.every((c) => S.loaded[c])) {
      clearTimeout(this.loadTimer);
      if (S.sync.state !== 'error') S.sync = { state: 'ok', msg: '' };
    }
    rebuildIndex();
    scheduleRender();
  },

  onError(col, err) {
    S.loaded[col] = true;
    S.sync = { state: 'error', msg: err?.code === 'revoked' ? 'Quyền truy cập đã thay đổi – hãy tải lại trang' : 'Mất kết nối kho dữ liệu – hãy tải lại trang' };
    scheduleRender();
  },

  async save(col, rec, label, action) {
    const now = new Date().toISOString();
    const isNew = !rec.createdAt;
    rec.id = rec.id || uid(col.slice(0, 2));
    rec.createdAt = rec.createdAt || now; rec.updatedAt = now; rec.updatedBy = S.me?.id || null;
    try {
      await this.backend.set(col, rec.id, rec);
    } catch (e) {
      this.handleWriteError(e); throw e;
    }
    if (label) this.log(action || (isNew ? 'Thêm' : 'Cập nhật'), col, label);
    return rec;
  },

  async remove(col, rec, label) {
    try { await this.backend.del(col, rec.id); } catch (e) { this.handleWriteError(e); throw e; }
    if (label) this.log('Xóa', col, label);
  },

  async saveSettings(next) {
    const rec = clone(next); rec.updatedAt = new Date().toISOString(); rec.updatedBy = S.me?.id || null;
    try { await this.backend.set('settings', 'main', rec); } catch (e) { this.handleWriteError(e); throw e; }
    this.log('Cập nhật', 'settings', 'Cài đặt chung');
  },

  handleWriteError(e) {
    if (e?.code === 'invalid_argument' && this.backend.kind === 'cloud') {
      S.role.canEdit = false; applyRole();
      toast('Tài khoản này chỉ có quyền xem – không lưu được thay đổi.', 'bad');
    } else if (e?.code === 'quota_exceeded') {
      toast('Kho dữ liệu đã đầy – hãy xóa bớt bản ghi cũ.', 'bad');
    } else {
      toast('Lưu không thành công: ' + (e?.message || 'lỗi kết nối') + '. Hãy thử lại.', 'bad');
    }
  },

  log(action, col, label) {
    if (this.backend.kind === 'demo') return;
    const month = todayISO().slice(0, 7);
    const entry = { t: new Date().toISOString(), by: S.me?.id || null, a: action, k: col, l: String(label).slice(0, 160) };
    (this.logCache[month] = this.logCache[month] || []).push(entry);
    this.logQueue = this.logQueue.then(async () => {
      const doc = S.log.find((l) => l.id === month);
      const merged = new Map();
      for (const e of [...(doc?.entries || []), ...this.logCache[month]]) merged.set(e.t + '|' + e.l + '|' + e.a, e);
      const entries = Array.from(merged.values()).sort((a, b) => a.t.localeCompare(b.t)).slice(-300);
      await this.backend.set('log', month, { month, entries });
    }).catch(() => {});
  },
};

function rebuildIndex() {
  for (const col of ['trainers', 'classes', 'quotes', 'customers']) {
    const m = new Map(); for (const r of S[col]) m.set(r.id, r); S.byId[col] = m;
  }
  FILES.clear();
  const add = (f) => { if (f && f.id) FILES.set(f.id, f); };
  for (const t of S.trainers) { add(t.photo); (t.files || []).forEach(add); }
  for (const c of S.classes) (c.files || []).forEach(add);
  for (const q of S.quotes) { (q.quoteFiles || []).forEach(add); (q.contractFiles || []).forEach(add); }
}

/* ---------- modal ---------- */
const Modals = [];
function openModal({ title, sub = '', body = '', foot = '', size = '', guard = null, onClose = null }) {
  const back = document.createElement('div'); back.className = 'modal-back';
  const hid = uid('mh');
  back.innerHTML = `<div class="modal ${size}" role="dialog" aria-modal="true" aria-labelledby="${hid}">
    <div class="modal-h"><div class="grow"><h2 id="${hid}">${title}</h2>${sub ? `<div class="sub">${sub}</div>` : ''}</div>
    <button type="button" class="btn icon ghost x" data-close aria-label="Đóng">${ic('x')}</button></div>
    <div class="modal-b">${body}</div>${foot ? `<div class="modal-f">${foot}</div>` : ''}</div>`;
  $('#modal-root').append(back);
  const m = {
    back, el: back.querySelector('.modal'), body: back.querySelector('.modal-b'), foot: back.querySelector('.modal-f'), guard, refresh: null,
    async tryClose() { if (m.guard && !(await m.guard())) return; m.close(); },
    close() {
      back.remove(); const i = Modals.indexOf(m); if (i >= 0) Modals.splice(i, 1);
      if (!Modals.length) document.body.style.overflow = '';
      onClose && onClose();
    },
  };
  back.addEventListener('mousedown', (e) => { if (e.target === back && !m.guard) m.close(); });
  back.querySelector('[data-close]').addEventListener('click', () => m.tryClose());
  Modals.push(m); document.body.style.overflow = 'hidden';
  setTimeout(() => { const f = m.el.querySelector('input:not([type=hidden]):not([type=file]):not([type=checkbox]):not([type=radio]), select, textarea'); if (f && guard) f.focus(); }, 30);
  hydrate(m.el);
  return m;
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && Modals.length) Modals[Modals.length - 1].tryClose(); });

function confirmBox(message, { ok = 'Đồng ý', danger = false, title = 'Xác nhận' } = {}) {
  return new Promise((resolve) => {

      foot: `<span class="sp"></span><button type="button" class="btn" data-no>Hủy</button><button type="button" class="btn ${danger ? 'danger' : 'primary'}" data-yes>${esc(ok)}</button>`,

  });
}

/* ---------- photo resize (3x4 portrait friendly) ---------- */
async function prepareImage(file, maxSide = 900) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('decode')); i.src = url; });
    const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
    const blob = await new Promise((res) => cv.toBlob(res, 'image/jpeg', 0.86));
    return new File([blob], (file.name || 'anh').replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' });
  } catch (e) {
    throw new Error(/heic|heif/i.test(file.name + file.type) ? 'Ảnh HEIC (iPhone) chưa đọc được – hãy đổi sang JPG rồi tải lại.' : 'Không đọc được ảnh này – hãy dùng file JPG hoặc PNG.');
  } finally { URL.revokeObjectURL(url); }
}

/** Ô tải file trong biểu mẫu. Trả về { value(), commit(), rollback() } */
function mountFileField(container, initial, { multiple = true, image = false, accept = '', hint = '' } = {}) {
  const st = { files: (initial || []).map((f) => ({ ...f })), added: [], removed: [] };
  const canUpload = S.role.canEdit && (Store.backend.kind !== 'cloud' || Store.backend.assets);
  const inputId = uid('fi');
  function render() {
    if (image) {
      const f = st.files[0];
      container.innerHTML = `<div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
        <span class="photo lg">${f ? `<img data-file="${esc(f.id)}" alt="Ảnh giảng viên">` : 'Ảnh 3×4'}</span>
        <div style="display:flex;flex-direction:column;gap:6px">
          ${canUpload ? `<label class="btn sm" for="${inputId}">${ic('up')} ${f ? 'Đổi ảnh' : 'Tải ảnh lên'}</label>` : ''}
          ${f && canUpload ? '<button type="button" class="btn sm danger" data-rm>Gỡ ảnh</button>' : ''}
          <span class="hint small muted">${esc(hint || 'JPG/PNG, ảnh chân dung 3×4')}</span>
        </div>
        <input type="file" id="${inputId}" accept="image/*" class="sr"></div>`;
      if (f) FILES.set(f.id, f);
      hydrate(container);
      container.querySelector('[data-rm]')?.addEventListener('click', () => { remove(st.files[0].id); });
    } else {
      st.files.forEach((f) => FILES.set(f.id, f));
      container.innerHTML = `<div class="files">${st.files.map((f) => fileRow(f, { removable: canUpload })).join('')}</div>
        ${canUpload ? `<label class="dropzone" for="${inputId}">${ic('up')}<span><b>Chọn file</b> hoặc kéo thả vào đây</span><span class="muted small">${esc(hint || 'PDF, Word, Excel, ảnh – tối đa 20 MB/file')}</span></label>
        <input type="file" id="${inputId}" ${multiple ? 'multiple' : ''} ${accept ? `accept="${esc(accept)}"` : ''} class="sr">` : (st.files.length ? '' : '<div class="muted small">Chưa có file</div>')}`;
      $$('[data-remove]', container).forEach((b) => b.addEventListener('click', () => remove(b.dataset.remove)));
      const dz = container.querySelector('.dropzone');
      if (dz) {
        dz.addEventListener('dragover', (e) => { e.preventDefault(); dz.classList.add('drag'); });
        dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
        dz.addEventListener('drop', (e) => { e.preventDefault(); dz.classList.remove('drag'); addFiles(e.dataTransfer.files); });
      }
    }
    const inp = container.querySelector('input[type=file]');
    inp?.addEventListener('change', () => { addFiles(inp.files); inp.value = ''; });
  }
  function remove(id) {
    const f = st.files.find((x) => x.id === id); if (!f) return;
    st.files = st.files.filter((x) => x.id !== id);
    if (st.added.includes(f)) { st.added = st.added.filter((x) => x !== f); Store.backend.delFile(f); } else st.removed.push(f);
    render();
  }
  async function addFiles(list) {
    for (const file of Array.from(list || [])) {
      const note = document.createElement('div'); note.className = 'muted small'; note.textContent = `Đang tải lên ${file.name}…`;
      container.append(note);
      try {
        let f = file; let type = mimeOf(file);
        if (image) { f = await prepareImage(file); type = 'image/jpeg'; }
        const meta = await Store.backend.putFile(f, image ? f.name : file.name, type);
        if (image && st.files[0]) remove(st.files[0].id);
        st.files.push(meta); st.added.push(meta); FILES.set(meta.id, meta);
      } catch (e) { toast(`${file.name}: ${e.message}`, 'bad'); }
      note.remove(); render();
      if (!multiple && !image) break;
    }
  }
  render();
  return {
    value: () => (image ? st.files[0] || null : st.files.slice()),
    dirty: () => st.added.length > 0 || st.removed.length > 0,
    commit: () => { st.removed.forEach((f) => Store.backend.delFile(f)); st.removed = []; st.added = []; },
    rollback: () => { st.added.forEach((f) => Store.backend.delFile(f)); st.added = []; },
  };
}

const LIBS = {
  pdf: ['https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js', 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'],
  mammoth: ['https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js'],
  xlsx: ['https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'],
};
const scriptCache = {};
function loadScript(src) {
  if (!scriptCache[src]) {
    scriptCache[src] = new Promise((res, rej) => {
      const s = document.createElement('script'); s.src = src; s.async = true;
      s.onload = res; s.onerror = () => { delete scriptCache[src]; rej(new Error('Không tải được thư viện – kiểm tra kết nối mạng.')); };
      document.head.append(s);
    });
  }
  return scriptCache[src];
}
async function lib(name) {
  for (const src of LIBS[name]) await loadScript(src);
  if (name === 'pdf') { const p = window.pdfjsLib; if (p && !p.GlobalWorkerOptions.workerSrc) p.GlobalWorkerOptions.workerSrc = LIBS.pdf[1]; return p; }
  if (name === 'mammoth') return window.mammoth;
  return window.XLSX;
}

/* ---------- file viewer ---------- */
function sanitizeHTML(html) {
  const doc = new DOMParser().parseFromString(`<div>${html}</div>`, 'text/html');
  const allowed = new Set(['P', 'BR', 'STRONG', 'B', 'EM', 'I', 'U', 'S', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'UL', 'OL', 'LI', 'TABLE', 'THEAD', 'TBODY', 'TR', 'TD', 'TH', 'A', 'IMG', 'SUP', 'SUB', 'SPAN', 'DIV', 'BLOCKQUOTE']);
  const walk = (node) => {
    for (const el of Array.from(node.children)) {
      if (!allowed.has(el.tagName)) { el.replaceWith(...Array.from(el.childNodes)); continue; }
      for (const a of Array.from(el.attributes)) {
        const n = a.name.toLowerCase();
        const keep = (n === 'href' && /^(https?:|#)/i.test(a.value)) || (n === 'src' && el.tagName === 'IMG' && /^data:image\//i.test(a.value)) || ['colspan', 'rowspan', 'alt'].includes(n);
        if (!keep) el.removeAttribute(a.name);
      }
      if (el.tagName === 'A') { el.setAttribute('target', '_blank'); el.setAttribute('rel', 'noopener'); }
      walk(el);
    }
  };
  walk(doc.body.firstChild);
  return doc.body.firstChild.innerHTML;
}

function openViewer(files, start = 0, title = '') {
  files = (files || []).filter(Boolean);
  if (!files.length) { toast('Chưa có file để xem.'); return; }
  let idx = Math.min(start, files.length - 1); let token = 0;
  const m = openModal({
    title: esc(title || 'Xem file'), size: 'wide',
    body: `${files.length > 1 ? `<div class="vtabs">${files.map((f, i) => `<button type="button" class="chip" data-i="${i}" aria-pressed="${i === idx}">${esc(f.name)}</button>`).join('')}</div>` : ''}
      <div class="toolbar" style="margin:0"><b class="grow" data-name></b><span data-tools style="display:flex;gap:6px;flex-wrap:wrap"></span></div>
      <div class="viewer" data-view></div>`,
  });
  const view = m.el.querySelector('[data-view]');
  m.el.querySelectorAll('.vtabs .chip').forEach((b) => b.addEventListener('click', () => { idx = Number(b.dataset.i); m.el.querySelectorAll('.vtabs .chip').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); show(); }));
  async function show() {
    const my = ++token; const f = files[idx];
    m.el.querySelector('[data-name]').textContent = f.name;
    const direct = Store.backend.directUrl(f);
    const absDirect = direct ? new URL(direct, location.href).href : '';
    m.el.querySelector('[data-tools]').innerHTML = `${absDirect ? `<a class="btn sm" href="${esc(absDirect)}" target="_blank" rel="noopener">${ic('ext')} Mở tab mới</a>` : ''}<button type="button" class="btn sm" data-dl>${ic('down')} Tải về</button>`;
    m.el.querySelector('[data-dl]').onclick = async () => { try { await Store.backend.download(f.name, await Store.backend.getBlob(f)); } catch (e) { toast(e.message, 'bad'); } };
    view.innerHTML = '<div class="msg">Đang mở file…</div>';
    try {
      const kind = fileKind(f);
      if (kind === 'img') {
        const u = await Store.backend.objectUrl(f); if (my !== token) return;
        view.innerHTML = `<img class="full" alt="${esc(f.name)}" src="${esc(u)}">`;
      } else if (kind === 'pdf') {
        const [pdfjs, blob] = await Promise.all([lib('pdf'), Store.backend.getBlob(f)]); if (my !== token) return;
        const pdf = await pdfjs.getDocument({ data: new Uint8Array(await blob.arrayBuffer()), isEvalSupported: false }).promise;
        view.innerHTML = `<div class="msg small" style="padding:8px">${pdf.numPages} trang</div>`;
        const width = Math.min(1000, view.clientWidth - 24);
        const max = Math.min(pdf.numPages, 40);
        for (let p = 1; p <= max; p++) {
          if (my !== token) return;
          const page = await pdf.getPage(p);
          const base = page.getViewport({ scale: 1 });
          const scale = (width / base.width) * (window.devicePixelRatio || 1);
          const vp = page.getViewport({ scale });
          const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height; cv.style.width = width + 'px';
          view.append(cv);
          await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
        }
        if (pdf.numPages > max) view.insertAdjacentHTML('beforeend', `<div class="msg">Đã hiển thị ${max}/${pdf.numPages} trang – bấm “Tải về” để xem đầy đủ.</div>`);
      } else if (kind === 'docx') {
        const [mammoth, blob] = await Promise.all([lib('mammoth'), Store.backend.getBlob(f)]); if (my !== token) return;
        const r = await mammoth.convertToHtml({ arrayBuffer: await blob.arrayBuffer() });
        view.innerHTML = `<div class="doc">${sanitizeHTML(r.value) || '<p>(Tài liệu trống)</p>'}</div>`;
      } else if (kind === 'sheet') {
        const [XLSX, blob] = await Promise.all([lib('xlsx'), Store.backend.getBlob(f)]); if (my !== token) return;
        const wb = XLSX.read(new Uint8Array(await blob.arrayBuffer()), { type: 'array' });
        let html = '';
        for (const name of wb.SheetNames.slice(0, 8)) {
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: false, defval: '' }).slice(0, 400);
          html += `<div style="padding:10px 12px"><div class="sec-title">${esc(name)}</div><div class="tbl-wrap"><table class="sheet">${rows.map((r) => `<tr>${r.slice(0, 40).map((c) => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div></div>`;
        }
        view.innerHTML = html || '<div class="msg">Bảng tính trống.</div>';
      } else {
        view.innerHTML = `<div class="msg"><b>Định dạng .${esc(extOf(f.name) || '?')} chưa xem trực tiếp được.</b><br>Bấm “Tải về” để mở bằng phần mềm trên máy. Nên lưu báo giá/hợp đồng dạng PDF để ai cũng xem được ngay.</div>`;
      }
    } catch (e) {
      if (my === token) view.innerHTML = `<div class="msg"><b>Không mở được file.</b><br>${esc(e.message || '')}<br>Hãy bấm “Tải về” để xem trên máy.</div>`;
    }
  }
  show();
}

/* ---------- bar chart (single series) ---------- */
function barChart(data, { height = 190, fmt = moneyShort } = {}) {
  const W = 640, H = height, padL = 46, padR = 8, padT = 10, padB = 24;
  const max = Math.max(1, ...data.map((d) => d.value));
  const step = niceStep(max / 3);
  const top = Math.ceil(max / step) * step;
  const iw = W - padL - padR, ih = H - padT - padB;
  const bw = iw / data.length;
  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ cột">`;
  for (let v = 0; v <= top + 1e-6; v += step) {
    const y = padT + ih - (v / top) * ih;
    svg += `<line class="grid" x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}"/><text x="${padL - 6}" y="${y + 4}" text-anchor="end">${esc(fmt(v))}</text>`;
  }
  data.forEach((d, i) => {
    const h = (d.value / top) * ih; const x = padL + i * bw; const w = Math.max(4, bw - 6);
    const y = padT + ih - h;
    const r = Math.min(4, h / 2);
    const path = h > 0 ? `M${x + 3},${padT + ih} V${y + r} q0,-${r} ${r},-${r} H${x + 3 + w - r} q${r},0 ${r},${r} V${padT + ih} Z` : '';
    svg += `<g data-tip="${esc(d.tip || d.label + ': ' + fmt(d.value))}"><rect class="hit" x="${x}" y="${padT}" width="${bw}" height="${ih}"/>${path ? `<path class="bar${d.cur ? ' cur' : ''}" d="${path}"/>` : ''}<title>${esc(d.tip || '')}</title></g>`;
    svg += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle"${d.cur ? ' style="font-weight:700;fill:var(--fg)"' : ''}>${esc(d.label)}</text>`;
  });
  return `<div class="chart-box">${svg}</svg></div>`;
}
function niceStep(raw) {
  if (raw <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}
document.addEventListener('mousemove', (e) => {
  const g = e.target.closest?.('.chart-box g[data-tip]');
  const box = e.target.closest?.('.chart-box');
  $$('.chart-tip').forEach((t) => { if (!box || t.parentNode !== box || !g) t.remove(); });
  if (!g || !box) return;
  let tip = box.querySelector('.chart-tip');
  if (!tip) { tip = document.createElement('div'); tip.className = 'chart-tip'; box.append(tip); }
  tip.textContent = g.dataset.tip;
  const r = box.getBoundingClientRect();
  tip.style.left = Math.min(r.width - 60, Math.max(60, e.clientX - r.left)) + 'px';
  tip.style.top = e.clientY - r.top + 'px';
});

    html += '</div></section>';

    // trainers load (selected month)

function classLi(c) {

  return `<li class="clickable" data-act="class-view" data-id="${esc(c.id)}"><span class="when"><b>${c.startDate.slice(8, 10)}</b><span>${dowOf(c.startDate)} · T${Number(c.startDate.slice(5, 7))}</span></span>

    <div class="s">${esc([fmtDateRange(c.startDate, c.endDate), c.startTime && `${c.startTime}–${c.endTime || ''}`, groupsText(c.groups), c.students ? c.students + ' HV' : ''].filter(Boolean).join(' · '))}</div>
    <div class="s">${rtag(c.region)} · ${esc(c.location || 'Chưa có địa điểm')}</div>
    <div class="s">${(c.trainerIds || []).length ? 'GV: ' + esc(trainerNames(c.trainerIds)) : '<span style="color:var(--warn);font-weight:600">Chưa phân công giảng viên</span>'}</div></div>

function docButtons(c) {

}

async function ensureCustomer(name, extra = {}, overwrite = false) {
  name = String(name || '').trim(); if (!name) return null;
  const clean = Object.fromEntries(Object.entries(extra).filter(([, v]) => v !== undefined && v !== null && String(v).trim() !== ''));
  const c = findCustomerByName(name);
  if (c) {
    const upd = { ...c }; let changed = false;
    for (const [k, v] of Object.entries(clean)) if (overwrite ? upd[k] !== v : !upd[k]) { upd[k] = v; changed = true; }
    if (changed) await Store.save('customers', upd);
    return upd;
  }
  return Store.save('customers', { id: uid('cu'), name, ...clean }, name, 'Thêm');
}

function formGuard(getDirty, fileFields) {
  return async () => {
    if (!getDirty()) { fileFields.forEach((x) => x.rollback()); return true; }
    const ok = await confirmBox('Các thay đổi chưa được lưu sẽ bị bỏ. Đóng biểu mẫu?', { ok: 'Bỏ thay đổi', danger: true });
    if (ok) fileFields.forEach((x) => x.rollback());
    return ok;
  };
}

      vatRate: val(root, 'cf-vat') === '' ? Number(settings().vatRate) : Number(val(root, 'cf-vat')), costTrainer: parseMoney(val(root, 'cf-ctrainer')), costTrainerMode: ctMode,
      costTravel: parseMoney(val(root, 'cf-ctravel')), costOther: parseMoney(val(root, 'cf-cother')), status: val(root, 'cf-status'), quoteId: val(root, 'cf-quote') || null,
      passed: val(root, 'cf-passed') === '' ? '' : Number(val(root, 'cf-passed')), certIssued: root.querySelector('#cf-cert').checked, invoiced: root.querySelector('#cf-inv').checked, notes: val(root, 'cf-notes'),
    };
  }
  let selected = new Set(c.trainerIds || []);
  function renderPicker(d) {
    const all = root.querySelector('#cf-allreg').checked;
    let list = all ? trainersInRegion('all') : trainersInRegion(d.region);
    for (const id of selected) if (!list.some((x) => x.id === id) && trainer(id)) list = [trainer(id), ...list];
    const range = { startDate: d.startDate, endDate: d.endDate, startTime: d.startTime, endTime: d.endTime };
    root.querySelector('[data-trhint]').textContent = d.region ? `${list.length} giảng viên${all ? ' (mọi vùng)' : ' thuộc ' + regionName(d.region)} · trạng thái theo ngày ${fmtDateRange(d.startDate, d.endDate)}` : 'Chọn vùng đào tạo để xem giảng viên của vùng';
    root.querySelector('[data-picker]').innerHTML = list.length ? list.map((x) => {
      const busy = d.startDate ? busyClasses(x.id, range, existing?.id) : [];
      const specs = (x.specialties || []).slice(0, 3).join(', ');
      const okGroup = !d.groups.length || !(x.groups || []).length || d.groups.every((g) => (x.groups || []).includes(g));
      return `<label class="${busy.length ? 'busy' : ''}"><input type="checkbox" name="cf-tr" value="${esc(x.id)}"${selected.has(x.id) ? ' checked' : ''}>${avatar(x)}<span class="info"><span class="n">${esc(x.name)}</span> <span class="muted small">${esc(x.phone || '')}</span>
        <span class="s" style="display:block">${busy.length ? `<b style="color:var(--bad)">Đã có lịch:</b> ${esc(busy.map((b) => `${classLabel(b)} ${fmtDateRange(b.startDate, b.endDate)} ${b.startTime || ''}–${b.endTime || ''}`).join('; '))}` : '<b style="color:var(--ok)">Rảnh</b>'}${x.region !== d.region ? ' · vùng ' + esc(regionName(x.region)) : ''}</span>
        <span class="s muted" style="display:block">${esc(specs)}${!okGroup ? ' · <span style="color:var(--warn)">chưa đăng ký dạy ' + esc(groupsText(d.groups.filter((g) => !(x.groups || []).includes(g)))) + '</span>' : ''}${x.dailyRate ? ' · ' + esc(moneyShort(x.dailyRate)) + '/ngày' : ''}</span></span></label>`;
    }).join('') : `<div class="empty">${d.region ? 'Vùng này chưa có giảng viên đang hoạt động. Tick “Hiện cả giảng viên vùng khác” hoặc thêm giảng viên.' : 'Chọn vùng đào tạo.'}</div>`;
    hydrate(root.querySelector('[data-picker]'));
  }
  function renderQuotes(d) {
    const sel = root.querySelector('#cf-quote'); const cur = sel.value || c.quoteId || '';
    const qs = S.quotes.filter((q) => norm(q.customerName) === norm(d.customerName) || q.id === cur);
    sel.innerHTML = opt('', qs.length ? '— Chưa gắn báo giá —' : d.customerName ? '— Khách này chưa có báo giá —' : '— Nhập khách hàng trước —', !cur) + qs.map((q) => opt(q.id, `${q.no || 'BG'} · ${fmtD(q.date)} · ${QUOTE_STATUS[q.status]?.label || ''}${q.contractNo ? ' · HĐ ' + q.contractNo : ''}`, q.id === cur)).join('');
    const q = sel.value && quote(sel.value);
    root.querySelector('[data-hint="cf-quote"]').innerHTML = q ? `${fileButtons(q.quoteFiles, 'Xem báo giá')} ${fileButtons(q.contractFiles, 'Xem hợp đồng')}` : 'Gắn để xem nhanh báo giá, hợp đồng từ lịch.';
  }
  function refresh(src) {
    const d = read();
    // customer hint
    const cu = findCustomerByName(d.customerName);
    root.querySelector('[data-hint="cf-customer"]').textContent = !d.customerName ? '' : cu ? `Khách hàng đã có · ${customerStats(cu.id).classes} lớp trước đây` : 'Khách hàng mới – sẽ được thêm vào danh sách khách hàng';
    if (src === 'cf-customer' && cu) {
      if (!val(root, 'cf-contact') && cu.contact) root.querySelector('#cf-contact').value = cu.contact;
      if (!val(root, 'cf-cphone') && cu.phone) root.querySelector('#cf-cphone').value = cu.phone;
      if (cu.region && !existing && !root.querySelector('input[name="cf-region"]:checked')) { const r = root.querySelector(`input[name="cf-region"][value="${cu.region}"]`); if (r) r.checked = true; }
    }
    // duration hint
    const sg = suggestedDays(d.groups, d.kind);
    root.querySelector('[data-hours]').innerHTML = d.groups.length ? `${d.groups.map((g) => `Nhóm ${g}: ${GROUPS[g].desc.toLowerCase()} – cấp ${GROUPS[g].paper}`).join(' · ')}<br>Thời lượng tối thiểu gợi ý: <b>${sg.hrs} giờ ≈ ${sg.days} ngày</b>${d.kind === 'Huấn luyện định kỳ' ? ' (định kỳ ≈ 50% lần đầu)' : ''}${sg.days && d.startDate ? ` <button type="button" class="btn xs" data-act-local="apply-days" data-days="${sg.days}">Đặt ngày kết thúc ${fmtD(addDays(d.startDate, sg.days - 1))}</button>` : ''}` : 'Chọn nhóm để gợi ý thời lượng (số giờ theo Cài đặt).';
    if (src === 'cf-from' && d.endDate < d.startDate) root.querySelector('#cf-to').value = d.startDate;
    const d2 = read();
    const days = classDays(d2);
    root.querySelector('[data-hint="cf-to"]').textContent = d2.endDate < d2.startDate ? 'Ngày kết thúc trước ngày bắt đầu' : `${days} ngày học`;
    selected = new Set(d2.trainerIds.length || src === 'picker' ? d2.trainerIds : [...selected]);
    renderPicker(d2);
    // conflicts
    const tmp = { ...d2, id: existing?.id || '__new', trainerIds: [...selected] };
    const cx = conflictsFor(tmp);
    root.querySelector('[data-conflict]').innerHTML = cx.length ? `<div class="banner warn" style="margin:0"><b>Trùng lịch:</b>&nbsp;${esc(cx.map((x) => `${trainerNames(x.trainers)} đang dạy ${classLabel(x.cls)} (${fmtDateRange(x.cls.startDate, x.cls.endDate)} ${x.cls.startTime || ''}–${x.cls.endTime || ''})`).join('; '))}</div>` : '';
    root.querySelector('[data-override]').classList.toggle('hide', !cx.length);
    // price
    const tier = tierFor(d2.students);
    if (priceMode === 'auto' && src !== 'cf-price') { const p = tier ? tier.price : 0; root.querySelector('#cf-price').value = p ? money(p) : ''; }
    const pNow = parseMoney(val(root, 'cf-price'));
    root.querySelector('[data-hint="cf-price"]').innerHTML = `${esc(tierText(d2.students))}${tier && pNow !== tier.price ? ` · <b style="color:var(--accent)">Giá điều chỉnh</b> <button type="button" class="btn xs" data-act-local="price-auto">Dùng giá bảng</button>` : ''}`;
    // trainer cost
    const auto = trainerCostAuto([...selected], days);
    if (ctMode === 'auto' && src !== 'cf-ctrainer') root.querySelector('#cf-ctrainer').value = auto ? money(auto) : '';
    const ctNow = parseMoney(val(root, 'cf-ctrainer'));
    root.querySelector('[data-hint="cf-ctrainer"]').innerHTML = auto ? `Theo thù lao/ngày: ${esc(money(auto))}${ctNow !== auto ? ` <button type="button" class="btn xs" data-act-local="ct-auto">Tính lại</button>` : ''}` : 'Nhập thù lao/ngày cho giảng viên để tự tính';
    const mm = classMoney({ ...read(), status: 'confirmed' });
    root.querySelector('[data-moneybox]').innerHTML = `<div class="m"><div class="k">Doanh thu (chưa VAT)</div><div class="v">${money(mm.rev)}</div></div><div class="m"><div class="k">VAT</div><div class="v">${money(mm.vat)}</div></div><div class="m hl"><div class="k">Khách thanh toán</div><div class="v">${money(mm.total)}</div></div><div class="m"><div class="k">Tổng chi phí</div><div class="v">${money(mm.cost)}</div></div><div class="m ${mm.profit < 0 ? 'neg' : 'pos'}"><div class="k">Lãi gộp${mm.rev ? ` (${Math.round(mm.margin * 100)}%)` : ''}</div><div class="v">${money(mm.profit)}</div></div>`;
    if (src === 'cf-customer' || src === 'init' || src === 'cf-quote') renderQuotes(d2);
    if (src === 'cf-quote') {
      const q = quote(val(root, 'cf-quote'));
      if (q && !d2.groups.length && (q.groups || []).length) { q.groups.forEach((g) => { const cb = root.querySelector(`input[name="cf-group"][value="${g}"]`); if (cb) cb.checked = true; }); refresh('groups'); }
    }
  }
  form.addEventListener('input', (e) => {
    const id = e.target.id || e.target.name;
    if (id === 'cf-price') priceMode = 'manual';
    if (id === 'cf-ctrainer') ctMode = 'manual';
    if (['cf-notes', 'cf-title', 'cf-location', 'cf-contact', 'cf-cphone', 'cf-passed'].includes(id)) return;
    refresh(e.target.name === 'cf-tr' ? 'picker' : id);
  });
  form.addEventListener('change', (e) => { if (e.target.type === 'radio' || e.target.type === 'checkbox' || e.target.tagName === 'SELECT') refresh(e.target.name === 'cf-tr' ? 'picker' : e.target.id || e.target.name); });
  root.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act-local]'); if (!b) return;
    if (b.dataset.actLocal === 'apply-days') { root.querySelector('#cf-to').value = addDays(val(root, 'cf-from'), Number(b.dataset.days) - 1); refresh('cf-to'); }
    if (b.dataset.actLocal === 'price-auto') { priceMode = 'auto'; refresh('price-auto'); }
    if (b.dataset.actLocal === 'ct-auto') { ctMode = 'auto'; refresh('ct-auto'); }
  });
  refresh('init');
  const snap = JSON.stringify(read());
  m.guard = formGuard(() => JSON.stringify(read()) !== snap || files.dirty(), [files]);
  root.querySelector('[data-cancel]').onclick = () => m.tryClose();
  root.querySelector('[data-del]')?.addEventListener('click', async () => { if (await deleteClass(existing)) { m.guard = null; m.close(); } });
  root.querySelector('[data-save]').onclick = async (ev) => {
    const d = read(); const err = [];
    if (!d.customerName) err.push('tên khách hàng');
    if (!d.startDate) err.push('ngày bắt đầu');
    if (d.endDate < d.startDate) err.push('ngày kết thúc phải sau ngày bắt đầu');
    if (!d.region) err.push('vùng đào tạo');
    if (!(d.students > 0)) err.push('số học viên');
    if (err.length) { toast('Cần nhập: ' + err.join(', '), 'bad'); return; }
    const cx = conflictsFor({ ...d, id: existing?.id || '__new' });
    if (cx.length && !root.querySelector('#cf-override').checked) { toast('Giảng viên bị trùng lịch – đổi giảng viên/ngày, hoặc tick “Vẫn lưu dù trùng lịch”.', 'bad'); root.querySelector('[data-conflict]').scrollIntoView({ block: 'center' }); return; }
    ev.target.disabled = true;
    try {
      const cu = await ensureCustomer(d.customerName, { contact: d.contact, phone: d.contactPhone, region: d.region, address: '' });
      const rec = { ...(existing || {}), ...d, customerId: cu.id, customerName: cu.name, files: files.value() };
      if (rec.status === 'done' && (rec.passed === '' || rec.passed === undefined)) rec.passed = rec.students;
      await Store.save('classes', rec, `${cu.name} – ${fmtDateRange(rec.startDate, rec.endDate)}`);
      files.commit(); m.guard = null; m.close();
      toast(existing ? 'Đã cập nhật lớp.' : 'Đã thêm lớp vào lịch.', 'ok');
      S.ui.selDate = rec.startDate; if (!classInMonth(rec, S.ui.month) && S.ui.tab === 'lich') S.ui.month = ymOf(rec.startDate);
      scheduleRender();
    } catch (e) { ev.target.disabled = false; }
  };
}

async function deleteClass(c) {
  if (!c) return false;
  if (!(await confirmBox(`Xóa lớp <b>${esc(classLabel(c))}</b> (${esc(fmtDateRange(c.startDate, c.endDate))})? Các file hồ sơ lớp cũng bị xóa.`, { ok: 'Xóa lớp', danger: true }))) return false;
  try { await Store.remove('classes', c, `${classLabel(c)} – ${fmtDateRange(c.startDate, c.endDate)}`); (c.files || []).forEach((x) => Store.backend.delFile(x)); toast('Đã xóa lớp.', 'ok'); return true; } catch (e) { return false; }
}

async function markDone(c) {
  const rec = { ...c, status: 'done', passed: c.passed === '' || c.passed === undefined ? c.students : c.passed };
  try { await Store.save('classes', rec, `${classLabel(c)} – hoàn thành`, 'Hoàn thành'); toast('Đã đánh dấu lớp hoàn thành.', 'ok'); } catch (e) { /* đã báo lỗi */ }
}

  });

    name: val(root, 'tf-name'), phone: val(root, 'tf-phone'), email: val(root, 'tf-email'), birthYear: val(root, 'tf-birth'), address: val(root, 'tf-address'),
