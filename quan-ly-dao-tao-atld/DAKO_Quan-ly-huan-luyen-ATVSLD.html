    customerName: val(root, 'qf-customer'), contact: val(root, 'qf-contact'), contactPhone: val(root, 'qf-cphone'),
    no: val(root, 'qf-no'), date: val(root, 'qf-date'), validUntil: val(root, 'qf-valid'), owner: val(root, 'qf-owner'), groups: checkedVals(root, 'qf-group').map(Number),
    students: Number(val(root, 'qf-students')) || 0, classCount: Math.max(1, Number(val(root, 'qf-classes')) || 1), unitPrice: parseMoney(val(root, 'qf-unit')), priceMode,
    amount: parseMoney(val(root, 'qf-amount')), amountMode, status: val(root, 'qf-status'), notes: val(root, 'qf-notes'),
    contractNo: val(root, 'qf-cno'), contractDate: val(root, 'qf-cdate'), contractAmount: val(root, 'qf-camount') === '' ? null : parseMoney(val(root, 'qf-camount')), paymentDue: val(root, 'qf-due'),
  });
  function refresh(src) {
    const d = read();
    const cu = findCustomerByName(d.customerName);
    root.querySelector('[data-hint="qf-customer"]').textContent = !d.customerName ? '' : cu ? `Khách hàng đã có · ${S.quotes.filter((x) => x.customerId === cu.id && x.id !== existing?.id).length} báo giá trước` : 'Khách hàng mới – sẽ được thêm vào danh sách khách hàng';
    if (src === 'qf-customer' && cu) {
      [['qf-tax', cu.taxCode], ['qf-address', cu.address], ['qf-contact', cu.contact], ['qf-cphone', cu.phone], ['qf-cemail', cu.email]].forEach(([id, v]) => { if (v && !val(root, id)) root.querySelector('#' + id).value = v; });
      if (cu.region && !val(root, 'qf-cregion')) root.querySelector('#qf-cregion').value = cu.region;
    }
    const per = d.students ? Math.ceil(d.students / d.classCount) : 0;
    root.querySelector('[data-hint="qf-classes"]').textContent = per ? `≈ ${per} học viên/lớp` : ' ';
    const tier = tierFor(per);
    if (priceMode === 'auto' && src !== 'qf-unit') root.querySelector('#qf-unit').value = tier ? money(tier.price) : '';
    const unit = parseMoney(val(root, 'qf-unit'));
    root.querySelector('[data-hint="qf-unit"]').innerHTML = `${esc(per ? tierText(per) : 'Nhập số học viên để tính theo bảng giá')}${tier && unit !== tier.price ? ` · <b style="color:var(--accent)">Giá điều chỉnh</b> <button type="button" class="btn xs" data-act-local="price-auto">Dùng giá bảng</button>` : ''}`;
    if (amountMode === 'auto' && src !== 'qf-amount' && unit) root.querySelector('#qf-amount').value = money(unit * d.classCount);
    const amt = parseMoney(val(root, 'qf-amount'));
    root.querySelector('[data-hint="qf-amount"]').innerHTML = `${amt ? esc(moneyD(amt)) : 'Chưa có tổng giá trị'}${unit && amt !== unit * d.classCount ? ` <button type="button" class="btn xs" data-act-local="amount-auto">= đơn giá × số lớp</button>` : ''}`;
  }
  root.querySelector('#qf').addEventListener('input', (e) => {
    if (e.target.id === 'qf-unit') priceMode = 'manual';
    if (e.target.id === 'qf-amount') amountMode = 'manual';
    if (e.target.id === 'qf-date' && !existing) root.querySelector('#qf-no').value = nextQuoteNo(val(root, 'qf-date'));
    refresh(e.target.id);
  });
  root.querySelector('#qf').addEventListener('change', (e) => refresh(e.target.id));
  root.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act-local]'); if (!b) return;
    if (b.dataset.actLocal === 'price-auto') { priceMode = 'auto'; refresh('x'); }
    if (b.dataset.actLocal === 'amount-auto') { amountMode = 'auto'; refresh('x'); }
  });
  refresh('init');
  if (preset.focusContract) setTimeout(() => root.querySelector('#qf-contract-sec').scrollIntoView({ block: 'start' }), 60);
  const snap = JSON.stringify(read());
  m.guard = formGuard(() => JSON.stringify(read()) !== snap || qf.dirty() || cf.dirty(), [qf, cf]);
  root.querySelector('[data-cancel]').onclick = () => m.tryClose();
  root.querySelector('[data-del]')?.addEventListener('click', async () => { if (await deleteQuote(existing)) { m.guard = null; m.close(); } });
  root.querySelector('[data-save]').onclick = async (ev) => {
    const d = read();
    if (!d.customerName) { toast('Cần nhập tên công ty khách hàng.', 'bad'); return; }
    if (S.quotes.some((x) => x.id !== existing?.id && x.no && x.no === d.no)) { toast(`Số báo giá ${d.no} đã tồn tại – hãy đổi số khác.`, 'bad'); return; }
    let movedToContract = false;
    if ((d.contractNo || d.contractDate || cf.value().length) && !['signed', 'rejected'].includes(d.status)) { d.status = 'signed'; movedToContract = true; }
    if (d.status === 'signed' && !d.contractDate) d.contractDate = todayISO();
    ev.target.disabled = true;
    try {
      const cu = await ensureCustomer(d.customerName, { taxCode: val(root, 'qf-tax'), address: val(root, 'qf-address'), region: val(root, 'qf-cregion'), contact: d.contact, phone: d.contactPhone, email: val(root, 'qf-cemail') }, true);
      const rec = { ...(existing || {}), ...d, customerId: cu.id, customerName: cu.name, quoteFiles: qf.value(), contractFiles: cf.value(), payments: existing?.payments || [] };
      delete rec.vatRate;
      await Store.save('quotes', rec, `${rec.no} – ${cu.name}`);
      qf.commit(); cf.commit(); m.guard = null; m.close();
      toast(movedToContract ? 'Đã lưu – hồ sơ chuyển sang danh sách Hợp đồng và được tính doanh thu.' : existing ? 'Đã cập nhật báo giá.' : 'Đã thêm báo giá.', 'ok');
    } catch (e) { ev.target.disabled = false; }
  };
}

async function deleteQuote(q) {
  if (!q) return false;
  const cls = quoteClasses(q);
  if (!(await confirmBox(`Xóa ${isContract(q) ? 'hồ sơ hợp đồng' : 'báo giá'} <b>${esc(q.no || '')} – ${esc(q.customerName)}</b> cùng các file báo giá, hợp đồng, chứng từ?${cls.length ? `<br><br>${cls.length} lớp đang gắn với hồ sơ này sẽ được giữ lại nhưng bỏ liên kết.` : ''}`, { ok: 'Xóa', danger: true }))) return false;
  try {
    for (const c of cls) await Store.save('classes', { ...c, quoteId: null });
    await Store.remove('quotes', q, `${q.no || ''} – ${q.customerName}`);
    [...(q.quoteFiles || []), ...(q.contractFiles || []), ...(q.costFiles || [])].forEach((x) => Store.backend.delFile(x));
    toast('Đã xóa.', 'ok'); return true;
  } catch (e) { return false; }
}

  bindMoney(m.el);

function customerForm(existing) {
  if (!S.role.canEdit) return;
  const c = existing ? clone(existing) : { region: regionList()[0]?.id };
  const m = openModal({
    title: existing ? 'Sửa thông tin khách hàng' : 'Thêm khách hàng', size: '',
    body: `<form id="uf" novalidate autocomplete="off"><div class="fgrid">
      ${f('uf-name', 'Tên công ty', inp('uf-name', c.name, 'required placeholder="Tên đầy đủ theo đăng ký kinh doanh"'), { cls: 'full', req: true })}
      ${f('uf-tax', 'Mã số thuế', inp('uf-tax', c.taxCode, 'placeholder="MST doanh nghiệp"'))}
      ${f('uf-region', 'Vùng', `<select class="input" id="uf-region">${opt('', '— Chọn vùng —', !c.region)}${regionList().map((r) => opt(r.id, r.name, c.region === r.id)).join('')}</select>`)}
      ${f('uf-industry', 'Ngành nghề', inp('uf-industry', c.industry, 'placeholder="VD: Đóng tàu, cảng biển, xây dựng…"'))}
      ${f('uf-address', 'Địa chỉ', inp('uf-address', c.address, 'placeholder="Địa chỉ trụ sở / nhà máy"'), { cls: 'full' })}
      ${f('uf-contact', 'Người liên hệ', inp('uf-contact', c.contact, 'placeholder="Họ tên, chức vụ"'))}
      ${f('uf-phone', 'Số điện thoại', inp('uf-phone', c.phone, 'inputmode="tel" placeholder="Số điện thoại"'))}
      ${f('uf-email', 'Email', inp('uf-email', c.email, 'type="email" placeholder="email@congty.vn"'))}
      ${f('uf-notes', 'Ghi chú', `<textarea class="input" id="uf-notes" rows="2" placeholder="Đặc thù ngành nghề, lịch huấn luyện định kỳ mong muốn…">${esc(c.notes || '')}</textarea>`, { cls: 'full' })}
    </div></form>`,
    foot: `${existing ? `<button type="button" class="btn danger" data-del>${ic('trash')} Xóa</button>` : ''}<span class="sp"></span><button type="button" class="btn" data-cancel>Hủy</button><button type="button" class="btn primary" data-save>${ic('check')} Lưu</button>`,
  });
  const root = m.el;
  const read = () => ({ name: val(root, 'uf-name'), taxCode: val(root, 'uf-tax'), region: val(root, 'uf-region'), industry: val(root, 'uf-industry'), address: val(root, 'uf-address'), contact: val(root, 'uf-contact'), phone: val(root, 'uf-phone'), email: val(root, 'uf-email'), notes: val(root, 'uf-notes') });
  const snap = JSON.stringify(read());
  m.guard = formGuard(() => JSON.stringify(read()) !== snap, []);
  root.querySelector('[data-cancel]').onclick = () => m.tryClose();
  root.querySelector('[data-del]')?.addEventListener('click', async () => { if (await deleteCustomer(existing)) { m.guard = null; m.close(); } });
  root.querySelector('[data-save]').onclick = async (ev) => {
    const d = read();
    if (!d.name) { toast('Cần nhập tên công ty.', 'bad'); return; }
    const dup = findCustomerByName(d.name);
    if (dup && dup.id !== existing?.id) { toast(`Đã có khách hàng “${dup.name}”.`, 'bad'); return; }
    ev.target.disabled = true;
    try {
      const rec = await Store.save('customers', { ...(existing || {}), ...d }, d.name);
      if (existing && existing.name !== d.name) {
        for (const c2 of S.classes.filter((x) => x.customerId === rec.id)) await Store.save('classes', { ...c2, customerName: d.name });
        for (const q2 of S.quotes.filter((x) => x.customerId === rec.id)) await Store.save('quotes', { ...q2, customerName: d.name });
        for (const r2 of S.rosters.filter((x) => x.customerId === rec.id)) await Store.save('rosters', { ...r2, customerName: d.name });
      }
      m.guard = null; m.close(); toast('Đã lưu khách hàng.', 'ok');
    } catch (e) { ev.target.disabled = false; }
  };
}

async function deleteCustomer(c) {
  if (!c) return false;
  const n = S.classes.filter((x) => x.customerId === c.id).length + S.quotes.filter((x) => x.customerId === c.id).length + S.rosters.filter((x) => x.customerId === c.id).length;
  if (n) { toast(`Không xóa được: ${c.name} đang có ${n} lớp/báo giá/đợt cấp liên quan.`, 'bad'); return false; }
  if (!(await confirmBox(`Xóa khách hàng <b>${esc(c.name)}</b>?`, { ok: 'Xóa', danger: true }))) return false;
  try { await Store.remove('customers', c, c.name); toast('Đã xóa khách hàng.', 'ok'); return true; } catch (e) { return false; }
}

      ${c.notes ? `<div><div class="sec-title">Ghi chú</div><div style="white-space:pre-wrap">${esc(c.notes)}</div></div>` : ''}`;
    if (!m.foot) { m.el.insertAdjacentHTML('beforeend', '<div class="modal-f"></div>'); m.foot = m.el.querySelector('.modal-f'); }
    m.foot.innerHTML = `${editorStamp(c)}<span class="sp"></span><span class="edit-only" style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn danger" data-x="del">${ic('trash')} Xóa</button><button type="button" class="btn" data-x="quote">${ic('plus')} Tạo báo giá</button><button type="button" class="btn" data-x="class">${ic('plus')} Lên lịch lớp</button><button type="button" class="btn primary" data-x="edit">${ic('edit')} Sửa</button></span>`;
    const on = (sel, fn) => m.el.querySelector(sel)?.addEventListener('click', fn);
    on('[data-x=del]', async () => { if (await deleteCustomer(c)) m.close(); });
    on('[data-x=edit]', () => { m.close(); customerForm(c); });
    on('[data-x=quote]', () => { m.close(); quoteForm(null, { customerName: c.name, customerId: c.id, contact: c.contact, contactPhone: c.phone, groups: dues.filter((d) => daysBetween(todayISO(), d.due) <= (Number(settings().warnDays) || 60)).map((d) => d.group) }); });
    on('[data-x=class]', () => { m.close(); classForm(null, { from: { customerName: c.name, customerId: c.id, contact: c.contact, contactPhone: c.phone, region: c.region || regionList()[0]?.id, status: 'confirmed', priceMode: 'auto' } }); });
    hydrate(m.el); fillNames(m.el);
  }
}

/* ============================================================
   EXPORT – báo cáo Excel chuyên nghiệp (ExcelJS): logo, tiêu đề, Times New Roman,
   số dạng 1.000.000 đ (dấu chấm phần nghìn ở mọi máy), thống kê theo tuần/tháng/quý/năm,
   cộng nhóm + tổng cộng, khối ký, khổ A4 sẵn in.
   ============================================================ */

const XLSX_MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
const EXPORTS = {
  'tong-quan': { name: 'Tổng hợp', file: 'Bao-cao-tong-hop' },
  lich: { name: 'Lịch giảng dạy', file: 'Lich-giang-day' },
  'giang-vien': { name: 'Giảng viên – thù lao', file: 'Giang-vien-thu-lao' },
  'hoc-vien': { name: 'Học viên', file: 'Hoc-vien' },
  'bao-gia': { name: 'Báo giá', file: 'Bao-gia' },
  'hop-dong': { name: 'Hợp đồng', file: 'Hop-dong' },
  'doanh-thu': { name: 'Doanh thu – lợi nhuận', file: 'Doanh-thu-loi-nhuan' },
  'khach-hang': { name: 'Khách hàng', file: 'Khach-hang' },
};
LIBS.exceljs = ['https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js'];

/* ---------- hộp thoại xuất ---------- */
function openExport(tab) {
  const meta = EXPORTS[tab] || EXPORTS['tong-quan'];
  const y = todayISO().slice(0, 4); const ym = todayISO().slice(0, 7);
  const q = periodOf(todayISO(), 'quarter');
  const allDates = [...S.classes.map((c) => c.startDate), ...S.quotes.map((x) => x.contractDate || x.date), ...allStudents().map((x) => x.v.issueDate)].filter(Boolean).sort();
  const presets = [
    ['month', 'Tháng này', ym + '-01', monthEnd(ym)], ['quarter', 'Quý này', q.start, q.end], ['year', 'Năm nay', `${y}-01-01`, `${y}-12-31`],
    ['last', 'Năm trước', `${Number(y) - 1}-01-01`, `${Number(y) - 1}-12-31`], ['all', 'Toàn bộ dữ liệu', allDates[0] || `${y}-01-01`, allDates[allDates.length - 1] > `${y}-12-31` ? allDates[allDates.length - 1] : `${y}-12-31`],
  ];
  const sheets = tab === 'tong-quan' ? ['Tổng quan', 'Lịch giảng dạy', 'Doanh thu – lợi nhuận', 'Hợp đồng', 'Báo giá', 'Giảng viên – thù lao', 'Học viên', 'Khách hàng'] : [meta.name];
  const m = openModal({
    title: `Xuất báo cáo Excel – ${esc(meta.name)}`, sub: 'File sẵn in khổ A4: logo DAKO, Times New Roman, số dạng 1.000.000 đ, chi tiết và tổng cộng theo kỳ', size: 'narrow',
    body: `<div class="f"><span class="lbl">Thống kê theo</span><div class="seg" data-gran>${Object.entries(GRAN).map(([k, v]) => `<button type="button" data-v="${k}" aria-pressed="${k === 'month'}">${v[0].toUpperCase() + v.slice(1)}</button>`).join('')}</div></div>
      <div class="f"><span class="lbl">Khoảng thời gian</span><div class="chips" data-presets>${presets.map(([k, l]) => `<button type="button" class="chip" data-p="${k}" aria-pressed="${k === 'year'}">${l}</button>`).join('')}</div></div>
      <div class="fgrid">${f('ex-from', 'Từ ngày', inp('ex-from', `${y}-01-01`, 'type="date"'))}${f('ex-to', 'Đến ngày', inp('ex-to', `${y}-12-31`, 'type="date"'))}</div>
      <div class="small muted">File gồm ${sheets.length > 1 ? `${sheets.length} sheet: ${esc(sheets.join(', '))}` : `sheet “${esc(sheets[0])}”`}. Mỗi sheet có phần tổng hợp theo kỳ, phần chi tiết cộng theo từng kỳ và dòng tổng cộng.</div>`,
    foot: `<span class="sp"></span><button type="button" class="btn" data-cancel>Hủy</button><button type="button" class="btn primary" data-go>${ic('table')} Xuất Excel</button>`,
  });
  let gran = 'month';
  m.el.querySelector('[data-gran]').addEventListener('click', (e) => { const b = e.target.closest('[data-v]'); if (!b) return; gran = b.dataset.v; $$('[data-gran] button', m.el).forEach((x) => x.setAttribute('aria-pressed', String(x === b))); });
  m.el.querySelector('[data-presets]').addEventListener('click', (e) => {
    const b = e.target.closest('[data-p]'); if (!b) return; const p = presets.find((x) => x[0] === b.dataset.p);
    m.el.querySelector('#ex-from').value = p[2]; m.el.querySelector('#ex-to').value = p[3];
    $$('[data-presets] .chip', m.el).forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  });
  m.el.querySelector('[data-cancel]').onclick = () => m.close();
  m.el.querySelector('[data-go]').onclick = async (ev) => {
    const from = val(m.el, 'ex-from'); const to = val(m.el, 'ex-to');
    if (!from || !to || to < from) { toast('Chọn khoảng thời gian hợp lệ.', 'bad'); return; }
    ev.target.disabled = true; ev.target.textContent = 'Đang tạo file…';
    try {
      const ctx = { from, to, gran };
      const reports = tab === 'tong-quan' ? [repOverview(ctx), repClasses(ctx), repProfit(ctx), repContracts(ctx), repQuotes(ctx), repTrainers(ctx), repStudents(ctx), repCustomers(ctx)] : [REPORTS[tab](ctx)];
      const ok = await writeWorkbook(reports, ctx, `DAKO_${meta.file}_${from}_${to}.xlsx`);
      if (ok) { m.close(); toast('Đã tạo file Excel.', 'ok'); } else { ev.target.disabled = false; ev.target.textContent = 'Xuất Excel'; }
    } catch (e) {
      console.error(e); toast('Không tạo được file Excel: ' + (e.message || 'lỗi'), 'bad'); ev.target.disabled = false; ev.target.innerHTML = `${ic('table')} Xuất Excel`;
    }
  };
}

/* ---------- tiện ích dựng báo cáo ---------- */
const inR = (d, ctx) => !!d && d >= ctx.from && d <= ctx.to;
const granText = (g) => `Thống kê theo ${GRAN[g]}`;
function byPeriod(items, dateOf, ctx) {
  const map = new Map();
  for (const it of items) { const d = dateOf(it); if (!d) continue; const p = periodOf(d, ctx.gran); if (!map.has(p.key)) map.set(p.key, { p, items: [] }); map.get(p.key).items.push(it); }
  const keys = new Set(map.keys());
  return periodsBetween(ctx.from, ctx.to, ctx.gran, keys).map((p) => map.get(p.key) || { p, items: [] });
}
const sumBy = (rows, key) => sum(rows, (r) => r[key]);
function summaryRows(groups, keys, rowsOf, labelOf) {
  return groups.map((g) => { const rows = rowsOf(g); const values = {}; keys.forEach((k) => (values[k] = sumBy(rows, k))); return { label: labelOf(g, rows), values }; });
}

/* ---------- 1. Lịch giảng dạy ---------- */
function repClasses(ctx) {
  const cls = S.classes.filter((c) => c.status !== 'cancelled' && inR(c.startDate, ctx)).sort(sortClasses);
  const row = (c) => { const p = classPnl(c); const q = c.quoteId && quote(c.quoteId); return { date: fmtDateRange(c.startDate, c.endDate), customer: classLabel(c), groups: groupsShort(c.groups), region: regionName(c.region), trainers: trainerNames(c.trainerIds), students: Number(c.students) || 0, rev: p.rev, gv: p.gv, com: p.com.gross, other: p.other, profit: p.profit, status: CLASS_STATUS[c.status]?.label || '', contract: q ? (isContract(q) ? q.contractNo || q.no : 'BG ' + (q.no || '')) : '' }; };
  const groups = byPeriod(cls, (c) => c.startDate, ctx).map((g) => ({ ...g, rows: g.items.map(row) }));
  const keys = ['students', 'rev', 'gv', 'com', 'other', 'profit'];
  return {
    sheet: 'Lịch giảng dạy', title: 'BÁO CÁO LỊCH GIẢNG DẠY VÀ LỢI NHUẬN LỚP HỌC',
    columns: [
      { key: 'stt', header: 'STT', width: 5, align: 'center' }, { key: 'date', header: 'Ngày học', width: 15 }, { key: 'customer', header: 'Khách hàng', width: 30 }, { key: 'groups', header: 'Nhóm', width: 9 },
      { key: 'region', header: 'Vùng', width: 14 }, { key: 'trainers', header: 'Giảng viên', width: 22 }, { key: 'students', header: 'Học viên', width: 9, type: 'int' },
      { key: 'rev', header: 'Doanh thu lớp', width: 15, type: 'vnd' }, { key: 'gv', header: 'Thù lao giảng viên', width: 15, type: 'vnd' }, { key: 'com', header: 'Hoa hồng (gồm thuế)', width: 15, type: 'vnd' },
      { key: 'other', header: 'Chi phí khác', width: 13, type: 'vnd' }, { key: 'profit', header: 'Lợi nhuận', width: 15, type: 'vnd' }, { key: 'margin', header: 'Tỷ suất', width: 8, type: 'pct', ratio: ['profit', 'rev'] },
      { key: 'status', header: 'Trạng thái', width: 12 }, { key: 'contract', header: 'Hợp đồng', width: 16 },
    ],
    summaries: [{ title: `I. TỔNG HỢP THEO ${GRAN[ctx.gran].toUpperCase()}`, labelHeader: 'Kỳ báo cáo', rows: summaryRows(groups, keys, (g) => g.rows, (g, r) => `${g.p.label} · ${r.length} lớp`) }],
    detail: { title: 'II. CHI TIẾT TỪNG LỚP', groups: groups.filter((g) => g.rows.length).map((g) => ({ label: g.p.label, rows: g.rows, unit: 'lớp' })) },
    notes: ['Không tính lớp đã hủy. Hoa hồng và chi phí cấp hợp đồng được phân bổ cho lớp theo tỷ lệ giá lớp trong hợp đồng.', 'Đào tạo ATVSLĐ không chịu thuế GTGT – số liệu không gồm VAT.'],
  };
}

/* ---------- 2. Doanh thu – lợi nhuận (hợp đồng đã ký) ---------- */
function contractRow(q) {
  const p = contractPnl(q);
  return { no: q.contractNo || q.no || '', date: fmtD(q.contractDate), customer: q.customerName || '', classes: p.classes.length, rev: p.rev, gv: p.gv, comAgent: p.com.agentNet + p.com.otherNet, comMgr: p.com.managerNet, comTax: p.com.tax, other: p.other, cost: p.cost, profit: p.profit, paid: p.paid, remain: p.remain, note: p.notes.join('; ') };
}

      { key: 'comAgent', header: 'Hoa hồng đại lý (thực trả)', width: 15, type: 'vnd' }, { key: 'comMgr', header: 'Hoa hồng cán bộ QL khách hàng (thực trả)', width: 16, type: 'vnd' }, { key: 'comTax', header: 'Thuế khấu trừ hoa hồng', width: 14, type: 'vnd' },
      { key: 'other', header: 'Chi phí khác', width: 13, type: 'vnd' }, { key: 'cost', header: 'Tổng chi phí', width: 15, type: 'vnd' }, { key: 'profit', header: 'Lợi nhuận', width: 15, type: 'vnd' },
      { key: 'margin', header: 'Tỷ suất', width: 8, type: 'pct', ratio: ['profit', 'rev'] }, { key: 'paid', header: 'Đã thu', width: 14, type: 'vnd' }, { key: 'remain', header: 'Còn phải thu', width: 14, type: 'vnd' }, { key: 'note', header: 'Ghi chú', width: 22 },

  };
}

/* ---------- 3. Hợp đồng ---------- */
function repContracts(ctx) {
  const qs = S.quotes.filter((q) => isContract(q) && inR(q.contractDate, ctx)).sort((a, b) => (a.contractDate || '').localeCompare(b.contractDate || ''));
  const row = (q) => { const m = contractMoney(q); const cls = quoteClasses(q).filter((c) => c.status !== 'cancelled'); return { no: q.contractNo || '', date: fmtD(q.contractDate), customer: q.customerName || '', quote: q.no || '', value: m.total, paid: m.paid, remain: m.remain, due: fmtD(q.paymentDue), classes: `${cls.filter((c) => c.status === 'done').length}/${cls.length}`, state: contractState(q).label, files: (q.contractFiles || []).length ? 'Có' : 'Chưa có' }; };
  const groups = byPeriod(qs, (q) => q.contractDate, ctx).map((g) => ({ ...g, rows: g.items.map(row) }));
  return {
    sheet: 'Hợp đồng', title: 'BÁO CÁO HỢP ĐỒNG HUẤN LUYỆN VÀ CÔNG NỢ KHÁCH HÀNG',
    columns: [
      { key: 'stt', header: 'STT', width: 5, align: 'center' }, { key: 'no', header: 'Số hợp đồng', width: 20 }, { key: 'date', header: 'Ngày ký', width: 11 }, { key: 'customer', header: 'Khách hàng', width: 34 }, { key: 'quote', header: 'Số báo giá', width: 16 },
      { key: 'value', header: 'Giá trị hợp đồng', width: 16, type: 'vnd' }, { key: 'paid', header: 'Đã thu', width: 16, type: 'vnd' }, { key: 'remain', header: 'Còn phải thu', width: 16, type: 'vnd' }, { key: 'rate', header: 'Tỷ lệ thu', width: 9, type: 'pct', ratio: ['paid', 'value'] },
      { key: 'due', header: 'Hạn thanh toán', width: 12 }, { key: 'classes', header: 'Lớp xong/tổng', width: 10, align: 'center' }, { key: 'state', header: 'Tình trạng', width: 18 }, { key: 'files', header: 'File HĐ', width: 9, align: 'center' },
    ],
    summaries: [{ title: `I. TỔNG HỢP THEO ${GRAN[ctx.gran].toUpperCase()}`, labelHeader: 'Kỳ báo cáo', rows: summaryRows(groups, ['value', 'paid', 'remain'], (g) => g.rows, (g, r) => `${g.p.label} · ${r.length} hợp đồng`) }],

}

/* ---------- 4. Báo giá ---------- */
function repQuotes(ctx) {
  const qs = S.quotes.filter((q) => inR(q.date, ctx)).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  const row = (q) => ({ no: q.no || '', date: fmtD(q.date), customer: q.customerName || '', groups: groupsShort(q.groups), students: Number(q.students) || 0, amount: quoteMoney(q).amount, won: isContract(q) ? 1 : 0, status: QUOTE_STATUS[q.status]?.label || '', contract: q.contractNo || '' });
  const groups = byPeriod(qs, (q) => q.date, ctx).map((g) => ({ ...g, rows: g.items.map(row) }));
  const byStatus = Object.entries(QUOTE_STATUS).map(([k, v]) => { const rows = qs.filter((q) => q.status === k).map(row); return { label: `${v.label} · ${rows.length} báo giá`, values: { students: sumBy(rows, 'students'), amount: sumBy(rows, 'amount'), won: sumBy(rows, 'won') } }; }).filter((r) => r.values.amount || r.label.match(/· [1-9]/));
  return {
    sheet: 'Báo giá', title: 'BÁO CÁO BÁO GIÁ HUẤN LUYỆN',
    columns: [
      { key: 'stt', header: 'STT', width: 5, align: 'center' }, { key: 'no', header: 'Số báo giá', width: 18 }, { key: 'date', header: 'Ngày', width: 11 }, { key: 'customer', header: 'Khách hàng', width: 36 }, { key: 'groups', header: 'Nhóm', width: 12 },
      { key: 'students', header: 'Học viên', width: 9, type: 'int' }, { key: 'amount', header: 'Giá trị báo giá', width: 16, type: 'vnd' }, { key: 'won', header: 'Đã ký HĐ', width: 9, type: 'int' },
      { key: 'status', header: 'Trạng thái', width: 20 }, { key: 'contract', header: 'Số hợp đồng', width: 18 },
    ],
    summaries: [
      { title: `I. TỔNG HỢP THEO ${GRAN[ctx.gran].toUpperCase()}`, labelHeader: 'Kỳ báo cáo', rows: summaryRows(groups, ['students', 'amount', 'won'], (g) => g.rows, (g, r) => `${g.p.label} · ${r.length} báo giá`) },
      { title: 'II. TỔNG HỢP THEO TRẠNG THÁI', labelHeader: 'Trạng thái', rows: byStatus },
    ],
    detail: { title: 'III. CHI TIẾT BÁO GIÁ', groups: groups.filter((g) => g.rows.length).map((g) => ({ label: g.p.label, rows: g.rows, unit: 'báo giá' })) },
    notes: ['Báo giá ghi nhận theo ngày báo giá. Cột “Đã ký HĐ” = 1 nếu báo giá đã chuyển thành hợp đồng (dùng để tính tỷ lệ chốt).'],
  };
}

/* ---------- 5. Giảng viên – thù lao ---------- */
function repTrainers(ctx) {
  const items = [];
  for (const x of S.trainers) for (const r of trainerLedger(x.id, ctx.from, ctx.to).rows) items.push({ x, ...r });
  items.sort((a, b) => sortClasses(a.c, b.c) || a.x.name.localeCompare(b.x.name, 'vi'));

/* ---------- ghi file Excel ---------- */
const XL = { font: 'Times New Roman', navy: 'FF0B2E7A', blue: 'FF1446B8', orange: 'FFEE6517', head: 'FFDCE6F7', group: 'FFF1F5FC', sub: 'FFE7EEFB', total: 'FFCCDAF5', line: 'FFAEBBD3', red: 'FFC42639' };
const colL = (i) => { let s = ''; i += 1; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
/** Định dạng số cố định dấu chấm phần nghìn (không phụ thuộc cài đặt vùng của máy). */
function numFmt(v, unit) {
  const a = Math.abs(Math.round(Number(v) || 0));
  const core = a >= 1e9 ? '#"."000"."000"."000' : a >= 1e6 ? '#"."000"."000' : a >= 1e3 ? '#"."000' : '0';
  const u = unit ? `" ${unit}"` : '';
  return `${core}${u};-${core}${u}`;
}
async function logoPng() {
  try {
    const img = $('.mast-logo'); if (!img) return null;
    if (!img.complete) await new Promise((r) => { img.onload = r; img.onerror = r; });
    const cv = document.createElement('canvas'); cv.width = 160; cv.height = 160;
    const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.beginPath(); g.arc(80, 80, 80, 0, Math.PI * 2); g.fill(); g.drawImage(img, 0, 0, 160, 160);
    return cv.toDataURL('image/png');
  } catch (e) { return null; }
}
async function writeWorkbook(reports, ctx, filename) {
  const ExcelJS = await lib('exceljs');
  if (!ExcelJS) throw new Error('Không tải được thư viện Excel – kiểm tra kết nối mạng.');
  const wb = new ExcelJS.Workbook(); wb.creator = 'DAKO – Quản lý huấn luyện ATVSLĐ'; wb.created = new Date();
  const logo = await logoPng(); const logoId = logo ? wb.addImage({ base64: logo, extension: 'png' }) : null;
  const used = new Set();
  for (const R of reports) {
    let name = R.sheet.replace(/[\\/?*[\]:]/g, '-').slice(0, 31); let k = 2; while (used.has(name)) name = `${R.sheet.slice(0, 28)} ${k++}`; used.add(name);
    writeSheet(wb.addWorksheet(name), R, logoId, ctx);
  }
  const buf = await wb.xlsx.writeBuffer();
  return Store.backend.download(filename, new Blob([buf], { type: XLSX_MIME }));
}
function writeSheet(ws, R, logoId, ctx) {
  const cols = R.columns; const N = cols.length; const co = { ...DEFAULT_SETTINGS.company, ...(settings().company || {}) };
  const firstNum = Math.max(1, cols.findIndex((c) => c.type && c.type !== 'text'));
  ws.columns = cols.map((c) => ({ width: c.width }));
  ws.properties.defaultRowHeight = 16;
  ws.views = [{ showGridLines: false }];
  ws.pageSetup = { paperSize: 9, orientation: N > 9 ? 'landscape' : 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0, horizontalCentered: true, margins: { left: 0.4, right: 0.4, top: 0.5, bottom: 0.55, header: 0.25, footer: 0.25 } };
  ws.headerFooter.oddFooter = `&L&"Times New Roman,Italic"&8${co.name} – ${R.title.toLowerCase()}&R&"Times New Roman,Regular"&8Trang &P/&N`;
  const F = (o = {}) => ({ name: XL.font, size: 11, ...o });
  const border = (style = 'thin') => ({ top: { style, color: { argb: XL.line } }, left: { style: 'thin', color: { argb: XL.line } }, bottom: { style, color: { argb: XL.line } }, right: { style: 'thin', color: { argb: XL.line } } });
  const fill = (argb) => ({ type: 'pattern', pattern: 'solid', fgColor: { argb } });
  let r = 1;
  const put = (row, col, value, style = {}) => { const cell = ws.getCell(row, col); cell.value = value; cell.font = F(style.font); if (style.fill) cell.fill = fill(style.fill); if (style.border) cell.border = style.border; cell.alignment = { vertical: 'middle', wrapText: true, ...(style.align || {}) }; if (style.numFmt) cell.numFmt = style.numFmt; return cell; };
  const mergeRow = (row, c1, c2, value, style) => { if (c2 > c1) ws.mergeCells(row, c1, row, c2); return put(row, c1, value, style); };

  // ---- khối tiêu đề công ty ----
  let acc = 0; let tc = 1; while (tc < N && acc < 9) { acc += cols[tc - 1].width; tc++; }
  mergeRow(1, tc, N, co.name, { font: { size: 13, bold: true, color: { argb: XL.blue } } });
  mergeRow(2, tc, N, `Địa chỉ: ${co.address}`, { font: { size: 10 } });
  mergeRow(3, tc, N, `Hotline: ${co.phone}  ·  Email: ${co.email}`, { font: { size: 10 } });
  ws.getRow(1).height = 20; ws.getRow(2).height = 15; ws.getRow(3).height = 15;
  if (logoId !== null) ws.addImage(logoId, { tl: { col: 0.08, row: 0.1 }, ext: { width: 54, height: 54 }, editAs: 'oneCell' });
  r = 5;
  mergeRow(r, 1, N, R.title, { font: { size: 16, bold: true, color: { argb: XL.navy } }, align: { horizontal: 'center' } }); ws.getRow(r).height = 26; r++;
  mergeRow(r, 1, N, `Kỳ báo cáo: từ ${fmtD(ctx.from)} đến ${fmtD(ctx.to)}  ·  ${granText(ctx.gran)}`, { font: { italic: true }, align: { horizontal: 'center' } }); r++;
  mergeRow(r, 1, N, `Ngày lập: ${fmtStamp(new Date().toISOString())}  ·  Đơn vị tính: đồng (không gồm VAT)`, { font: { size: 10, italic: true, color: { argb: 'FF555555' } }, align: { horizontal: 'center' } }); r += 2;

  const sectionTitle = (t) => { mergeRow(r, 1, N, t, { font: { bold: true, size: 12, color: { argb: XL.navy } } }); ws.getRow(r).height = 20; r++; };
  const fmtCell = (cell, col, v, rowNo) => {
    if (col.type === 'pct') {
      if (col.ratio) { const ni = cols.findIndex((c) => c.key === col.ratio[0]); const di = cols.findIndex((c) => c.key === col.ratio[1]); cell.value = { formula: `IF(${colL(di)}${rowNo}=0,"",${colL(ni)}${rowNo}/${colL(di)}${rowNo})`, result: v === '' ? '' : v }; } else cell.value = v;
      cell.numFmt = '0%'; cell.alignment = { vertical: 'middle', horizontal: 'right' }; return;
    }
    if (col.type === 'vnd' || col.type === 'int') { cell.numFmt = numFmt(typeof v === 'object' && v ? v.result : v, col.type === 'vnd' ? 'đ' : ''); cell.alignment = { vertical: 'middle', horizontal: 'right' }; if ((typeof v === 'number' && v < 0) || (v && v.result < 0)) cell.font = F({ ...(cell.font || {}), color: { argb: XL.red } }); }
  };
  const ratioOf = (col, vals) => { const n = Number(vals[col.ratio?.[0]]) || 0; const d = Number(vals[col.ratio?.[1]]) || 0; return d ? n / d : ''; };
  const headerRow = (labelHeader, fullHeader) => {
    if (fullHeader) cols.forEach((c, i) => put(r, i + 1, c.header, { font: { bold: true, size: 10 }, fill: XL.head, border: border(), align: { horizontal: 'center' } }));
    else {
      mergeRow(r, 1, firstNum, labelHeader, { font: { bold: true, size: 10 }, fill: XL.head, border: border(), align: { horizontal: 'center' } });
      for (let i = 1; i < firstNum; i++) ws.getCell(r, i + 1).border = border();
      cols.forEach((c, i) => { if (i >= firstNum) put(r, i + 1, c.type ? c.header : '', { font: { bold: true, size: 10 }, fill: XL.head, border: border(), align: { horizontal: 'center' } }); });
    }
    ws.getRow(r).height = 30; r++;
  };
  const valueRow = (label, vals, style) => {
    mergeRow(r, 1, firstNum, label, { font: { bold: !!style.bold, italic: !!style.italic }, fill: style.fill, border: border(style.edge) });
    for (let i = 1; i < firstNum; i++) { const cc = ws.getCell(r, i + 1); cc.border = border(style.edge); if (style.fill) cc.fill = fill(style.fill); }
    cols.forEach((c, i) => {
      if (i < firstNum) return;
      const cell = put(r, i + 1, null, { font: { bold: !!style.bold }, fill: style.fill, border: border(style.edge) });
      if (!c.type) { cell.value = vals[c.key] ?? ''; return; }
      if (c.type === 'pct') fmtCell(cell, c, ratioOf(c, vals), r);
      else { const v = style.formula && style.formula[c.key] ? { formula: style.formula[c.key], result: Number(vals[c.key]) || 0 } : Number(vals[c.key]) || 0; cell.value = v; fmtCell(cell, c, v, r); }
    });
    r++;
  };

  // ---- I. chỉ tiêu (dạng nhãn – giá trị) ----
  if (R.kv) {
    sectionTitle(R.kv.title);
    const vc = Math.min(N, Math.max(2, firstNum + 2));
    for (const [label, v, type] of R.kv.rows) {
      mergeRow(r, 1, vc - 1, label, { border: border() }); for (let i = 2; i < vc; i++) ws.getCell(r, i).border = border();
      const span = Math.min(N, vc + 2); const cell = mergeRow(r, vc, span, null, { font: { bold: true }, border: border(), align: { horizontal: 'right' } });
      for (let i = vc + 1; i <= span; i++) ws.getCell(r, i).border = border();
      if (type === 'text') cell.value = v; else { cell.value = Number(v) || 0; cell.numFmt = type === 'pct' ? '0%' : numFmt(v, type === 'vnd' ? 'đ' : ''); }
      r++;
    }
    r++;
  }
  // ---- các bảng tổng hợp ----
  for (const sm of R.summaries || []) {
    sectionTitle(sm.title);
    if (!sm.rows.length) { mergeRow(r, 1, N, 'Không có dữ liệu trong kỳ.', { font: { italic: true } }); r += 2; continue; }
    headerRow(sm.labelHeader || 'Nội dung', false);
    const r0 = r;
    sm.rows.forEach((row) => valueRow(row.label, row.values, {}));
    const tot = {}; const fml = {};
    cols.forEach((c, i) => { if (c.type === 'int' || c.type === 'vnd') { tot[c.key] = sum(sm.rows, (x) => x.values[c.key]); fml[c.key] = `SUM(${colL(i)}${r0}:${colL(i)}${r - 1})`; } });
    valueRow('TỔNG CỘNG', tot, { bold: true, fill: XL.total, edge: 'medium', formula: fml });
    r++;
  }
  // ---- chi tiết ----
  if (R.detail) {
    sectionTitle(R.detail.title);
    const groups = R.detail.groups || [];
    if (!groups.length) { mergeRow(r, 1, N, 'Không có dữ liệu trong kỳ.', { font: { italic: true } }); r += 2; }
    else {
      headerRow('', true);
      const d0 = r; let stt = 0; const grand = {};
      for (const g of groups) {
        mergeRow(r, 1, N, `${g.label} (${g.rows.length} ${g.unit || 'dòng'})`, { font: { bold: true, color: { argb: XL.navy } }, fill: XL.group, border: border() });
        for (let i = 2; i <= N; i++) { ws.getCell(r, i).border = border(); ws.getCell(r, i).fill = fill(XL.group); }
        r++;
        const g0 = r;
        for (const row of g.rows) {
          stt++;
          cols.forEach((c, i) => {
            const cell = put(r, i + 1, null, { font: { size: 10.5 }, border: border(), align: c.align === 'center' ? { horizontal: 'center' } : {} });
            if (c.key === 'stt') { cell.value = stt; cell.alignment = { vertical: 'middle', horizontal: 'center' }; return; }
            if (!c.type) { cell.value = row[c.key] ?? ''; return; }
            if (c.type === 'pct') { fmtCell(cell, c, ratioOf(c, row), r); return; }
            const v = Number(row[c.key]) || 0; cell.value = v; fmtCell(cell, c, v, r);
          });
          r++;
        }
        const subVals = {}; const fml = {};
        cols.forEach((c, i) => { if (c.type === 'int' || c.type === 'vnd') { subVals[c.key] = sum(g.rows, (x) => x[c.key]); grand[c.key] = (grand[c.key] || 0) + subVals[c.key]; fml[c.key] = `SUBTOTAL(9,${colL(i)}${g0}:${colL(i)}${r - 1})`; } });
        valueRow(`Cộng ${g.label}`, subVals, { bold: true, italic: true, fill: XL.sub, formula: fml });
      }
      const fml = {};
      cols.forEach((c, i) => { if (c.type === 'int' || c.type === 'vnd') fml[c.key] = `SUBTOTAL(9,${colL(i)}${d0}:${colL(i)}${r - 1})`; });
      valueRow(`TỔNG CỘNG (${stt} ${groups[0].unit || 'dòng'})`, grand, { bold: true, fill: XL.total, edge: 'medium', formula: fml });
      r++;
    }
  }
  // ---- danh sách việc cần xử lý ----
  if (R.list) { sectionTitle(R.list.title); R.list.rows.forEach((t, i) => { mergeRow(r, 1, N, `${i + 1}. ${t}`, { font: { size: 10.5 } }); r++; }); r++; }
  // ---- ghi chú & khối ký ----
  (R.notes || []).forEach((t) => { mergeRow(r, 1, N, `Ghi chú: ${t}`, { font: { size: 9.5, italic: true, color: { argb: 'FF555555' } } }); r++; });
  r++;
  const d = new Date(); const half = Math.max(1, Math.floor(N / 2));
  mergeRow(r, half + 1, N, `${co.city}, ngày ${pad(d.getDate())} tháng ${pad(d.getMonth() + 1)} năm ${d.getFullYear()}`, { font: { italic: true }, align: { horizontal: 'center' } }); r++;
  mergeRow(r, 1, half, 'NGƯỜI LẬP BIỂU', { font: { bold: true }, align: { horizontal: 'center' } }); mergeRow(r, half + 1, N, 'GIÁM ĐỐC', { font: { bold: true }, align: { horizontal: 'center' } }); r++;
  mergeRow(r, 1, half, '(Ký, ghi rõ họ tên)', { font: { italic: true, size: 10 }, align: { horizontal: 'center' } }); mergeRow(r, half + 1, N, '(Ký, đóng dấu)', { font: { italic: true, size: 10 }, align: { horizontal: 'center' } }); r += 4;
  mergeRow(r, half + 1, N, co.director || '', { font: { bold: true }, align: { horizontal: 'center' } });
}

function makeSamplePdf(title, lines) {
  const escPdf = (s) => String(s).replace(/[\\()]/g, '\\$&');
  const body = [`BT /F1 20 Tf 60 770 Td (${escPdf(title)}) Tj ET`, 'BT /F1 11 Tf 60 735 Td 18 TL',
    ...lines.map((l) => `(${escPdf(l)}) Tj T*`), 'ET',
    'BT /F1 9 Tf 60 60 Td (TAI LIEU MINH HOA - DU LIEU MAU CUA CONG CU QUAN LY HUAN LUYEN ATVSLD DAKO) Tj ET'].join('\n');
  const objs = [
    '<< /Type /Catalog /Pages 2 0 R >>',
    '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',
    `<< /Length ${body.length} >>\nstream\n${body}\nendstream`,
  ];
  let out = '%PDF-1.4\n'; const offs = [];
  objs.forEach((o, i) => { offs.push(out.length); out += `${i + 1} 0 obj\n${o}\nendobj\n`; });
  const x = out.length;
  out += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n${offs.map((o) => String(o).padStart(10, '0') + ' 00000 n \n').join('')}trailer\n<< /Size ${objs.length + 1} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`;
  return new Blob([out], { type: 'application/pdf' });
}

    put('rosters', { id, batchId: id, part: 1, title, customerId: cid, customerName: cname(cid), classId, quoteId: qid, groups: [group], certType, courseFrom: from, courseTo: to, hours: group === 3 ? 24 : 16, issueDate: issue, decisionNo: `${id.slice(2)}/QĐ-DAKO (mẫu)`, decisionDate: issue, decisionFiles: [pdf('fqd-' + id, `Quyet-dinh-${id}.pdf`, 'QUYET DINH CAP THE / GCN', [title, `So hoc vien: ${n}`])], files: [], students, ...extra });
  };
  roster('ro1', 'kh1', 'l1', 'bg1', 'Thẻ an toàn nhóm 3 – Đóng tàu Sao Biển (mẫu)', 3, 'Thẻ an toàn', D(-45), D(-43), D(-42), 12, 'DAKO-N3');
  roster('ro2', 'kh6', 'l13', null, 'Sổ theo dõi nhóm 4 – Thủy sản Hải Đăng (mẫu)', 4, 'Sổ theo dõi', D(-700), D(-700), D(-700), 8, 'DAKO-N4');
  roster('ro3', 'kh1', 'l12', null, 'Thẻ an toàn nhóm 3 – Đóng tàu Sao Biển 2025 (mẫu)', 3, 'Thẻ an toàn', D(-700), D(-698), D(-697), 6, 'DAKO-N3-25');
  put('settings', { id: 'main', ...clone(DEFAULT_SETTINGS) });
  return b;
}

/* ============================================================
   MAIN – khởi động, điều hướng tab, sự kiện, xuất Excel, sao lưu
   ============================================================ */

let USER = null; let REAL = null; let PREV_ROLE = null;

function currentView() { return (TABS.find((t) => t.id === S.ui.tab) || TABS[0]).view; }
function go(id) { if (location.hash === '#' + id) mountTab(); else location.hash = id; }
function applyRole() { document.body.classList.toggle('ro', !S.role.canEdit); }

function keepFocus(fn) {
  const a = document.activeElement; const id = a && a.id;
  let s = null, e = null; try { s = a.selectionStart; e = a.selectionEnd; } catch (x) { /* not text */ }
  fn();
  if (id && document.activeElement !== a) {
    const n = document.getElementById(id);
    if (n && n !== a) { n.focus(); try { if (s !== null) n.setSelectionRange(s, e); } catch (x) { /* ignore */ } }
  }
}

let renderQueued = false;
function scheduleRender() {
  if (renderQueued) return; renderQueued = true;
  setTimeout(() => { renderQueued = false; renderAll(); }, 0);
}
function renderAll() {
  renderChrome();
  const v = currentView();
  if (v && v.el && !(v === SettingsView && SettingsView.dirty)) keepFocus(() => v.update());
  Modals.forEach((m) => m.refresh && m.refresh());
}

function renderChrome() {
  const alerts = S.sync.state === 'loading' ? [] : computeAlerts();
  const nUrgent = alerts.filter((a) => a.sev !== 'info').length;
  const nPending = S.quotes.filter((q) => ['sent', 'negotiating', 'accepted'].includes(q.status)).length;
  $('#tabs').innerHTML = TABS.map((t) => {
    const badge = t.id === 'tong-quan' && nUrgent ? nUrgent : t.id === 'bao-gia' && nPending ? nPending : 0;
    return `<a class="tab" href="#${t.id}"${S.ui.tab === t.id ? ' aria-current="page"' : ''}>${ic(t.icon)}<span>${esc(t.label)}</span>${badge ? `<span class="badge" title="${t.id === 'tong-quan' ? 'Việc cần chú ý' : 'Báo giá đang chờ kết quả'}">${badge}</span>` : ''}</a>`;
  }).join('');
  const kind = Store.backend?.kind;
  const t = todayISO();
  let st = `<span class="pill muted">${esc(DOW_LONG[parseISO(t).getDay()])}, ${fmtD(t)}</span>`;
  if (kind === 'demo') st += pill('Đang xem dữ liệu mẫu', 'accent', true);
  else if (S.role.mode === 'cloud') st += S.role.canEdit ? pill('Quản lý · được chỉnh sửa', 'ok', true) : pill('Chế độ xem', 'info', true);
  else if (S.role.mode === 'local') st += pill('Bản ngoại tuyến · lưu trên máy này', 'warn', true);
  else if (S.role.mode === 'noaccess') st += pill('Chưa truy cập được dữ liệu', 'bad', true);
  if (S.sync.state === 'loading') st += pill('Đang tải…', 'muted');
  else if (S.sync.state === 'warn' || S.sync.state === 'error') st += pill(S.sync.msg, 'bad');
  $('#status').innerHTML = st;

  let b = '';
  if (kind === 'demo') b += `<div class="banner demo"><b>Dữ liệu mẫu</b><span class="grow">Công ty, giảng viên và số liệu là ví dụ minh họa để xem thử các chức năng. Mọi thay đổi chỉ tạm thời, không lưu và không ai khác thấy.</span><button type="button" class="btn sm" data-act="demo-off">${ic('x')} Thoát dữ liệu mẫu</button></div>`;
  else if (S.role.mode === 'noaccess') b += `<div class="banner warn"><span class="grow"><b>Không tải được dữ liệu dùng chung.</b> Hãy đăng nhập claude.ai bằng tài khoản đã được chia sẻ trang này rồi tải lại trang.</span><button type="button" class="btn sm" data-act="demo-on">${ic('eye')} Xem thử dữ liệu mẫu</button></div>`;
  else if (S.role.mode === 'local' && !lsGet('dako-hide-local')) b += `<div class="banner info"><span class="grow"><b>Bản ngoại tuyến:</b> dữ liệu và file lưu trong trình duyệt của máy này${S.localWarn ? ' (trình duyệt đang chặn bộ nhớ – dữ liệu sẽ mất khi đóng trang)' : ''}. Để mọi người cùng xem, dùng bản dùng chung trên claude.ai; chuyển dữ liệu bằng Cài đặt → Sao lưu / Khôi phục.</span><button type="button" class="btn sm ghost" data-act="hide-local">Đã hiểu</button></div>`;
  $('#banners').innerHTML = b;
  $('#banners').parentElement.hidden = !b;
}
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } }

function mountTab() {
  const id = (location.hash || '').replace('#', '');
  const tab = TABS.find((t) => t.id === id) || TABS[0];
  S.ui.tab = tab.id; SettingsView.dirty = false;
  TABS.forEach((t) => (t.view.el = null));
  const main = $('#main'); main.innerHTML = '';
  const host = document.createElement('div'); main.append(host);
  tab.view.mount(host);
  renderChrome();
  lsSet('dako-tab', tab.id);
}

async function fillNames(root) {
  const els = $$('[data-uid]', root);
  if (!els.length) return;
  if (!USER) { els.forEach((e) => e.remove()); return; }
  try {
    const ps = await USER.profiles(uniq(els.map((e) => e.dataset.uid)));
    els.forEach((e) => { const n = ps[e.dataset.uid]?.name; e.textContent = n ? ' · ' + n : ''; });
  } catch (e) { /* ignore */ }
}

/* ---------- click actions ---------- */
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act; const id = el.dataset.id; const v = el.dataset.v;
  if (el.tagName === 'A' && el.getAttribute('href') === '#') e.preventDefault();
  const upd = () => { const cv = currentView(); if (cv.el) keepFocus(() => cv.update()); };
  switch (act) {
    case 'region': S.ui.region = v; upd(); break;
    case 'tr-region': S.ui.trRegion = v; upd(); break;
    case 'q-status': S.ui.qStatus = v; upd(); break;
    case 'c-state': S.ui.cState = v; upd(); break;
    case 'cal-view': S.ui.calView = v; upd(); break;
    case 'cal-prev': S.ui.month = ymAdd(S.ui.month, -1); S.ui.selDate = S.ui.month + '-01'; upd(); break;
    case 'cal-next': S.ui.month = ymAdd(S.ui.month, 1); S.ui.selDate = S.ui.month + '-01'; upd(); break;
    case 'cal-today': S.ui.month = todayISO().slice(0, 7); S.ui.selDate = todayISO(); upd(); break;
    case 'ov-period': S.ui.ovPeriod = v; upd(); break;
    case 'ov-prev': S.ui.ovMonth = ymAdd(S.ui.ovMonth, -stepOf(S.ui.ovPeriod)); upd(); break;
    case 'ov-next': S.ui.ovMonth = ymAdd(S.ui.ovMonth, stepOf(S.ui.ovPeriod)); upd(); break;
    case 'pf-period': S.ui.pfPeriod = v; upd(); break;
    case 'pf-prev': S.ui.pfMonth = ymAdd(S.ui.pfMonth, -stepOf(S.ui.pfPeriod)); upd(); break;
    case 'pf-next': S.ui.pfMonth = ymAdd(S.ui.pfMonth, stepOf(S.ui.pfPeriod)); upd(); break;
    case 'tr-view': S.ui.trView = v; upd(); break;
    case 'led-state': S.ui.ledState = v; upd(); break;
    case 'st-view': S.ui.stView = v; upd(); break;
    case 'st-page': S.ui.stPage = Math.max(0, (S.ui.stPage || 0) + Number(v)); upd(); window.scrollTo({ top: 0 }); break;
    case 'fee-open': e.stopPropagation(); feeModal(id, el.dataset.trainer); break;
    case 'fee-pay': e.stopPropagation(); feeModal(id, el.dataset.trainer, { pay: true }); break;
    case 'pnl-view': e.stopPropagation(); if (quote(id)) pnlEditor(id); break;
    case 'student-view': studentDetail(id, el.dataset.key); break;
    case 'roster-view': rosterDetail(id); break;
    case 'roster-new': rosterForm(null); break;
    case 'goto-students': {
      Modals.slice().forEach((mm) => mm.close());
      if (/^(cid|name):/.test(id || '')) { S.ui.stCompany = id; S.ui.stSearch = ''; } else { S.ui.stSearch = id || ''; S.ui.stCompany = ''; }
      S.ui.stPage = 0; S.ui.stView = 'students'; go('hoc-vien'); break;
    }
    case 'toggle-alerts': S.ui.allAlerts = !S.ui.allAlerts; upd(); break;
    case 'day': {
      const d = el.dataset.date; S.ui.selDate = d;
      if (ymOf(d) !== S.ui.month) S.ui.month = ymOf(d);
      const has = classesOn(d).some((c) => CalendarView.visible(c));
      if (!has && S.role.canEdit) { upd(); classForm(null, { date: d }); break; }
      upd();
      if (window.innerWidth < 1080) $('[data-daypanel]')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      break;
    }
    case 'focus-trainer': S.ui.trainerFocus = S.ui.trainerFocus === id ? null : id; upd(); break;
    case 'focus-clear': S.ui.trainerFocus = null; upd(); break;
    case 'goto-region': S.ui.region = v; go('lich'); break;
    case 'class-new': e.stopPropagation(); classForm(null, { date: el.dataset.date, trainerId: el.dataset.trainer }); break;
    case 'class-view': classDetail(id); break;
    case 'trainer-new': trainerForm(null); break;
    case 'trainer-view': trainerDetail(id); break;
    case 'quote-new': quoteForm(null); break;
    case 'quote-view': quoteDetail(id); break;
    case 'quote-edit': if (quote(id)) quoteForm(quote(id)); break;
    case 'quote-sign': if (quote(id)) quoteForm(quote(id), { focusContract: true }); break;
    case 'customer-new': customerForm(null); break;
    case 'customer-view': customerDetail(id); break;
    case 'files-open': {
      const metas = el.dataset.fids.split(',').map((x) => FILES.get(x)).filter(Boolean);
      openViewer(metas, 0, metas.length > 1 ? `${metas.length} file` : metas[0]?.name);
      break;
    }
    case 'file-view': {
      const box = el.closest('.files');
      const ids = uniq((box ? $$('[data-fid]', box) : [el]).map((x) => x.dataset.fid));
      const metas = ids.map((x) => FILES.get(x)).filter(Boolean);
      openViewer(metas, Math.max(0, ids.indexOf(el.dataset.fid)), metas.length > 1 ? `${metas.length} file` : metas[0]?.name);
      break;
    }
    case 'copy': {
      const text = el.dataset.text;
      try { await navigator.clipboard.writeText(text); toast('Đã sao chép: ' + text); } catch (err) { toast(text); }
      break;
    }
    case 'demo-on':
      if (Store.backend?.kind !== 'demo') { PREV_ROLE = { ...S.role }; S.role = { canEdit: true, mode: 'demo' }; S.ui.month = todayISO().slice(0, 7); Store.attach(buildDemo()); applyRole(); go('tong-quan'); }
      break;
    case 'demo-off':
      S.role = PREV_ROLE || S.role; Store.attach(REAL || new MemoryBackend('none')); applyRole(); mountTab(); break;
    case 'hide-local': lsSet('dako-hide-local', '1'); renderChrome(); break;
    case 'export': openExport(v || S.ui.tab); break;
    case 'export-xlsx': openExport(S.ui.tab); break;
    case 'backup': backup(); break;
    case 'settings-save': {
      const next = SettingsView.collect();
      if (!next.priceTiers.length) { toast('Bảng giá cần ít nhất một mức giá hợp lệ.', 'bad'); break; }
      try { await Store.saveSettings(next); SettingsView.dirty = false; toast('Đã lưu cài đặt.', 'ok'); } catch (err) { /* đã báo */ }
      break;
    }
    case 'tier-add': {
      const tb = $('#tier-table tbody'); const i = tb.children.length;
      tb.insertAdjacentHTML('beforeend', `<tr style="cursor:default"><td><input class="input" type="number" min="1" data-tier="min" data-i="${i}" aria-label="Từ số học viên"></td><td><input class="input" type="number" min="1" data-tier="max" data-i="${i}" aria-label="Đến số học viên"></td><td><input class="input" data-money data-tier="price" data-i="${i}" aria-label="Đơn giá"></td><td><button type="button" class="btn icon ghost" data-act="tier-del" aria-label="Xóa mức giá">${ic('trash')}</button></td></tr>`);
      bindMoney(tb.lastElementChild); SettingsView.dirty = true; break;
    }
    case 'tier-del': el.closest('tr').remove(); SettingsView.dirty = true; break;
    case 'region-add': {
      const tb = $('#region-table tbody'); const rid = uid('r'); const n = tb.children.length;
      tb.insertAdjacentHTML('beforeend', `<tr style="cursor:default" data-rid="${rid}"><td><span class="rtag"><span class="sw" style="background:var(${REGION_VARS[n % REGION_VARS.length]})"></span></span></td><td><input class="input" data-region="name" value="Vùng mới" aria-label="Tên vùng"></td><td><input class="input" data-region="center" aria-label="Trung tâm"></td></tr>`);
      SettingsView.dirty = true; break;
    }
    default: break;
  }
});

/* ---------- inputs on toolbars ---------- */
const deferredUpdate = debounce(() => { const v = currentView(); if (v.el) keepFocus(() => v.update()); }, 160);
document.addEventListener('input', (e) => {
  const k = e.target.dataset?.input;
  if (!k) { if (S.ui.tab === 'cai-dat' && e.target.closest('#main')) SettingsView.dirty = true; return; }
  const v = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  const map = { 'cal-search': 'calSearch', 'tr-search': 'trSearch', 'tr-spec': 'trSpec', 'tr-status': 'trStatus', 'q-search': 'qSearch', 'q-year': 'qYear', 'c-search': 'cSearch', 'c-year': 'cYear', 'cu-search': 'cuSearch', 'cu-due': 'cuDue',
    'led-search': 'ledSearch', 'led-period': 'ledPeriod', 'st-search': 'stSearch', 'st-company': 'stCompany', 'st-group': 'stGroup', 'st-type': 'stType', 'st-status': 'stStatus', 'st-year': 'stYear' };
  if (k.startsWith('st-')) S.ui.stPage = 0;
  if (map[k]) { S.ui[map[k]] = v; deferredUpdate(); }
});
document.addEventListener('change', (e) => {
  if (e.target.dataset?.input === 'restore' && e.target.files?.[0]) { const file = e.target.files[0]; e.target.value = ''; restore(file); }
});

/* ---------- backup & restore ---------- */
async function backup() {
  const withFiles = $('#backup-files') ? $('#backup-files').checked : true;
  const out = { app: 'dako-atld', version: APP_VERSION, exportedAt: new Date().toISOString(), data: { trainers: S.trainers, classes: S.classes, quotes: S.quotes, customers: S.customers, rosters: S.rosters, settings: S.settings }, files: {} };
  if (withFiles && FILES.size) {
    toast(`Đang gom ${FILES.size} file đính kèm…`);
    for (const [id, meta] of FILES) { try { out.files[id] = { meta, b64: await blobToBase64(await Store.backend.getBlob(meta)) }; } catch (e) { /* bỏ qua file lỗi */ } }
  }
  try { await Store.backend.download(`DAKO_sao-luu_${todayISO()}.json`, new Blob([JSON.stringify(out)], { type: 'application/json' })); } catch (e) { toast(e.message, 'bad'); }
}

async function restore(file) {
  if (!S.role.canEdit) return;
  let obj;
  try { obj = JSON.parse(await file.text()); } catch (e) { toast('File không đúng định dạng sao lưu của công cụ.', 'bad'); return; }
  if (obj?.app !== 'dako-atld' || !obj.data) { toast('File không đúng định dạng sao lưu của công cụ.', 'bad'); return; }
  const d = obj.data;
  const n = ['trainers', 'classes', 'quotes', 'customers', 'rosters'].reduce((s, k) => s + (d[k] || []).length, 0);
  const nf = Object.keys(obj.files || {}).length;
  if (!(await confirmBox(`Khôi phục <b>${n}</b> bản ghi và <b>${nf}</b> file từ bản sao lưu ngày ${esc(fmtStamp(obj.exportedAt))}?<br><br>Bản ghi trùng mã sẽ được ghi đè bằng bản sao lưu; các bản ghi khác giữ nguyên.`, { ok: 'Khôi phục' }))) return;
  toast('Đang khôi phục…');
  const map = {};
  for (const [oldId, fobj] of Object.entries(obj.files || {})) {
    try { map[oldId] = await Store.backend.putFile(base64ToBlob(fobj.b64, fobj.meta.type), fobj.meta.name, fobj.meta.type); } catch (e) { /* bỏ qua */ }
  }
  const rf = (m) => (m && map[m.id] ? map[m.id] : m); const rl = (l) => (l || []).map(rf);
  try {
    for (const x of d.customers || []) await Store.backend.set('customers', x.id, x);
    for (const x of d.trainers || []) await Store.backend.set('trainers', x.id, { ...x, photo: rf(x.photo), files: rl(x.files) });
    for (const x of d.quotes || []) await Store.backend.set('quotes', x.id, { ...x, quoteFiles: rl(x.quoteFiles), contractFiles: rl(x.contractFiles), costFiles: rl(x.costFiles) });
    for (const x of d.classes || []) await Store.backend.set('classes', x.id, { ...x, files: rl(x.files), ...(x.fees ? { fees: x.fees.map((fe) => ({ ...fe, files: rl(fe.files) })) } : {}) });
    const kf = (l) => (l || []).map((x) => ({ ...rf(x), kind: x.kind }));
    for (const x of d.rosters || []) await Store.backend.set('rosters', x.id, { ...x, decisionFiles: rl(x.decisionFiles), files: rl(x.files), students: (x.students || []).map((st) => ({ ...st, files: kf(st.files) })) });
    if (d.settings) await Store.backend.set('settings', 'main', d.settings);
    Store.log('Khôi phục', 'settings', `Bản sao lưu ${fmtStamp(obj.exportedAt)}`);
    toast(`Đã khôi phục ${n} bản ghi, ${Object.keys(map).length} file.`, 'ok');
  } catch (e) { Store.handleWriteError(e); }
}

/* ---------- boot ---------- */
async function boot() {
  if (!location.hash) { const last = lsGet('dako-tab'); if (last && TABS.some((t) => t.id === last)) history.replaceState(null, '', '#' + last); }
  window.addEventListener('hashchange', mountTab);
  Store.backend = new MemoryBackend('none');
  S.sync = { state: 'loading', msg: '' };
  mountTab(); applyRole();
  if (window.claude && typeof window.claude.use === 'function') {
    const db = await window.claude.use('db');
    if (db) {
      USER = await window.claude.use('user');
      let canEdit = false;
      if (USER) {
        const w = await USER.can('data.write');
        canEdit = w === null ? await USER.canEdit() : !!w;
        try { S.me = await USER.me(); } catch (e) { S.me = null; }
      }
      const assets = canEdit ? await window.claude.use('assets') : null;
      S.role = { canEdit, mode: 'cloud' };
      REAL = new CloudBackend(db, assets);
    } else {
      S.role = { canEdit: false, mode: 'noaccess' };
    }
  } else {
    const lb = new LocalBackend();
    try { await lb.init(); REAL = lb; } catch (e) { REAL = new MemoryBackend('local'); S.localWarn = true; }
    S.role = { canEdit: true, mode: 'local' };
  }
  applyRole();
  if (REAL) Store.attach(REAL);
  else { S.sync = { state: 'ok', msg: '' }; }
  mountTab();
}
boot();

</script>
