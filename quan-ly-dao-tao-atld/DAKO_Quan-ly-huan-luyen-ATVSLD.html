          ${f('wz-seq', 'Phụ lục số (thứ tự trong HĐNT)', inp('wz-seq', padNo(w.seq || 1), 'inputmode="numeric"'), { hint: 'In ở tiêu đề “PHỤ LỤC HỢP ĐỒNG SỐ: …”' })}
          ${f('wz-date', 'Ngày ký', inp('wz-date', w.signDate, 'type="date"'))}
          ${f('wz-place', 'Nơi ký', inp('wz-place', w.signPlace, 'placeholder="VD: Văn phòng Công ty DAKO"'), { cls: 'span2' })}
          ${f('wz-paydays', 'Thanh toán trong (ngày làm việc)', inp('wz-paydays', w.payDays, 'type="number" min="1" placeholder="Để trống: in “.......”"'), { hint: 'Điều 2.2 – kể từ ngày ký biên bản nghiệm thu' })}
        </div></fieldset>
        <fieldset class="sec"><legend>Lớp giảng dạy của ${esc(t?.name || '')}</legend>
          ${cands.length ? `<div class="classpick">${cands.slice(0, 40).map((o) => { const on = w.rows.some((r) => r.classId === o.c.id); return `<label class="cpick${o.other ? ' dis' : ''}${on ? ' on' : ''}"><input type="checkbox" data-cls="${esc(o.c.id)}"${on ? ' checked' : ''}${o.other ? ' disabled' : ''}><span class="grow"><b>${esc(fmtDateRange(o.c.startDate, o.c.endDate))}</b> · ${esc(classLabel(o.c))}<span class="muted small"> · ${esc(groupsText(o.c.groups) || 'chưa chọn nhóm')} · ${classDays(o.c)} ngày${o.other ? ` · đã có trong phụ lục ${esc(o.other.no)}` : !o.inTerm ? ' · ngoài thời hạn HĐNT' : ''}</span></span></label>`; }).join('')}</div>` : '<div class="muted small">Giảng viên chưa có lớp nào trong lịch – có thể thêm dòng thủ công.</div>'}
          <div data-rows style="margin-top:12px">${rowsTable()}</div></fieldset>
        <fieldset class="sec"><legend>Thù lao &amp; thuế</legend><div class="fgrid">
          ${f('wz-travel', 'Chi phí hỗ trợ đi lại, lưu trú (nếu có)', moneyInp('wz-travel', w.travel || '', 'Để trống nếu không có'))}
          <div class="f span2"><span class="lbl">Thuế TNCN khấu trừ</span><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label class="inline-check"><input type="checkbox" id="wz-pitauto"${w.pitAuto !== false ? ' checked' : ''}> Tự tính ${pitCfg().rate}% khi tổng chi trả từ ${money(pitCfg().min)} đ</label>
            <input class="input num" id="wz-pit" data-money inputmode="numeric" style="width:150px" value="${money(plMoney(w).pit)}"${w.pitAuto !== false ? ' disabled' : ''} aria-label="Thuế TNCN"></div><span class="hint">Tính trên tổng chi trả = thù lao + hỗ trợ đi lại. Bỏ chọn để nhập tay (VD: GV có cam kết 08).</span></div>
        </div><div data-mbox style="margin-top:12px">${moneyBox()}</div>
          <label class="inline-check" style="margin-top:10px"><input type="checkbox" id="wz-fees"${w.updateFees ? ' checked' : ''}> Ghi thù lao, thuế TNCN và số phụ lục vào các lớp tương ứng (Giảng viên → Thù lao &amp; công nợ)</label></fieldset>
        <fieldset class="sec"><legend>Hai bên ký phụ lục</legend>${partyABlock()}<div style="margin-top:10px">${partyBFields(false)}</div>
          <label class="inline-check" style="margin-top:10px"><input type="checkbox" id="wz-saveprof"${w.saveProfile ? ' checked' : ''}> Lưu CCCD / MST vừa bổ sung vào hồ sơ giảng viên</label></fieldset>
        ${f('wz-notes', 'Ghi chú nội bộ (không in)', `<textarea class="input" id="wz-notes" rows="2" placeholder="Ghi chú theo dõi">${esc(w.notes || '')}</textarea>`)}
      </div>`;
    }
    m.body.innerHTML = html;
    m.foot.innerHTML = `${ex ? '' : `<button type="button" class="btn" data-back>${ic('left')} Quay lại</button>`}<span class="sp"></span><button type="button" class="btn" data-cancel>Hủy</button><button type="button" class="btn primary" data-next>${ic('eye')} Xem lại hợp đồng</button>`;
    bindForm();
  }
  function readForm() {
    const b = m.body; const g = (id) => b.querySelector('#' + id);
    if (g('wz-no')) w.no = g('wz-no').value.trim();
    if (g('wz-date')) w.signDate = g('wz-date').value;
    if (g('wz-place')) w.signPlace = g('wz-place').value.trim();
    if (g('wz-paydays')) w.payDays = g('wz-paydays').value.trim();
    if (g('wz-from')) w.from = g('wz-from').value;
    if (g('wz-to')) w.to = g('wz-to').value;
    if (g('wz-seq')) w.seq = Number(g('wz-seq').value.replace(/\D/g, '')) || 1;
    if (g('wz-travel')) w.travel = parseMoney(g('wz-travel').value);
    if (g('wz-pitauto')) { w.pitAuto = g('wz-pitauto').checked; if (!w.pitAuto) w.pit = parseMoney(g('wz-pit').value); }
    if (g('wz-form')) w.withForm = g('wz-form').checked;
    if (g('wz-fees')) w.updateFees = g('wz-fees').checked;
    if (g('wz-saveprof')) w.saveProfile = g('wz-saveprof').checked;
    if (g('wz-notes')) w.notes = g('wz-notes').value.trim();
    w.partyA = { ...(w.partyA || partyA()), rep: g('wa-rep')?.value.trim() ?? w.partyA?.rep, repTitle: g('wa-title')?.value.trim() ?? w.partyA?.repTitle };
    const B = { ...(w.partyB || {}) };
    b.querySelectorAll('[data-b]').forEach((el) => (B[el.dataset.b] = el.value.trim()));
    if (b.querySelector('input[name=wb-groups]')) B.groups = checkedVals(b, 'wb-groups').map(Number).sort();
    w.partyB = B;
    if (w.kind === 'nt') { const p = parseDocNo(tcFmt('nt'), w.no); w.stt = p?.stt || null; }
    else { const p = parseDocNo(tcFmt('pl'), w.no); w.stt = p?.stt || null; const nt = tcontract(w.parentId); w.parentNo = nt?.no || ''; w.parentDate = nt?.signDate || ''; }
  }
  function bindForm() {
    const b = m.body;
    b.querySelector('#wz-no')?.addEventListener('input', () => { readForm(); b.querySelector('[data-nohint]').innerHTML = noHint(); });
    b.querySelector('#wz-date')?.addEventListener('change', () => {
      const before = w.no; readForm(); const y = Number((w.signDate || t0).slice(0, 4));
      if (!before || (w.stt && parseDocNo(tcFmt(w.kind), before))) { w.stt = nextTcStt(w.kind, y, w.id); w.no = fmtDocNo(tcFmt(w.kind), { stt: w.stt, year: y }); b.querySelector('#wz-no').value = w.no; }
      b.querySelector('[data-nohint]').innerHTML = noHint();
    });
    b.querySelector('[data-terms]')?.addEventListener('click', (e) => { const c = e.target.closest('[data-term]'); if (!c) return; readForm(); setTerm(c.dataset.term); render(); });
    b.querySelector('#wz-from')?.addEventListener('change', () => { readForm(); if (w.term !== 'custom') { setTerm(w.term); b.querySelector('#wz-to').value = w.to || ''; } });
    b.querySelector('#wz-to')?.addEventListener('change', () => { readForm(); w.term = 'custom'; b.querySelectorAll('[data-term]').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.term === 'custom'))); });
    b.querySelector('#wz-parent')?.addEventListener('change', () => { readForm(); w.parentId = b.querySelector('#wz-parent').value; const nt = tcontract(w.parentId); w.seq = nt ? nextSeq(nt.id, w.id) : 1; w.payDays = w.payDays || nt?.payDays || ''; render(); });
    b.querySelectorAll('[data-cls]').forEach((cb) => cb.addEventListener('change', () => {
      readForm(); const c = klass(cb.dataset.cls);
      if (cb.checked) w.rows.push(rowFromClass(c, w.trainerId)); else w.rows = w.rows.filter((r) => r.classId !== c.id);
      w.rows.sort((r1, r2) => (r1.classId && r2.classId ? sortClasses(klass(r1.classId), klass(r2.classId)) : r1.classId ? -1 : 1));
      render();
    }));
    const rowsEl = b.querySelector('[data-rows]');
    rowsEl?.addEventListener('input', (e) => {
      const tr = e.target.closest('tr[data-i]'); const k = e.target.dataset.k; if (!tr || !k) return;
      const r = w.rows[Number(tr.dataset.i)];
      if (k === 'qty') r.qty = Number(e.target.value) || 0; else if (k === 'price' || k === 'amount') r[k] = parseMoney(e.target.value); else r[k] = e.target.value;
      if (k === 'qty' || k === 'price') { r.amount = Math.round((Number(r.qty) || 0) * (Number(r.price) || 0)); tr.querySelector('[data-k=amount]').value = r.amount ? money(r.amount) : ''; }
      if (k === 'location') e.target.classList.toggle('miss', isBlank(r.location));
      refreshMoney();
    });
    rowsEl?.addEventListener('change', (e) => { if (e.target.dataset.k === 'unit') { const tr = e.target.closest('tr[data-i]'); w.rows[Number(tr.dataset.i)].unit = e.target.value; } });
    rowsEl?.addEventListener('click', (e) => {
      const rm = e.target.closest('[data-rmrow]'); const add = e.target.closest('[data-addrow]');
      if (rm) { readForm(); w.rows.splice(Number(rm.dataset.rmrow), 1); render(); }
      if (add) { readForm(); const t = trainer(w.trainerId); w.rows.push({ id: uid('r'), classId: '', customer: '', location: '', topic: '', time: '', qty: 1, unit: 'ngày', price: Number(t?.dailyRate) || 0, amount: Number(t?.dailyRate) || 0 }); render(); m.body.querySelector('[data-rows] tbody tr:last-child [data-k=customer]')?.focus(); }
    });
    b.querySelector('#wz-travel')?.addEventListener('input', () => { w.travel = parseMoney(b.querySelector('#wz-travel').value); refreshMoney(); });
    b.querySelector('#wz-pitauto')?.addEventListener('change', () => { const on = b.querySelector('#wz-pitauto').checked; w.pitAuto = on; const pi = b.querySelector('#wz-pit'); pi.disabled = on; if (!on) { w.pit = plMoney({ ...w, pitAuto: true }).pit; pi.value = money(w.pit); pi.focus(); } refreshMoney(); });
    b.querySelector('#wz-pit')?.addEventListener('input', () => { w.pit = parseMoney(b.querySelector('#wz-pit').value); refreshMoney(false); });
    b.querySelectorAll('[data-b]').forEach((el) => el.addEventListener('input', () => { const fEl = el.closest('.f'); if (!fEl) return; const blank = !el.value.trim(); fEl.classList.toggle('miss', blank); const h = fEl.querySelector('.warn-t'); if (h) h.hidden = !blank; }));
    m.foot.querySelector('[data-back]')?.addEventListener('click', () => { readForm(); step = 1; render(); });
    m.foot.querySelector('[data-cancel]').onclick = () => m.tryClose();
    m.foot.querySelector('[data-next]').onclick = () => { readForm(); const err = validate(); if (err) { toast(err, 'bad'); return; } step = 3; render(); };
  }
  function refreshMoney(syncPit = true) {
    const b = m.body; const mny = plMoney(w);
    const tot = b.querySelector('[data-total]'); if (tot) tot.textContent = money(mny.total);
    const pi = b.querySelector('#wz-pit'); if (pi && syncPit && w.pitAuto !== false) pi.value = money(mny.pit);
    const box = b.querySelector('[data-mbox]'); if (box) box.innerHTML = moneyBox();
  }
  function validate() {
    if (!w.no) return 'Nhập số hợp đồng.';
    const y = Number((w.signDate || t0).slice(0, 4));
    const dup = tcDuplicate(w.kind, w.no, y, w.id); if (dup) return `Số ${w.no} đã dùng cho ${TC_SHORT[dup.kind]} của ${trainer(dup.trainerId)?.name || ''}.`;
    if (!w.signDate) return 'Chọn ngày ký.';
    if (w.kind === 'nt') { if (!w.from || !w.to) return 'Chọn thời hạn hiệu lực (từ ngày – đến ngày).'; if (w.to < w.from) return 'Ngày kết thúc phải sau ngày bắt đầu.'; }
    else {
      if (!w.parentId) return 'Chọn hợp đồng nguyên tắc.';
      if (!w.rows.length) return 'Phụ lục cần ít nhất một lớp giảng dạy.';
      if (w.rows.some((r) => !r.customer)) return 'Nhập đơn vị được huấn luyện cho mọi dòng.';
      if (!(plMoney(w).total > 0)) return 'Tổng giá trị phụ lục đang bằng 0 – nhập đơn giá/thành tiền.';
    }
    return '';
  }

  /* ---- bước 3: xem lại & xuất ---- */
  async function renderReview() {
    const miss = tcMissing(w); const mny = w.kind === 'pl' ? plMoney(w) : null; const t = tOf(w.trainerId);
    m.body.innerHTML = `${stepsBar()}
      <div class="review-top"><div class="grow"><b>${esc(TC_KIND[w.kind])} số ${esc(w.no)}</b> · ${esc(t?.name || '')} · ký ngày ${esc(fmtD(w.signDate))}${w.kind === 'nt' ? ` · hiệu lực ${esc(fmtD(w.from))} – ${esc(fmtD(w.to))}` : ` · ${w.rows.length} lớp · tổng ${esc(moneyD(mny.total))} · thực nhận ${esc(moneyD(mny.net))}`}</div></div>
      ${miss.length ? `<div class="banner warn" style="margin:8px 0"><span class="grow"><b>${miss.length} mục còn trống</b> – sẽ in dòng chấm như mẫu để điền tay: ${esc(miss.join(', '))}. Bấm “Sửa lại” để bổ sung.</span></div>` : '<div class="banner info" style="margin:8px 0"><span class="grow">Đã đủ thông tin theo mẫu.</span></div>'}
      <div class="docprev" data-prev><div class="msg">Đang tạo bản xem trước…</div></div>`;
    m.foot.innerHTML = `<button type="button" class="btn" data-back>${ic('left')} Sửa lại</button><span class="sp"></span><button type="button" class="btn" data-save>${ic('check')} Lưu, chưa xuất file</button><button type="button" class="btn primary" data-export>${ic('down')} Xuất hợp đồng (.docx)</button>`;
    m.foot.querySelector('[data-back]').onclick = () => { step = 2; render(); };
    m.foot.querySelector('[data-save]').onclick = (e) => finish(e.currentTarget, false);
    m.foot.querySelector('[data-export]').onclick = (e) => finish(e.currentTarget, true);
    const prev = m.body.querySelector('[data-prev]');
    try { blob = await buildTcDocx(w); if (step === 3) await renderDocx(blob, prev); } catch (e) { blob = null; prev.innerHTML = `<div class="msg"><b>Không tạo được bản xem trước.</b><br>${esc(e.message || '')}</div>`; }
  }
  async function finish(btn, doExport) {
    $$('button', m.foot).forEach((x) => (x.disabled = true)); const label = btn.innerHTML; btn.textContent = 'Đang lưu…';
    try {
      const rec = { ...(ex || {}), id: w.id || uid('hd') };
      const keep = ['kind', 'trainerId', 'no', 'stt', 'signDate', 'signPlace', 'payDays', 'partyA', 'partyB', 'notes', 'status'];
      const ntKeys = ['from', 'to', 'term', 'withForm']; const plKeys = ['parentId', 'parentNo', 'parentDate', 'seq', 'rows', 'travel', 'pitAuto', 'pit'];
      for (const k of [...keep, ...(w.kind === 'nt' ? ntKeys : plKeys)]) rec[k] = clone(w[k] ?? null);
      rec.trainerName = tOf(w.trainerId)?.name || w.partyB?.name || '';
      rec.year = Number(w.signDate.slice(0, 4));
      if (w.kind === 'pl') { const mny = plMoney(w); Object.assign(rec, { total: mny.total, pit: mny.pit, net: mny.net }); }
      rec.status = rec.status || 'draft';
      w.id = rec.id;
      if (doExport) {
        const out = blob || (await buildTcDocx(w));
        const name = tcFileName(rec);
        const old = rec.docFile;
        if (Store.backend.kind !== 'cloud' || Store.backend.assets) { rec.docFile = await Store.backend.putFile(new File([out], name, { type: DOCX_MIME }), name, DOCX_MIME); }
        await Store.save('tcontracts', rec, `${TC_SHORT[rec.kind]} ${rec.no} – ${rec.trainerName}`, ex ? 'Cập nhật' : 'Lập');
        if (old && old.id !== rec.docFile?.id) Store.backend.delFile(old);
        await Store.backend.download(name, out).catch((e2) => toast(e2.message, 'bad'));
      } else {
        await Store.save('tcontracts', rec, `${TC_SHORT[rec.kind]} ${rec.no} – ${rec.trainerName}`, ex ? 'Cập nhật' : 'Lập');
      }
      if (w.saveProfile) await saveProfileFromB(w.trainerId, w.partyB).catch(() => {});
      let nFees = 0;
      if (ex && ex.kind === 'pl') await unlinkPlFees({ ...ex, rows: (ex.rows || []).filter((r) => r.classId && !(rec.rows || []).some((r2) => r2.classId === r.classId)) });
      if (w.kind === 'pl' && w.updateFees) nFees = await applyPlToFees(rec);
      m.guard = null; m.close();
      toast(`Đã ${doExport ? 'xuất và lưu' : 'lưu'} ${TC_KIND[rec.kind].toLowerCase()} ${rec.no}${nFees ? ` · cập nhật thù lao ${nFees} lớp` : ''}.`, 'ok');
      tcDetail(rec.id, rec);
    } catch (e) {
      console.error(e); toast('Không lưu được hợp đồng: ' + (e.message || 'lỗi'), 'bad');
      $$('button', m.foot).forEach((x) => (x.disabled = false)); btn.innerHTML = label;
    }
  }
  render();
  return m;
}

/* ======================= CHI TIẾT HỢP ĐỒNG ======================= */
function tcDetail(id, fallback = null) {
  const m = openModal({ title: '', size: 'wide' }); m.refresh = render; let seen = false; render();
  function render() {
    let x = tcontract(id); if (x) seen = true; else if (!seen) x = fallback;
    if (!x) { m.close(); return; }
    const t = trainer(x.trainerId); const st = tcState(x); const ro = !S.role.canEdit;
    const nt = x.kind === 'pl' ? tcontract(x.parentId) : null;
    m.el.querySelector('.modal-h h2').textContent = `${TC_KIND[x.kind]} ${x.no || ''}`;
    const A = x.partyA || {};
    let html = `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${pill(st.label, st.tone)}${t ? `<a href="#" class="btn sm ghost" data-act="trainer-view" data-id="${esc(t.id)}">${avatar(t, 'sm')} ${esc(t.name)}</a>` : `<b>${esc(x.trainerName || '')}</b>`}</div>
      <dl class="dl"><div><dt>Ngày ký</dt><dd>${x.signDate ? esc(fmtD(x.signDate)) : notSet()}</dd></div><div><dt>Nơi ký</dt><dd>${x.signPlace ? esc(x.signPlace) : notSet()}</dd></div>
      ${x.kind === 'nt' ? `<div><dt>Hiệu lực</dt><dd>${esc(fmtD(x.from))} – ${esc(fmtD(x.to))}</dd></div>` : `<div><dt>Thuộc HĐ nguyên tắc</dt><dd>${nt ? `<a href="#" data-act="tc-view" data-id="${esc(nt.id)}">${esc(nt.no)}</a>` : esc(x.parentNo || '—')} · phụ lục số ${esc(padNo(x.seq))}</dd></div>`}
      <div><dt>Thanh toán</dt><dd>${x.payDays ? `trong ${esc(x.payDays)} ngày làm việc` : notSet()}</dd></div><div><dt>Đại diện Bên A</dt><dd>${esc(A.rep || '—')}${A.repTitle ? ` – ${esc(A.repTitle)}` : ''}</dd></div>
      ${x.notes ? `<div class="full"><dt>Ghi chú</dt><dd style="white-space:pre-wrap">${esc(x.notes)}</dd></div>` : ''}</dl>`;
    if (x.kind === 'pl') {
      const mny = plMoney(x); const pay = plPayment(x);
      html += `<div><div class="sec-title">Kế hoạch giảng dạy &amp; thù lao</div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>Khách hàng / địa điểm</th><th>Đối tượng / chuyên đề</th><th>Thời gian</th><th class="r">SL</th><th class="r">Đơn giá</th><th class="r">Thành tiền</th></tr></thead><tbody>
        ${(x.rows || []).map((r, i) => `<tr${r.classId && klass(r.classId) ? ` data-act="class-view" data-id="${esc(r.classId)}"` : ' style="cursor:default"'}><td>${i + 1}</td><td>${esc(r.customer)}<div class="muted small">${r.location ? esc(r.location) : 'Chưa ghi địa điểm'}</div></td><td>${esc(r.topic)}</td><td class="nowrap">${esc(r.time)}</td><td class="r">${esc(r.qty)} ${esc(r.unit || '')}</td>${moneyCell(r.price)}${moneyCell(r.amount)}</tr>`).join('')}
        </tbody><tfoot><tr><td colspan="6">Tổng giá trị phụ lục</td>${moneyCell(mny.total)}</tr></tfoot></table></div>
        <div class="money-box cols-5" style="margin-top:10px">${mbox('Hỗ trợ đi lại', money(mny.travel))}${mbox('Thuế TNCN', money(mny.pit), 'neg')}${mbox('Thực nhận', money(mny.net))}${mbox('Đã trả', money(pay.paid), 'pos', pay.linked ? `theo ${pay.linked} lớp` : 'chưa gắn lớp')}${mbox('Còn phải trả', money(Math.max(0, pay.remain)), pay.remain > 0 ? 'hl' : 'pos')}</div>
        <div class="small" style="margin-top:6px"><i>Bằng chữ: ${esc(vnMoneyWords(mny.total))}</i></div></div>`;
    } else {
      const pls = ntAppendices(x.id);
      html += `<div><div class="sec-title">Phụ lục của hợp đồng này</div>${pls.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Phụ lục</th><th>Ngày ký</th><th>Lớp</th><th class="r">Giá trị</th><th class="r">Thực nhận</th><th>Tình trạng</th></tr></thead><tbody>
        ${pls.map((p) => { const s2 = tcState(p); const mm = plMoney(p); return `<tr data-act="tc-view" data-id="${esc(p.id)}"><td><b>Số ${esc(padNo(p.seq))}</b> · ${esc(p.no)}</td><td class="num">${esc(fmtD(p.signDate))}</td><td class="small">${esc((p.rows || []).map((r) => r.customer).filter(Boolean).slice(0, 3).join('; '))}${(p.rows || []).length > 3 ? '…' : ''}</td>${moneyCell(mm.total)}${moneyCell(mm.net)}<td>${pill(s2.label, s2.tone)}</td></tr>`; }).join('')}
        </tbody><tfoot><tr><td colspan="3">${pls.length} phụ lục</td>${moneyCell(sum(pls.filter((p) => p.status !== 'cancelled'), (p) => plMoney(p).total))}${moneyCell(sum(pls.filter((p) => p.status !== 'cancelled'), (p) => plMoney(p).net))}<td></td></tr></tfoot></table></div>` : '<div class="muted small">Chưa có phụ lục nào.</div>'}</div>`;
    }
    html += `<div class="grid-2"><div><div class="sec-title">File hợp đồng (Word) do công cụ tạo</div>${x.docFile ? filesBlock([x.docFile]) : '<div class="muted small">Chưa xuất file – bấm “Xuất file Word”.</div>'}</div>
      <div><div class="sec-title">Bản đã ký (scan)</div>${filesBlock(x.files, 'Chưa tải bản đã ký lên')}</div></div>`;
    m.body.innerHTML = html;
    if (!m.foot) { m.el.insertAdjacentHTML('beforeend', '<div class="modal-f"></div>'); m.foot = m.el.querySelector('.modal-f'); }
    m.foot.innerHTML = `${editorStamp(x)}<span class="sp"></span><button type="button" class="btn" data-x="docx">${ic('down')} Xuất file Word</button>${ro ? '' : `<span class="edit-only" style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn danger" data-x="del">${ic('trash')} Xóa</button>${x.status === 'cancelled' ? `<button type="button" class="btn" data-x="restore">Khôi phục</button>` : `<button type="button" class="btn" data-x="cancel">Hủy hợp đồng</button>`}${x.kind === 'nt' && x.status !== 'cancelled' ? `<button type="button" class="btn" data-x="pl">${ic('plus')} Tạo phụ lục</button>` : ''}<button type="button" class="btn" data-x="edit">${ic('edit')} Sửa</button>${x.status !== 'signed' && x.status !== 'cancelled' ? `<button type="button" class="btn primary" data-x="sign">${ic('sign')} Đã ký</button>` : `<button type="button" class="btn" data-x="sign">${ic('up')} Bản đã ký</button>`}</span>`}`;
    const on = (k, fn) => m.foot.querySelector(`[data-x=${k}]`)?.addEventListener('click', fn);
    on('docx', async (e) => { const b = e.currentTarget; b.disabled = true; try { const out = await buildTcDocx(x); await Store.backend.download(tcFileName(x), out); } catch (err) { toast(err.message, 'bad'); } b.disabled = false; });
    on('edit', () => { m.close(); tcWizard({ id: x.id }); });
    on('pl', () => { m.close(); tcWizard({ trainerId: x.trainerId, kind: 'pl', parentId: x.id }); });
    on('sign', () => tcSignModal(x.id));
    on('cancel', async () => { if (await confirmBox(`Hủy ${TC_KIND[x.kind].toLowerCase()} <b>${esc(x.no)}</b>? Số hợp đồng vẫn được giữ trong sổ theo dõi.`, { ok: 'Hủy hợp đồng', danger: true })) await Store.save('tcontracts', { ...x, status: 'cancelled' }, `${TC_SHORT[x.kind]} ${x.no}`, 'Hủy'); });
    on('restore', async () => { await Store.save('tcontracts', { ...x, status: x.files?.length ? 'signed' : 'draft' }, `${TC_SHORT[x.kind]} ${x.no}`, 'Khôi phục'); });
    on('del', async () => {
      if (x.kind === 'nt' && ntAppendices(x.id).length) { toast('Hợp đồng này đã có phụ lục – xóa các phụ lục trước, hoặc chọn “Hủy hợp đồng”.', 'bad'); return; }
      if (!(await confirmBox(`Xóa hẳn ${TC_KIND[x.kind].toLowerCase()} <b>${esc(x.no)}</b> và file đính kèm?${x.kind === 'pl' ? '<br>Số phụ lục sẽ được gỡ khỏi thù lao các lớp (giữ nguyên số tiền).' : ''}<br>Nếu chỉ không dùng nữa, nên chọn “Hủy hợp đồng” để giữ số trong sổ.`, { ok: 'Xóa', danger: true }))) return;
      try { if (x.kind === 'pl') await unlinkPlFees(x); await Store.remove('tcontracts', x, `${TC_SHORT[x.kind]} ${x.no} – ${x.trainerName || ''}`); [x.docFile, ...(x.files || [])].filter(Boolean).forEach((f2) => Store.backend.delFile(f2)); m.close(); toast('Đã xóa.', 'ok'); } catch (err) { /* đã báo */ }
    });
    hydrate(m.el); fillNames(m.el);
  }
}

function tcSignModal(id) {
  const x = tcontract(id); if (!x || !S.role.canEdit) return;
  const m = openModal({
    title: `Bản đã ký – ${esc(x.no)}`, sub: 'Đánh dấu đã ký và tải bản scan có chữ ký, dấu của hai bên', size: 'narrow',
    body: `<div class="fgrid">${f('sg-date', 'Ngày ký', inp('sg-date', x.signDate || todayISO(), 'type="date"'))}<div class="f full"><span class="lbl">Bản scan đã ký (PDF/ảnh)</span><div data-files></div></div></div>`,
    foot: `<span class="sp"></span><button type="button" class="btn" data-cancel>Hủy</button><button type="button" class="btn primary" data-ok>${ic('check')} Lưu – đã ký</button>`,
  });
  const files = mountFileField(m.el.querySelector('[data-files]'), x.files || [], { accept: '.pdf,image/*', hint: 'PDF hoặc ảnh chụp bản đã ký' });
  m.guard = formGuard(() => files.dirty(), [files]);
  m.el.querySelector('[data-cancel]').onclick = () => m.tryClose();
  m.el.querySelector('[data-ok]').onclick = async (e) => {
    e.currentTarget.disabled = true;
    try {
      await Store.save('tcontracts', { ...tcontract(id), status: 'signed', signDate: val(m.el, 'sg-date') || x.signDate, files: files.value() }, `${TC_SHORT[x.kind]} ${x.no} – ${x.trainerName || ''}`, 'Đã ký');
      files.commit(); m.guard = null; m.close(); toast('Đã cập nhật: hợp đồng đã ký.', 'ok');
    } catch (err) { e.currentTarget.disabled = false; }
  };
}

/* ======================= SỔ THEO DÕI HỢP ĐỒNG (Giảng viên → Hợp đồng) ======================= */
function tcRegisterHTML() {
  const t = todayISO(); const s = norm(S.ui.tcSearch || ''); const yr = S.ui.tcYear || 'all'; const kind = S.ui.tcKind || 'all'; const stF = S.ui.tcState || 'all';
  const inRegion = (x) => { const tr = trainer(x.trainerId); return !tr || S.ui.trRegion === 'all' || tr.region === S.ui.trRegion || (tr.otherRegions || []).includes(S.ui.trRegion); };
  const match = (x) => (yr === 'all' || String(tcYear(x)) === yr) && inRegion(x)
    && (!s || norm([x.no, x.trainerName, trainer(x.trainerId)?.name, ...(x.rows || []).map((r) => r.customer)].join(' ')).includes(s))
    && (stF === 'all' || tcState(x).key === stF || (stF === 'active' && tcState(x).key === 'expiring'));
  const all = S.tcontracts;
  const nts = all.filter((x) => x.kind === 'nt'); const pls = all.filter((x) => x.kind === 'pl');
  const activeTr = S.trainers.filter((x) => x.status !== 'paused');
  const withNt = activeTr.filter((x) => activeNt(x.id));
  const y = t.slice(0, 4); const plY = pls.filter((x) => String(tcYear(x)) === y && x.status !== 'cancelled');
  const expiring = nts.filter((x) => tcState(x).key === 'expiring');
  const drafts = all.filter((x) => tcState(x).key === 'draft');
  let html = `<div class="kpis">${kpi('HĐ nguyên tắc còn hiệu lực', `${withNt.length}<small>/${activeTr.length} GV</small>`, `${activeTr.length - withNt.length} giảng viên chưa có`, withNt.length < activeTr.length)}
    ${kpi('Sắp hết hạn (30 ngày)', expiring.length, expiring.length ? 'cần gia hạn / ký mới' : 'không có', expiring.length > 0, expiring.length ? 'warn' : '')}
    ${kpi('Chờ ký', drafts.length, drafts.length ? 'đã lập, chưa có bản ký' : 'không có')}
    ${kpi(`Phụ lục năm ${y}`, plY.length, `${moneyShort(sum(plY, (x) => plMoney(x).total))} · thực nhận ${moneyShort(sum(plY, (x) => plMoney(x).net))}`)}</div>`;
  const shownNt = kind === 'pl' ? [] : nts.filter((x) => match(x) || (kind === 'all' && ntAppendices(x.id).some(match)));
  const orphanPl = kind === 'nt' ? [] : pls.filter((x) => match(x) && (kind === 'pl' || !shownNt.some((n) => n.id === x.parentId)));
  if (!all.length) {
    html += `<div class="panel">${emptyBox('Chưa có hợp đồng giảng viên', 'Bấm “Tạo hợp đồng” để lập hợp đồng nguyên tắc thỉnh giảng theo mẫu DAKO, sau đó lập phụ lục cho từng đợt dạy.', `<button type="button" class="btn sm cta edit-only" data-act="tc-new">${ic('plus')} Tạo hợp đồng</button>`)}</div>`;
  } else if (!shownNt.length && !orphanPl.length) {
    html += `<div class="panel">${emptyBox('Không có hợp đồng phù hợp bộ lọc')}</div>`;
  } else {
    const rowHtml = (x, child) => {
      const st = tcState(x); const mm = x.kind === 'pl' ? plMoney(x) : null; const tr = trainer(x.trainerId);
      return `<tr class="${child ? 'child' : 'grp-nt'}${x.status === 'cancelled' ? ' cancel' : ''}" data-act="tc-view" data-id="${esc(x.id)}">
        <td class="nowrap">${child ? '<span class="tree">└</span>' : ''}<span class="strong">${esc(x.no || '—')}</span><div class="muted small">${x.kind === 'nt' ? 'HĐ nguyên tắc' : `Phụ lục số ${esc(padNo(x.seq))}`}</div></td>
        <td class="nowrap">${tr ? avatar(tr, 'sm') + ' ' : ''}${esc(tr?.name || x.trainerName || '')}</td><td class="num nowrap">${esc(fmtD(x.signDate))}</td>
        <td class="small">${x.kind === 'nt' ? `${esc(fmtD(x.from))} – ${esc(fmtD(x.to))}` : esc((x.rows || []).map((r) => `${r.customer}${r.time ? ' (' + r.time.replace(/^(Ngày|Từ) /, '') + ')' : ''}`).slice(0, 2).join('; ') + ((x.rows || []).length > 2 ? '…' : ''))}</td>
        ${mm ? moneyCell(mm.total) + moneyCell(mm.net) : '<td class="r muted">—</td><td class="r muted">—</td>'}
        <td>${pill(st.label, st.tone)}</td><td><div class="cell-files">${x.docFile ? fileButtons([x.docFile], 'Word') : ''}${(x.files || []).length || !x.docFile ? fileButtons(x.files, 'Bản ký') : ''}</div></td></tr>`;
    };
    html += `<div class="panel tbl-wrap"><table class="tbl tcreg"><thead><tr><th>Số hợp đồng</th><th>Giảng viên</th><th>Ngày ký</th><th>Hiệu lực / lớp dạy</th><th class="r">Giá trị</th><th class="r">Thực nhận</th><th>Tình trạng</th><th>File</th></tr></thead><tbody>`;
    const sortNt = (a, b) => tcYear(b) - tcYear(a) || tcSttOf(b) - tcSttOf(a) || (b.signDate || '').localeCompare(a.signDate || '');
    for (const n of shownNt.sort(sortNt)) {
      html += rowHtml(n, false);
      if (kind !== 'nt') for (const p of ntAppendices(n.id).filter(match)) html += rowHtml(p, true);
    }
    for (const p of orphanPl.sort(sortNt)) html += rowHtml(p, false);
    html += '</tbody></table></div>';
  }
  const noNt = activeTr.filter((x) => !usableNts(x.id).length && (S.ui.trRegion === 'all' || x.region === S.ui.trRegion || (x.otherRegions || []).includes(S.ui.trRegion)));
  if (noNt.length && all.length) html += `<div class="panel" style="margin-top:14px"><div class="panel-h"><h2>Giảng viên chưa có hợp đồng nguyên tắc còn hiệu lực</h2><span class="muted small">${noNt.length} người</span></div><div class="panel-b"><div class="chips">${noNt.sort((a, b) => a.name.localeCompare(b.name, 'vi')).map((x) => `<button type="button" class="chip" data-act="tc-new" data-trainer="${esc(x.id)}" title="Tạo hợp đồng nguyên tắc">${ic('plus')} ${esc(x.name)}</button>`).join('')}</div></div></div>`;
  html += `<p class="small muted" style="margin-top:8px">Số hợp đồng tự đánh theo mẫu ở Cài đặt (${esc(tcFmt('nt'))} · ${esc(tcFmt('pl'))}); công cụ báo trùng số. Bấm một dòng để xem, xuất lại file Word, tải bản đã ký hoặc tạo phụ lục.</p>`;
  return html;
}

/* ---------- cảnh báo cho Tổng quan ---------- */
function contractAlerts() {
  const out = []; const t = todayISO();
  if (!S.tcontracts.length) return out;
  for (const x of S.tcontracts) {
    if (x.kind !== 'nt' || x.status === 'cancelled') continue;
    const st = tcState(x);
    const newer = trainerNts(x.trainerId).some((n) => n.id !== x.id && n.status !== 'cancelled' && (n.to || '') > (x.to || ''));
    if (st.key === 'expiring' && !newer) out.push({ sev: 'warn', text: `Hợp đồng nguyên tắc ${x.no} – ${x.trainerName || ''} hết hạn ngày ${fmtD(x.to)}: gia hạn bằng phụ lục hoặc ký hợp đồng mới`, act: 'tc-view', id: x.id });
    if (st.key === 'draft' && x.from && x.from <= t) out.push({ sev: 'info', text: `Hợp đồng nguyên tắc ${x.no} – ${x.trainerName || ''} đã đến ngày hiệu lực nhưng chưa có bản đã ký`, act: 'tc-view', id: x.id });
  }
  const users = new Set(S.tcontracts.map((x) => x.trainerId));
  const seen = new Set();
  for (const c of S.classes) {
    if (c.status === 'cancelled' || c.startDate < t || daysBetween(t, c.startDate) > 30) continue;
    for (const tid of c.trainerIds || []) {
      const tr = trainer(tid); if (!tr || seen.has(tid) || !users.size) continue;
      if (!activeNt(tid, c.startDate)) { seen.add(tid); out.push({ sev: 'warn', text: `Giảng viên ${tr.name} dạy lớp ${classLabel(c)} ngày ${fmtD(c.startDate)} nhưng chưa có hợp đồng nguyên tắc còn hiệu lực`, act: 'tc-new', id: tid }); }
    }
  }
  return out;
}

/* ============================================================
   HỢP ĐỒNG HUẤN LUYỆN VỚI KHÁCH HÀNG – mẫu chuẩn DAKO (src/hdkh_tpl.js, tạo bởi tools/hdkh_template.py)
   • Bảng giá chi tiết / khung giá hợp đồng nguyên tắc (nhập trong Báo giá)
   • Điều khoản thanh toán (tự tính hạn) và phạt chậm thanh toán
   • Lập file Word hợp đồng từ báo giá – hợp đồng; tải mẫu trống để điền tay
   ============================================================ */

/* ---------- bảng giá chi tiết / khung giá ---------- */
function priceRowsEditor(container, rows, { onChange = () => {}, framework = () => false } = {}) {
  const list = (rows || []).map((r) => ({ id: r.id || uid('g'), name: r.name || '', unit: r.unit || 'lớp', min: r.min || '', max: r.max || '', qty: r.qty ?? '', price: Number(r.price) || 0 }));
  function render() {
    const fw = framework();
    container.innerHTML = `${list.length ? `<div class="tbl-wrap"><table class="tbl prows"><thead><tr><th>Nội dung / nhóm huấn luyện</th><th>Tính theo</th><th class="r" title="Áp dụng khi số học viên trong khoảng này (để trống nếu không giới hạn)">HV từ – đến</th>${fw ? '' : '<th class="r">Số lượng</th>'}<th class="r">Đơn giá (đ)</th>${fw ? '' : '<th class="r">Thành tiền (đ)</th>'}<th></th></tr></thead><tbody>
      ${list.map((r, i) => `<tr data-i="${i}" style="cursor:default"><td><input class="input" data-k="name" value="${esc(r.name)}" placeholder="VD: Nhóm 3 – An toàn hóa chất" aria-label="Nội dung"></td>
        <td><select class="input" data-k="unit" aria-label="Tính theo">${PRICE_UNITS.map((u) => opt(u, '/' + u, r.unit === u)).join('')}</select></td>
        <td class="r nowrap"><input class="input num" data-k="min" type="number" min="0" value="${esc(r.min)}" style="width:64px" aria-label="Từ số học viên"> – <input class="input num" data-k="max" type="number" min="0" value="${esc(r.max)}" style="width:64px" aria-label="Đến số học viên"></td>
        ${fw ? '' : `<td><input class="input num" data-k="qty" type="number" min="0" step="1" value="${esc(r.qty)}" style="width:80px" aria-label="Số lượng"></td>`}
        <td><input class="input num" data-k="price" data-money inputmode="numeric" value="${r.price ? money(r.price) : ''}" style="width:130px" aria-label="Đơn giá"></td>
        ${fw ? '' : `<td class="r strong" data-amt>${money(rowAmount(r))}</td>`}
        <td><button type="button" class="btn icon ghost" data-rm="${i}" aria-label="Xóa dòng">${ic('trash')}</button></td></tr>`).join('')}
      </tbody>${fw ? '' : `<tfoot><tr><td colspan="5">Tổng bảng giá</td><td class="r" data-total>${money(sum(list, rowAmount))}</td><td></td></tr></tfoot>`}</table></div>` : '<div class="muted small">Chưa có bảng giá chi tiết – hợp đồng in một dòng theo giá trị báo giá.</div>'}
      <div class="costadd" style="margin-top:6px"><button type="button" class="btn sm" data-add>${ic('plus')} Thêm dòng giá</button>${['Nhóm 1, 2', 'Nhóm 3', 'Nhóm 4', 'Nhóm 5', 'Nhóm 6'].map((g) => `<button type="button" class="chip" data-add="${g}">＋ ${g}</button>`).join('')}</div>`;
    bindMoney(container);
  }
  container.addEventListener('input', (e) => {
    const tr = e.target.closest('tr[data-i]'); const k = e.target.dataset.k; if (!tr || !k) return;
    const r = list[Number(tr.dataset.i)];
    if (k === 'price') r.price = parseMoney(e.target.value); else if (k === 'min' || k === 'max' || k === 'qty') r[k] = e.target.value === '' ? '' : Number(e.target.value); else r[k] = e.target.value;
    const a = tr.querySelector('[data-amt]'); if (a) a.textContent = money(rowAmount(r));
    const t = container.querySelector('[data-total]'); if (t) t.textContent = money(sum(list, rowAmount));
    onChange();
  });
  container.addEventListener('change', (e) => { const tr = e.target.closest('tr[data-i]'); if (tr && e.target.dataset.k === 'unit') { list[Number(tr.dataset.i)].unit = e.target.value; onChange(); } });
  container.addEventListener('click', (e) => {
    const rm = e.target.closest('[data-rm]'); const add = e.target.closest('[data-add]');
    if (rm) { list.splice(Number(rm.dataset.rm), 1); render(); onChange(); }
    if (add) { const g = add.dataset.add; list.push({ id: uid('g'), name: g ? `Huấn luyện ATVSLĐ ${g}` : '', unit: g === 'Nhóm 3' ? 'lớp' : 'người', min: '', max: '', qty: '', price: 0 }); render(); container.querySelector('tr[data-i]:last-child [data-k=name]')?.focus(); onChange(); }
  });
  render();
  return { value: () => list.filter((r) => r.name || r.price).map((r) => ({ ...r })), render, total: () => sum(list, rowAmount) };
}

/* ---------- điều khoản thanh toán & phạt chậm (dùng chung cho Báo giá và Lập hợp đồng) ---------- */
function payTermFields(p, q) {
  const t = q.payTerm || {};
  return `<div class="fgrid">
    ${f(`${p}-pbase`, 'Thời hạn thanh toán', `<select class="input" id="${p}-pbase">${opt('', '— Không ghi / nhập hạn tay —', !t.base)}${Object.entries(PAY_BASES).map(([k, v]) => opt(k, v[0].toUpperCase() + v.slice(1), t.base === k)).join('')}</select>`, { cls: 'span2' })}
    ${f(`${p}-pdays`, 'Trong vòng (ngày)', inp(`${p}-pdays`, t.days ?? '', 'type="number" min="0" placeholder="VD: 10"'))}
    <div class="f"><span class="lbl">Cách đếm</span><label class="inline-check" style="min-height:38px"><input type="checkbox" id="${p}-pwork"${t.workdays !== false ? ' checked' : ''}> Ngày làm việc (bỏ T7, CN)</label></div>
    ${f(`${p}-phand`, 'Bàn giao hồ sơ sau khóa học (ngày)', inp(`${p}-phand`, t.handover ?? 5, 'type="number" min="0"'), { hint: 'Dùng khi tính “sau khi bàn giao hồ sơ”' })}
    ${f(`${p}-pen`, 'Phạt chậm thanh toán (%/ngày)', inp(`${p}-pen`, q.penaltyRate ?? '', 'type="number" min="0" step="0.01" placeholder="VD: 0,05"'))}

/* ---------- số hợp đồng khách hàng ---------- */
const khFmt = () => settings().custContractNoFormat || DEFAULT_SETTINGS.custContractNoFormat;
function khAbbr(name) {
  const w = shortName(name).replace(/\(.*?\)/g, ' ').replace(/[–-]/g, ' ').split(/\s+/).filter(Boolean);
  if (!w.length) return 'KH';
  const last = w[w.length - 1];
  if (/^[A-ZĐ&.]{2,}$/.test(last.normalize('NFC')) && !/^\d+$/.test(last)) return last.replace(/\./g, '').slice(0, 8);
  const words = /^\d+$/.test(last) ? w.slice(-3, -1) : w.slice(-2);
  return words.map((x) => x[0]).join('').toUpperCase() || 'KH';
}
function nextKhNo(dateIso, custName) {
  const y = Number((dateIso || todayISO()).slice(0, 4)); let max = 0;

  return fmtDocNo(khFmt(), { stt: max + 1, year: y }).replace(/\{kh\}/gi, khAbbr(custName));

/** Điền mẫu hợp đồng khách hàng. vals = null → bản trống để điền tay. */
async function buildKhDocx(vals, rows) {
  const JSZip = await lib('jszip');
  const zip = await JSZip.loadAsync(HDKH_TPL.b64, { base64: true });
  const doc = new DOMParser().parseFromString(await zip.file('word/document.xml').async('string'), 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('Mẫu hợp đồng bị lỗi.');
  const tr = Array.from(doc.getElementsByTagNameNS(W_NS, 'tr')).find((n) => n.textContent.includes('{{r_stt}}'));
  if (tr) {
    for (const rv of rows && rows.length ? rows : [1, 2, 3].map((i) => ({ r_stt: String(i) }))) { const cl = tr.cloneNode(true); fillTokens(cl, (k) => rv[k], false); tr.parentNode.insertBefore(cl, tr); }
    tr.remove();
  }
  fillTokens(doc.documentElement, (k) => (vals ? vals[k] : undefined), true, HDKH_TPL.blanks);
  const xml = new XMLSerializer().serializeToString(doc).replace(/^<\?xml[^>]*\?>\s*/, '');
  zip.file('word/document.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n' + xml);
  return zip.generateAsync({ type: 'blob', mimeType: DOCX_MIME, compression: 'DEFLATE', compressionOptions: { level: 6 } });
}

/* ============================================================
   QUYẾT ĐỊNH HOÀN THÀNH KHÓA HỌC – sổ theo dõi số quyết định dạng STT/QĐ-N(1-6)-DAKO
   • Cấp số tiếp theo tự động (liên tục cả năm hoặc riêng từng nhóm – chọn trong Cài đặt), đánh lại từ 01 mỗi năm
   • Báo trùng số, số bị bỏ trống; đối chiếu với số quyết định ghi trong sổ cấp thẻ/GCN
   ============================================================ */

const DEC_STATUS = { draft: { label: 'Dự thảo – chờ ký', tone: 'info' }, signed: { label: 'Đã ký', tone: 'ok' }, cancelled: { label: 'Đã hủy', tone: 'muted' } };
const decFmt = () => settings().decisionNoFormat || DEFAULT_SETTINGS.decisionNoFormat;
const decSeqMode = () => (settings().decisionSeq === 'group' ? 'group' : 'year');
const decYear = (d) => Number(String(d.date || d.createdAt || todayISO()).slice(0, 4));
const decStt = (d) => Number(d.stt) || parseDocNo(decFmt(), d.no)?.stt || 0;
const decGroup = (d) => Number(d.group) || parseDocNo(decFmt(), d.no)?.group || 0;
const decPaper = (g) => (GROUPS[g]?.paper === 'GCN' ? 'Giấy chứng nhận' : GROUPS[g]?.paper || '');
const decNo = (stt, group, year) => fmtDocNo(decFmt(), { stt, group, year });
/** Phạm vi đánh số: cả năm (mặc định) hoặc từng nhóm trong năm. */
const decInScope = (d, year, group) => decYear(d) === Number(year) && (decSeqMode() === 'year' || decGroup(d) === Number(group));
function nextDecStt(year, group, exceptIds = []) {
  let max = 0;
  for (const d of S.decisions) if (!exceptIds.includes(d.id) && decInScope(d, year, group)) max = Math.max(max, decStt(d));
  return max + 1;
}
function decUsed(year, group, exceptIds = []) {
  return S.decisions.filter((d) => !exceptIds.includes(d.id) && decInScope(d, year, group)).map(decStt).filter(Boolean).sort((a, b) => a - b);
}
/** Số bị bỏ trống (1 → số lớn nhất) trong một phạm vi đánh số. */
function decGaps(year, group) {
  const used = new Set(decUsed(year, group)); const max = Math.max(0, ...used); const out = [];
  for (let i = 1; i < max; i++) if (!used.has(i)) out.push(i);
  return out;
}
const decKey = (d) => `${decYear(d)}|${decSeqMode() === 'group' ? decGroup(d) + '|' : ''}${decStt(d)}`;
function decDuplicates(list = S.decisions) {
  const map = new Map();
  for (const d of list) { if (!decStt(d)) continue; const k = decKey(d); map.set(k, [...(map.get(k) || []), d]); }
  return Array.from(map.values()).filter((v) => v.length > 1);
}
function decClash(no, stt, group, year, exceptId) {
  const n = norm(no);
  return S.decisions.find((d) => d.id !== exceptId && decYear(d) === Number(year) && ((n && norm(d.no) === n) || (stt && decStt(d) === Number(stt) && (decSeqMode() === 'year' || decGroup(d) === Number(group)))));
}
const decStudentsOf = (d) => {
  if (!d.batchId) return [];
  return allStudents().filter((x) => (x.r.batchId || x.r.id) === d.batchId && (!d.group || !x.v.group || Number(x.v.group) === Number(d.group)));
};
let DEC_INDEX = { src: null, map: new Map() };
function decIndex() {
  if (DEC_INDEX.src === S.decisions) return DEC_INDEX.map;
  const map = new Map();
  for (const d of S.decisions) {
    if (d.status === 'cancelled') continue;
    if (d.batchId) { map.set(`${d.batchId}|${decGroup(d)}`, d); if (!map.has(`${d.batchId}|*`)) map.set(`${d.batchId}|*`, d); }
    if (d.no) map.set('no|' + norm(d.no), d);
  }
  DEC_INDEX = { src: S.decisions, map };
  return map;
}
/** Quyết định áp cho một học viên: theo sổ theo dõi (đợt + nhóm), nếu không có thì lấy số ghi trong sổ cấp. */
function decisionForStudent(s, r) {
  const idx = decIndex(); const bid = r.batchId || r.id; const g = Number(s.group) || Number((r.groups || [])[0]) || 0;
  const d = (g ? idx.get(`${bid}|${g}`) : idx.get(`${bid}|*`)) || (r.decisionNo ? idx.get('no|' + norm(r.decisionNo)) : null);
  return d ? { no: d.no, date: d.date, id: d.id, files: d.files || [] } : r.decisionNo ? { no: r.decisionNo, date: r.decisionDate, id: null, files: [] } : null;
}
/** Số quyết định ghi trong sổ cấp nhưng chưa có trong sổ theo dõi. */
function decFromRosters() {
  const have = new Set(S.decisions.map((d) => norm(d.no)));
  const map = new Map();
  for (const b of batchesOf()) {
    const r = b.r; if (!r.decisionNo || have.has(norm(r.decisionNo))) continue;
    const k = norm(r.decisionNo); if (!map.has(k)) map.set(k, { no: r.decisionNo, date: r.decisionDate || r.issueDate || '', batch: b });
  }
  return Array.from(map.values());
}

      : `Năm ${p.y}${decSeqMode() === 'group' ? `, nhóm ${it.g}` : ''}: ${used.length ? `đã dùng ${esc(used.slice(-8).map(padNo).join(', '))}` : 'chưa có số nào'} · số tiếp theo ${padNo(nextDecStt(p.y, it.g, existing ? [existing.id] : []))}${auto}`;
  }
  function fillFromClass() {

        const no = p.items.length === 1 ? x.no : it.no;
        const parsed = parseDocNo(decFmt(), no);
        const rec = { ...(existing || {}), ...x, no, stt: parsed?.stt || it.stt || null, group: it.g, year: p.y, certType: decPaper(it.g), customerId: cu?.id || existing?.customerId || null, quoteId: c?.quoteId || b?.r?.quoteId || existing?.quoteId || null, files: p.items.length === 1 ? files.value() : [] };
        delete rec.groups;
        if (p.items.length > 1 && b) rec.students = allStudents().filter((s2) => (s2.r.batchId || s2.r.id) === b.id && (!s2.v.group || s2.v.group === it.g)).length || x.students;
        if (!rec.title) rec.title = `Công nhận hoàn thành khóa huấn luyện ATVSLĐ nhóm ${it.g}`;
        saved.push(await Store.save('decisions', rec, `QĐ ${no}${x.customerName ? ' – ' + x.customerName : ''}`, existing ? 'Cập nhật' : 'Cấp số'));
      }
      files.commit();
      // ghi số QĐ vào sổ cấp khi đợt chỉ có một nhóm (đợt nhiều nhóm: học viên tự nhận QĐ theo nhóm)
      if (b && saved.length === 1) {
        const bg = uniq(allStudents().filter((s2) => (s2.r.batchId || s2.r.id) === b.id).map((s2) => s2.v.group).filter(Boolean));
        const one = saved[0];
        if (bg.length <= 1 && b.parts.some((r) => r.decisionNo !== one.no || (r.decisionDate || '') !== one.date)) {
          const diff = b.parts.find((r) => r.decisionNo && norm(r.decisionNo) !== norm(one.no));
          if (!diff || (await confirmBox(`Sổ cấp đang ghi số quyết định <b>${esc(diff.decisionNo)}</b>. Đổi thành <b>${esc(one.no)}</b>?`, { ok: 'Đổi số trong sổ cấp' }))) {
            for (const r of b.parts) await Store.save('rosters', { ...r, decisionNo: one.no, decisionDate: one.date });
          }
        }
      }
      m.guard = null; m.close();
      toast(saved.length > 1 ? `Đã cấp ${saved.length} số: ${saved.map((s2) => s2.no).join(', ')}` : `Đã ${existing ? 'lưu' : 'cấp số'} ${saved[0].no}.`, 'ok');
      if (saved.length === 1) decDetail(saved[0].id, saved[0]);
    } catch (e) { console.error(e); ev.target.disabled = false; }
  };
}

}

function studentFilter() {
  const q = norm(S.ui.stSearch || ''); const co = S.ui.stCompany || ''; const g = S.ui.stGroup || ''; const ty = S.ui.stType || ''; const stt = S.ui.stStatus || ''; const yr = S.ui.stYear || '';
  return allStudents().filter((x) => {
    const v = x.v;
    if (co && studentKeyOfCompany(v) !== co) return false;
    if (g && String(v.group) !== g) return false;
    if (ty && v.certType !== ty) return false;
    if (yr && !(v.issueDate || '').startsWith(yr)) return false;
    if (stt && certStatus(v.expiry).key !== stt) return false;
    if (q && !norm([v.name, v.certNo, v.cccd, v.company, x.s.position, x.r.decisionNo, decisionForStudent(x.s, x.r)?.no].join(' ')).includes(q)) return false;
    return true;
  });
}
function batchesOf(list) {
  const map = new Map();
  for (const r of S.rosters) {
    const id = r.batchId || r.id;
    const b = map.get(id) || { id, parts: [], count: 0 };
    b.parts.push(r); b.count += rosterCount(r); map.set(id, b);

  const out = Array.from(map.values());
  out.forEach((b) => { b.parts.sort((a, c) => (a.part || 1) - (c.part || 1)); b.r = b.parts[0]; });
  return out.sort((a, b) => (b.r.issueDate || b.r.courseTo || '').localeCompare(a.r.issueDate || a.r.courseTo || ''));
}

async function saveRoster(doc, label, action) {
  const size = JSON.stringify(doc).length;
  if (size > 240000) { toast('Đợt cấp quá lớn để lưu trong một phần – hãy tạo đợt cấp mới cho các học viên tiếp theo.', 'bad'); throw new Error('too_big'); }
  STUDENT_CACHE.src = null;
  return Store.save('rosters', doc, label, action);
}

        ${f('sf-cccd', 'Số CCCD', inp('sf-cccd', s.cccd, 'inputmode="numeric" placeholder="12 số CCCD"'))}
        ${f('sf-pos', 'Chức vụ / công việc', inp('sf-pos', s.position, 'placeholder="VD: Thợ hàn, Tổ trưởng…"'), { cls: 'span2' })}

        ${f('sf-no', 'Số thẻ/GCN', inp('sf-no', s.certNo, 'placeholder="VD: DAKO-N3-05/2026"'))}
        ${f('sf-issue', 'Ngày cấp', inp('sf-issue', s.issueDate, 'type="date"'), { hint: r.issueDate ? 'Để trống = theo đợt cấp ' + fmtD(r.issueDate) : '' })}
        ${f('sf-exp', 'Hiệu lực đến', inp('sf-exp', s.expiry, 'type="date"'), { hint: 'Để trống = tự tính theo nhóm' })}
        ${f('sf-result', 'Kết quả', inp('sf-result', s.result, 'placeholder="Đạt / điểm"'))}
        ${f('sf-content', 'Nội dung huấn luyện', inp('sf-content', s.content, 'placeholder="VD: Nhóm 3: Hàn, cắt kim loại"'), { cls: 'full' })}
        ${f('sf-notes', 'Ghi chú', `<textarea class="input" id="sf-notes" rows="2" placeholder="Ngày nhận thẻ, người nhận ký, ghi chú khác…">${esc(s.notes || '')}</textarea>`, { cls: 'full' })}

        <div class="f span2"><span class="lbl">Hình thẻ / GCN (ảnh hoặc PDF)</span><div data-cards></div></div>

      </div></fieldset></form>`,

  });
  const root = m.el;
  const ph = mountFileField(root.querySelector('[data-photo]'), files.filter((x) => x.kind === 'anh').slice(0, 1), { image: true });
  const cards = mountFileField(root.querySelector('[data-cards]'), files.filter((x) => x.kind === 'the'), { accept: 'image/*,application/pdf', hint: 'Ảnh chụp/scan mặt trước – mặt sau' });
  const others = mountFileField(root.querySelector('[data-others]'), files.filter((x) => !['anh', 'the'].includes(x.kind)));
  const read = () => ({ name: val(root, 'sf-name'), gender: val(root, 'sf-gender'), dob: val(root, 'sf-dob'), nationality: val(root, 'sf-nat'), cccd: val(root, 'sf-cccd'), position: val(root, 'sf-pos'),

  const snap = JSON.stringify(read());
  m.guard = formGuard(() => JSON.stringify(read()) !== snap || ph.dirty() || cards.dirty() || others.dirty(), [ph, cards, others]);
  root.querySelector('[data-cancel]').onclick = () => m.tryClose();
  root.querySelector('[data-save]').onclick = async (ev) => {
    const d = read();
    if (!d.name) { toast('Cần nhập họ tên học viên.', 'bad'); return; }
    const dup = d.certNo && allStudents().find((x) => x.s.k !== s.k && norm(x.s.certNo) === norm(d.certNo));
    if (dup) { toast(`Số ${d.certNo} đã cấp cho ${dup.v.name} (${dup.v.company}).`, 'bad'); return; }
    const newFiles = [...(ph.value() ? [{ ...ph.value(), kind: 'anh' }] : []), ...cards.value().map((x) => ({ ...x, kind: 'the' })), ...others.value().map((x) => ({ ...x, kind: x.kind && x.kind !== 'the' && x.kind !== 'anh' ? x.kind : 'khac' }))];
    const stu = { ...s, ...d, files: newFiles };
    let target = roster(r.id) || r;
    const doc = clone(target);
    doc.students = doc.students || [];
    const i = doc.students.findIndex((x) => x.k === s.k);
    if (i >= 0) doc.students[i] = stu; else doc.students.push(stu);
    ev.target.disabled = true;
    try {
      await saveRoster(doc, `${stu.name} – ${doc.title || doc.customerName || 'đợt cấp'}`, existing ? 'Cập nhật' : 'Thêm');
      ph.commit(); cards.commit(); others.commit(); m.guard = null; m.close(); toast(existing ? 'Đã cập nhật học viên.' : 'Đã thêm học viên.', 'ok');
    } catch (e) { ev.target.disabled = false; }
  };
}

async function deleteStudent(r, s) {
  if (!(await confirmBox(`Xóa học viên <b>${esc(s.name)}</b> khỏi đợt cấp “${esc(r.title || '')}” cùng hình thẻ/GCN đã gắn?`, { ok: 'Xóa học viên', danger: true }))) return false;
  const doc = clone(roster(r.id) || r); doc.students = (doc.students || []).filter((x) => x.k !== s.k);
  try { await saveRoster(doc, `${s.name} – ${doc.title || ''}`, 'Xóa'); (s.files || []).forEach((x) => Store.backend.delFile(x)); toast('Đã xóa học viên.', 'ok'); return true; } catch (e) { return false; }
}

    issueDate: val(root, 'rf-issue'), decisionNo: val(root, 'rf-dno'), decisionDate: val(root, 'rf-ddate'), classId: val(root, 'rf-class') || null, quoteId: val(root, 'rf-quote') || null, notes: val(root, 'rf-notes') });
  const snap = JSON.stringify(read());
  m.guard = formGuard(() => JSON.stringify(read()) !== snap || df.dirty() || of.dirty(), [df, of]);
  root.querySelector('[data-cancel]').onclick = () => m.tryClose();
  root.querySelector('[data-save]').onclick = async (ev) => {
    const d = read();
    if (!d.title) { toast('Cần nhập tên đợt cấp.', 'bad'); return; }
    ev.target.disabled = true;
    try {
      const cu = d.customerName ? await ensureCustomer(d.customerName) : null;
      const base = { ...d, customerId: cu?.id || null, customerName: cu?.name || d.customerName };
      if (!parts.length) {
        const id = uid('ro');
        await saveRoster({ ...r, ...base, id, batchId: id, part: 1, students: [], decisionFiles: df.value(), files: of.value() }, base.title, 'Thêm');
      } else {
        for (let i = 0; i < parts.length; i++) {
          const p = roster(parts[i].id) || parts[i];
          await saveRoster({ ...p, ...base, batchId: p.batchId || batchId, decisionFiles: i === 0 ? df.value() : [], files: i === 0 ? of.value() : [] }, i === 0 ? base.title : '', 'Cập nhật');
        }
      }
      df.commit(); of.commit(); m.guard = null; m.close(); toast('Đã lưu đợt cấp.', 'ok');
    } catch (e) { ev.target.disabled = false; }
  };
}

async function deleteBatch(batchId) {
  const parts = rostersOfBatch(batchId); const n = sum(parts, rosterCount);
  if (!(await confirmBox(`Xóa đợt cấp <b>${esc(parts[0]?.title || '')}</b> cùng <b>${n}</b> học viên, quyết định và hình thẻ/GCN đã gắn? Không hoàn tác được.`, { ok: 'Xóa đợt cấp', danger: true }))) return false;
  try {
    for (const p of parts) {
      await Store.remove('rosters', p, `${p.title || 'Đợt cấp'}${parts.length > 1 ? ' – phần ' + (p.part || 1) : ''}`);
      [...(p.decisionFiles || []), ...(p.files || []), ...(p.students || []).flatMap((s) => s.files || [])].forEach((x) => Store.backend.delFile(x));
    }
    STUDENT_CACHE.src = null; toast('Đã xóa đợt cấp.', 'ok'); return true;
  } catch (e) { return false; }
}

/** Biểu đồ doanh thu (cột nhạt) và lợi nhuận (cột đậm bên trong) theo tháng, tính từ hợp đồng đã ký. */
function revenueChart(year, curYm) {
  const data = Array.from({ length: 12 }, (_, i) => {
    const ym = `${year}-${pad(i + 1)}`;
    const qs = S.quotes.filter((q) => isContract(q) && (q.contractDate || '').startsWith(ym));
    const pn = qs.map(contractPnl);
    const rev = sum(pn, (p) => p.rev); const prof = sum(pn, (p) => p.profit);
    return { label: 'T' + (i + 1), a: rev, b: prof, cur: ym === curYm, tip: `${fmtYM(ym)}: doanh thu ${moneyD(rev)} · lợi nhuận ${moneyD(prof)}${rev ? ` (${pct(prof / rev)})` : ''} · ${qs.length} HĐ` };
  });
  return bulletChart(data, ['Doanh thu (HĐ đã ký)', 'Lợi nhuận']);
}

function classLi(c) {
  const conflict = conflictsFor(c).length;
  return `<li class="clickable" data-act="class-view" data-id="${esc(c.id)}"><span class="when"><b>${c.startDate.slice(8, 10)}</b><span>${dowOf(c.startDate)} · T${Number(c.startDate.slice(5, 7))}</span></span>
    <div class="grow"><div class="t">${esc(classLabel(c))}${conflict ? ' ' + pill('Trùng lịch GV', 'bad') : ''}</div>
    <div class="s">${esc([fmtDateRange(c.startDate, c.endDate), c.startTime && `${c.startTime}–${c.endTime || ''}`, groupsText(c.groups), c.students ? c.students + ' HV' : ''].filter(Boolean).join(' · '))}</div>
    <div class="s">${rtag(c.region)} · ${esc(c.location || 'Chưa có địa điểm')}</div>
    <div class="s">${(c.trainerIds || []).length ? 'GV: ' + esc(trainerNames(c.trainerIds)) : '<span style="color:var(--warn);font-weight:600">Chưa phân công giảng viên</span>'}</div></div>
    <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">${classPill(c)}${docButtons(c)}</div></li>`;
}
function docButtons(c) {
  const q = c.quoteId && quote(c.quoteId);
  if (!q) return '';
  return `<span style="display:flex;gap:4px">${(q.quoteFiles || []).length ? fileButtons(q.quoteFiles, 'BG') : ''}${(q.contractFiles || []).length ? fileButtons(q.contractFiles, 'HĐ') : ''}</span>`;
}

  },
  visible(c) { return S.ui.region === 'all' || c.region === S.ui.region; },
  monthHTML(ym) {
    const first = parseISO(ym + '-01');

    const start = addDays(ym + '-01', -offset);

    for (let i = 0; i < weeks * 7; i++) {
      const d = addDays(start, i); const out = ymOf(d) !== ym;
      const cs = classesOn(d).filter((c) => this.visible(c)).sort(sortClasses);

        ${shown.map((c) => {

            <span class="l1">${cont}${c.startTime && c.startTime !== settings().dayStart ? esc(c.startTime) + ' ' : ''}${esc(shortName(classLabel(c)))}</span><span class="l2">${esc([groupsShort(c.groups), c.students ? c.students + ' HV' : '', (c.trainerIds || []).map((id) => trainer(id)?.name?.split(' ').slice(-1)[0] || '?').join(', ') || 'chưa có GV'].filter(Boolean).join(' · '))}</span></button>`;
        }).join('')}

    html += `<div class="stack" data-daypanel>${this.dayPanelHTML(S.ui.selDate)}</div></div>`;
    return html;
  },
  dayPanelHTML(d) {
    const cs = classesOn(d).filter((c) => this.visible(c)).sort(sortClasses);
    const reg = S.ui.region;
    const trs = trainersInRegion(reg);

    html += `</div></section><section class="panel"><div class="panel-h"><h2>Giảng viên ${reg === 'all' ? '– tất cả vùng' : '– ' + esc(regionName(reg))}</h2><span class="muted small">trạng thái ngày ${fmtDM(d)}</span></div><div class="panel-b flush">`;
    if (!trs.length) html += emptyBox(reg === 'all' ? 'Chưa có giảng viên' : 'Vùng này chưa có giảng viên', '', `<button type="button" class="btn sm edit-only" data-act="trainer-new">${ic('plus')} Thêm giảng viên</button>`);
    else {
      html += `<ul class="avail">${trs.map((x) => {

          <span class="s">${busy.length ? `<span style="color:var(--accent);font-weight:600">● Bận:</span> ${esc(busy.map((b) => `${classLabel(b)} ${b.startTime || ''}–${b.endTime || ''}`).join('; '))}` : '<span style="color:var(--ok);font-weight:600">● Rảnh</span>'}</span>
          <span class="s muted">${esc(x.phone || '')} · ${load.days} ngày dạy/tháng${x.region !== reg && reg !== 'all' ? ' · vùng ' + esc(regionName(x.region)) : ''}</span></span></li>`;
      }).join('')}</ul>`;

  },
  resHTML(ym) {
    const days = Number(monthEnd(ym).slice(8)); const t = todayISO();
    const trs = trainersInRegion(S.ui.region);
    if (!trs.length) return `<div class="panel">${emptyBox('Chưa có giảng viên trong vùng này', '', `<button type="button" class="btn sm edit-only" data-act="trainer-new">${ic('plus')} Thêm giảng viên</button>`)}</div>`;
    let html = '<div class="res-wrap"><table class="res"><thead><tr><th class="who">Giảng viên</th>';
    for (let i = 1; i <= days; i++) { const d = `${ym}-${pad(i)}`; const w = parseISO(d).getDay(); html += `<th class="${w === 0 || w === 6 ? 'we' : ''}${d === t ? ' today' : ''}" title="${esc(DOW_LONG[w] + ' ' + fmtD(d))}">${i}<br><span style="font-weight:500">${DOW[w]}</span></th>`; }
    html += '</tr></thead><tbody>';
    for (const x of trs) {
      const load = trainerMonthLoad(x.id, ym);
      html += `<tr><th class="who" data-act="trainer-view" data-id="${esc(x.id)}" style="cursor:pointer"><span class="n">${esc(x.name)}</span><span class="s">${esc(regionName(x.region))} · ${load.days} ngày</span></th>`;
      for (let i = 1; i <= days; i++) {
        const d = `${ym}-${pad(i)}`; const w = parseISO(d).getDay();
        const cs = busyClasses(x.id, { startDate: d, endDate: d });
        let cx = false;
        for (let a = 0; a < cs.length; a++) for (let b = a + 1; b < cs.length; b++) if (timeOverlap(cs[a], cs[b])) cx = true;
        const c0 = cs[0];
        const title = cs.length ? cs.map((c) => `${classLabel(c)} ${c.startTime || ''}–${c.endTime || ''} (${c.location || ''})`).join('\n') : `${x.name} rảnh ngày ${fmtD(d)}`;
        html += `<td class="c${w === 0 || w === 6 ? ' we' : ''}${cs.length ? ' busy' : ''}${cx ? ' cx' : ''}" style="--rc:${c0 ? regionColor(c0.region) : 'transparent'}" title="${esc(title)}" ${c0 ? `data-act="class-view" data-id="${esc(c0.id)}"` : `data-act="class-new" data-date="${d}" data-trainer="${esc(x.id)}"`}>${cs.length > 1 ? `<span class="cnt">${cs.length}</span>` : ''}</td>`;
      }
      html += '</tr>';
    }
    html += `</tbody></table></div><div class="legend"><span>Ô có màu: giảng viên có lớp (màu theo vùng của lớp)</span><span><span class="sample cx"></span>Hai lớp trùng giờ</span><span>${S.role.canEdit ? 'Bấm ô trống để xếp lớp cho giảng viên vào ngày đó' : ''}</span></div>`;
    return html;
  },
  listHTML(ym) {
    const q = norm(S.ui.calSearch || '');
    const cs = S.classes.filter((c) => classInMonth(c, ym) && this.visible(c))
      .filter((c) => !S.ui.trainerFocus || (c.trainerIds || []).includes(S.ui.trainerFocus))
      .filter((c) => !q || norm([classLabel(c), c.location, trainerNames(c.trainerIds), c.title].join(' ')).includes(q))
      .sort(sortClasses);
    const live = cs.filter((c) => c.status !== 'cancelled');
    const P = live.map(classPnl);
    let html = `<div class="toolbar"><div class="search">${ic('search')}<input class="input" type="search" id="cal-search" placeholder="Tìm khách hàng, địa điểm, giảng viên…" value="${esc(S.ui.calSearch || '')}" data-input="cal-search"></div><span class="muted small">${cs.length} lớp · doanh thu ${moneyShort(sum(P, (p) => p.rev))} · lợi nhuận ${moneyShort(sum(P, (p) => p.profit))}</span></div>`;
    if (!cs.length) return html + `<div class="panel">${emptyBox('Không có lớp nào trong tháng này', '', `<button type="button" class="btn sm cta edit-only" data-act="class-new">${ic('plus')} Thêm lớp</button>`)}</div>`;
    html += `<div class="panel tbl-wrap"><table class="tbl wide"><thead><tr><th>Ngày</th><th style="min-width:180px">Khách hàng / lớp</th><th>Nhóm</th><th class="r">HV</th><th>Giảng viên</th><th class="r">Doanh thu</th><th class="r">Thù lao GV</th><th class="r" title="Hoa hồng phân bổ từ hợp đồng, đã gồm thuế khấu trừ">Hoa hồng</th><th class="r">Chi phí khác</th><th class="r">Lợi nhuận</th><th>Trạng thái</th><th>Hồ sơ</th></tr></thead><tbody>`;
    for (const c of cs) {
      const m = classPnl(c); const q2 = c.quoteId && quote(c.quoteId);

        <td><span class="strong">${esc(classLabel(c))}</span>${c.title ? `<div class="muted small">${esc(c.title)}</div>` : ''}${conflictsFor(c).length ? '<div>' + pill('Trùng lịch GV', 'bad') + '</div>' : ''}</td>
        <td class="nowrap">${esc(groupsShort(c.groups))}</td><td class="r">${money(c.students)}</td>
        <td>${esc(trainerNames(c.trainerIds)) || '<span style="color:var(--warn)">Chưa có</span>'}</td>
        ${moneyCell(m.rev)}${moneyCell(m.gv)}${moneyCell(m.com.gross)}${moneyCell(m.other)}<td class="r strong" style="color:${m.profit < 0 ? 'var(--bad)' : 'var(--ok)'}">${money(m.profit)}${m.rev ? `<div class="muted small">${pct(m.margin)}</div>` : ''}</td><td>${classPill(c)}</td>
        <td><div class="cell-files">${q2 ? fileButtons(q2.quoteFiles, 'BG') + fileButtons(q2.contractFiles, 'HĐ') : '<span class="muted small">Chưa gắn BG</span>'}</div></td></tr>`;
    }
    html += `</tbody><tfoot><tr><td colspan="3">Tổng (không tính lớp hủy)</td><td class="r">${money(sum(live, (c) => c.students))}</td><td></td>${moneyCell(sum(P, (p) => p.rev))}${moneyCell(sum(P, (p) => p.gv))}${moneyCell(sum(P, (p) => p.com.gross))}${moneyCell(sum(P, (p) => p.other))}${moneyCell(sum(P, (p) => p.profit))}<td colspan="2"></td></tr></tfoot></table></div>
      <p class="small muted" style="margin-top:8px">Hoa hồng và chi phí cấp hợp đồng được phân bổ cho từng lớp theo tỷ lệ giá lớp trong hợp đồng. Doanh thu chính thức tính ở tab Doanh thu – Lợi nhuận (theo hợp đồng đã ký).</p>`;
    return html;
  },
};

  },
  ledgerRange() {
    const v = S.ui.ledPeriod;
    if (v === 'all') return { from: '', to: '', label: 'Tất cả thời gian' };
    if (v.startsWith('y:')) { const y = v.slice(2); return { from: `${y}-01-01`, to: `${y}-12-31`, label: `Năm ${y}` }; }
    const ym = v.slice(2); return { from: ym + '-01', to: monthEnd(ym), label: fmtYM(ym) };
  },
  ledger() {
    const el = this.el; const tools = el.querySelector('[data-tools]');
    const y = todayISO().slice(0, 4); const ym0 = todayISO().slice(0, 7);
    const opts = [['all', 'Tất cả thời gian'], [`y:${y}`, `Năm ${y}`], [`y:${Number(y) - 1}`, `Năm ${Number(y) - 1}`], ...Array.from({ length: 12 }, (_, i) => { const m = ymAdd(ym0, -i); return [`m:${m}`, fmtYM(m)]; })];
    if (tools.dataset.mode !== 'ledger') {
      tools.dataset.mode = 'ledger';
      tools.innerHTML = `<div class="search">${ic('search')}<input class="input" type="search" id="led-search" placeholder="Tìm giảng viên, khách hàng…" value="${esc(S.ui.ledSearch || '')}" data-input="led-search"></div>
        <select class="input" id="led-period" style="width:auto" data-input="led-period" aria-label="Kỳ theo ngày lớp">${opts.map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join('')}</select>
        <div class="chips" data-ledstate></div>`;
    }
    el.querySelector('#led-period').value = S.ui.ledPeriod;
    el.querySelector('[data-ledstate]').innerHTML = [['owe', 'Còn nợ'], ['all', 'Tất cả'], ['paid', 'Đã thanh toán đủ']].map(([v, l]) => `<button type="button" class="chip" data-act="led-state" data-v="${v}" aria-pressed="${S.ui.ledState === v}">${l}</button>`).join('');
    const R = this.ledgerRange(); const s = norm(S.ui.ledSearch || '');
    const groups = S.trainers
      .filter((x) => S.ui.trRegion === 'all' || x.region === S.ui.trRegion || (x.otherRegions || []).includes(S.ui.trRegion))
      .map((x) => {
        const L = trainerLedger(x.id, R.from, R.to);
        let rows = L.rows.filter((r) => !s || norm([x.name, x.phone, classLabel(r.c), r.f.contractNo].join(' ')).includes(s));
        if (S.ui.ledState === 'owe') rows = rows.filter((r) => r.remain !== 0 || r.label === 'Chưa nhập thù lao');
        if (S.ui.ledState === 'paid') rows = rows.filter((r) => r.label === 'Đã thanh toán đủ');
        return { x, rows, amount: sum(rows, (r) => r.amount), paid: sum(rows, (r) => r.paid), remain: sum(rows, (r) => Math.max(0, r.remain)) };
      }).filter((g) => g.rows.length).sort((a, b) => b.remain - a.remain || a.x.name.localeCompare(b.x.name, 'vi'));
    const all = S.trainers.map((x) => trainerLedger(x.id, R.from, R.to));
    const body = el.querySelector('[data-body]');
    let html = `<div class="kpis">${kpi('Tổng thù lao (HĐ thuê GV)', moneyShort(sum(all, (L) => L.amount)), `${R.label} · ${sum(all, (L) => L.rows.length)} lượt dạy`)}${kpi('Đã trả (tạm ứng + thanh toán)', moneyShort(sum(all, (L) => L.paid)), moneyD(sum(all, (L) => L.paid)))}${kpi('Còn phải trả', moneyShort(sum(all, (L) => L.remain)), `${all.filter((L) => L.remain > 0).length} giảng viên còn nợ`, sum(all, (L) => L.remain) > 0)}</div>`;
    if (!groups.length) { body.innerHTML = html + `<div class="panel">${emptyBox(S.classes.length ? 'Không có khoản thù lao phù hợp bộ lọc' : 'Chưa có lớp nào', 'Thù lao từng lớp nhập khi phân công giảng viên trong tab Lịch giảng dạy.')}</div>`; return; }
    html += `<div class="panel tbl-wrap"><table class="tbl"><thead><tr><th>Ngày lớp</th><th>Khách hàng / lớp</th><th class="r">Số ngày</th><th>HĐ thuê GV</th><th class="r">Thù lao</th><th class="r">Đã trả</th><th class="r">Còn lại</th><th>Tình trạng</th><th></th></tr></thead>`;
    for (const g of groups) {
      html += `<tbody><tr class="grp" data-act="trainer-view" data-id="${esc(g.x.id)}"><td colspan="4">${avatar(g.x, 'sm')} <b>${esc(g.x.name)}</b> <span class="muted small">${esc(g.x.phone || '')} · ${esc(regionName(g.x.region))} · ${g.rows.length} lớp</span></td>${moneyCell(g.amount, 'strong')}${moneyCell(g.paid, 'strong')}<td class="r strong" style="color:${g.remain > 0 ? 'var(--accent)' : 'var(--ok)'}">${money(g.remain)}</td><td colspan="2"></td></tr>`;
      for (const r of g.rows) {
        html += `<tr data-act="fee-open" data-id="${esc(r.c.id)}" data-trainer="${esc(g.x.id)}"><td class="nowrap num">${esc(fmtDateRange(r.c.startDate, r.c.endDate))}</td><td>${esc(classLabel(r.c))}<div class="muted small">${esc(groupsText(r.c.groups))}${r.c.students ? ' · ' + r.c.students + ' HV' : ''}${r.c.status === 'cancelled' ? ' · đã hủy' : ''}</div></td><td class="r">${r.days}</td>
          <td class="small">${esc(r.f.contractNo || '')}${(r.f.files || []).length ? ' ' + fileButtons(r.f.files, 'HĐ') : r.f.contractNo ? '' : '<span class="muted">—</span>'}</td>
          ${feeAmountCell(r)}${moneyCell(r.paid)}<td class="r strong" style="color:${r.remain > 0 ? 'var(--accent)' : r.remain < 0 ? 'var(--bad)' : 'var(--ok)'}">${money(r.remain)}</td><td>${pill(r.label, r.tone)}</td>
          <td class="r"><button type="button" class="btn xs edit-only" data-act="fee-pay" data-id="${esc(r.c.id)}" data-trainer="${esc(g.x.id)}">${ic('money')} Trả tiền</button></td></tr>`;
      }
      html += '</tbody>';
    }
    html += `<tfoot><tr><td colspan="4">Tổng ${groups.length} giảng viên</td>${moneyCell(sum(groups, (g) => g.amount))}${moneyCell(sum(groups, (g) => g.paid))}${moneyCell(sum(groups, (g) => g.remain))}<td colspan="2"></td></tr></tfoot></table></div>
      <p class="small muted" style="margin-top:8px">Bấm một dòng để sửa thù lao, số HĐ thuê giảng viên, tải file hợp đồng và ghi nhận tạm ứng/thanh toán.</p>`;
    body.innerHTML = html; hydrate(body);
  },
};

  mount(el) {
    S.ui.pfPeriod = S.ui.pfPeriod || 'year'; S.ui.pfMonth = S.ui.pfMonth || todayISO().slice(0, 7);
    el.innerHTML = `<div class="page-head"><div><h1>Doanh thu – Lợi nhuận</h1><div class="sub">Doanh thu tính từ hợp đồng đã ký · Lợi nhuận = doanh thu – thù lao giảng viên – hoa hồng (gồm thuế khấu trừ) – chi phí khác</div></div>

      <div data-body></div>`;
    this.el = el; this.update();
  },
  update() {
    const el = this.el; const kind = S.ui.pfPeriod; const P = viewPeriod(kind, S.ui.pfMonth);
    el.querySelector('[data-pf-seg]').innerHTML = periodSeg(kind, 'pf-period', ['month', 'quarter', 'year', 'all']);
    el.querySelector('[data-pf-label]').textContent = P.label;
    el.querySelector('[data-pf-nav]').style.visibility = kind === 'all' ? 'hidden' : '';
    const qs = S.quotes.filter((q) => isContract(q) && (kind === 'all' || ((q.contractDate || '') >= P.from && (q.contractDate || '') <= P.to)))
      .sort((a, b) => (b.contractDate || '').localeCompare(a.contractDate || ''));
    const rows = qs.map((q) => ({ q, p: contractPnl(q) }));
    const T = (f) => sum(rows, (r) => f(r.p));
    const rev = T((p) => p.rev); const prof = T((p) => p.profit);
    let html = `<div class="kpis">${kpi('Doanh thu', moneyShort(rev), `${rows.length} hợp đồng đã ký · ${moneyD(rev)}`)}
      ${kpi('Thù lao giảng viên', moneyShort(T((p) => p.gv)), rows.some((r) => r.p.gvEstimated) ? 'có số ước tính' : moneyD(T((p) => p.gv)))}
      ${kpi('Hoa hồng', moneyShort(T((p) => p.com.gross)), `Thực trả ${moneyShort(T((p) => p.com.net))} · thuế ${moneyShort(T((p) => p.com.tax))}`)}
      ${kpi('Chi phí khác', moneyShort(T((p) => p.other)), moneyD(T((p) => p.other)))}
      ${kpi('Lợi nhuận', moneyShort(prof), rev ? `Tỷ suất ${pct(prof / rev)}` : '—', false, prof < 0 ? 'neg' : 'pos')}
      ${kpi('Đã thu / còn phải thu', moneyShort(T((p) => p.paid)), `Còn phải thu ${moneyD(T((p) => p.remain))}`, T((p) => p.remain) > 0)}</div>`;
    const year = kind === 'all' ? todayISO().slice(0, 4) : P.from.slice(0, 4);

    if (!rows.length) {
      html += `<div class="panel">${emptyBox('Chưa có hợp đồng đã ký trong kỳ', 'Doanh thu chỉ tính khi báo giá được chuyển thành hợp đồng (điền số hợp đồng, ngày ký ở tab Báo giá).', '<a class="btn sm" href="#bao-gia">Đến tab Báo giá</a>')}</div>`;

          ${moneyCell(p.rev)}<td class="r">${money(p.gv)}${p.gvEstimated ? '<div class="muted small">ước tính</div>' : ''}</td>${moneyCell(p.com.agent + p.com.other)}${moneyCell(p.com.manager)}${moneyCell(p.com.tax)}${moneyCell(p.other)}
          <td class="r strong" style="color:${p.profit < 0 ? 'var(--bad)' : 'var(--ok)'}">${money(p.profit)}</td><td class="r">${p.rev ? pct(p.margin) : '—'}</td></tr>`).join('')}
        </tbody><tfoot><tr><td colspan="3">Tổng ${rows.length} hợp đồng</td>${moneyCell(rev)}${moneyCell(T((p) => p.gv))}${moneyCell(T((p) => p.com.agent + p.com.other))}${moneyCell(T((p) => p.com.manager))}${moneyCell(T((p) => p.com.tax))}${moneyCell(T((p) => p.other))}${moneyCell(prof)}<td class="r">${rev ? pct(prof / rev) : ''}</td></tr></tfoot></table></div>

    }
    const noContract = S.classes.filter((c) => c.status !== 'cancelled' && !contractOfClass(c) && (kind === 'all' || (c.startDate >= P.from && c.startDate <= P.to)));
    if (noContract.length) {
      html += `<section class="panel" style="margin-top:16px"><div class="panel-h"><h2>Lớp chưa có hợp đồng đã ký</h2>${pill(`${noContract.length} lớp · ${moneyShort(sum(noContract, (c) => Number(c.price) || 0))} chưa tính doanh thu`, 'warn')}</div><div class="panel-b flush"><ul class="list">${noContract.sort(sortClasses).slice(0, 12).map(classLi).join('')}</ul></div></section>`;
    }
    el.querySelector('[data-body]').innerHTML = html;
    hydrate(el);
  },
};

const CustomersView = {
  mount(el) {
    el.innerHTML = `<div class="page-head"><div><h1>Khách hàng</h1><div class="sub">Lịch sử huấn luyện từng doanh nghiệp, công nợ, học viên đã cấp thẻ/GCN và hạn huấn luyện định kỳ</div></div>
      <div class="actions">${exportBtn('khach-hang')}<button type="button" class="btn cta edit-only" data-act="customer-new">${ic('plus')} Thêm khách hàng</button></div></div>
      <div class="toolbar"><div class="search">${ic('search')}<input class="input" type="search" id="cu-search" placeholder="Tìm tên công ty, MST, người liên hệ…" value="${esc(S.ui.cuSearch || '')}" data-input="cu-search"></div>
      <label class="inline-check"><input type="checkbox" id="cu-due" data-input="cu-due" ${S.ui.cuDue ? 'checked' : ''}> Chỉ khách sắp/đã đến hạn định kỳ</label><span class="muted small" data-count></span></div>
      <div data-body></div>`;
    this.el = el; this.update();
  },
  update() {
    const el = this.el; const s = norm(S.ui.cuSearch || ''); const warn = Number(settings().warnDays) || 60;
    const rows = S.customers.map((c) => ({ c, st: customerStats(c.id), dues: customerDues(c.id) }))
      .filter((r) => !s || norm([r.c.name, r.c.taxCode, r.c.contact, r.c.phone, r.c.address].join(' ')).includes(s))
      .filter((r) => !S.ui.cuDue || (r.dues[0] && daysBetween(todayISO(), r.dues[0].due) <= warn))
      .sort((a, b) => (a.dues[0]?.due || '9999').localeCompare(b.dues[0]?.due || '9999') || a.c.name.localeCompare(b.c.name, 'vi'));
    el.querySelector('[data-count]').textContent = `${rows.length} khách hàng`;
    const body = el.querySelector('[data-body]');
    if (!rows.length) { body.innerHTML = `<div class="panel">${emptyBox(S.customers.length ? 'Không có khách hàng phù hợp' : 'Chưa có khách hàng', S.customers.length ? '' : 'Khách hàng được tạo tự động khi nhập báo giá hoặc lên lịch lớp.', '')}</div>`; return; }
    body.innerHTML = `<div class="panel tbl-wrap"><table class="tbl"><thead><tr><th>Khách hàng</th><th>Vùng</th><th>Liên hệ</th><th class="r">Lớp</th><th class="r">Thẻ/GCN đã cấp</th><th class="r">Doanh thu HĐ</th><th class="r">Còn nợ</th><th>Lần gần nhất</th><th>Định kỳ tiếp theo</th></tr></thead><tbody>
      ${rows.map(({ c, st, dues }) => {
        const d = dues[0]; const tone = d ? dueTone(d.due) : null;
        return `<tr data-act="customer-view" data-id="${esc(c.id)}"><td><span class="strong">${esc(c.name)}</span>${c.taxCode ? `<div class="muted small">MST ${esc(c.taxCode)}</div>` : ''}</td><td>${c.region ? rtag(c.region) : '<span class="muted">—</span>'}</td>
          <td class="small">${esc(c.contact || '')}${c.phone ? `<div class="num">${esc(c.phone)}</div>` : ''}</td><td class="r">${st.classes}</td><td class="r">${money(st.certified)}</td>${moneyCell(st.revenue)}<td class="r" style="color:${st.remain > 0 ? 'var(--accent)' : 'inherit'}">${money(st.remain)}</td>
          <td class="nowrap num">${esc(fmtD(st.last)) || '—'}</td><td>${d ? `<span class="nowrap num">${esc(fmtD(d.due))}</span> · Nhóm ${d.group}<div>${pill(tone.text, tone.tone)}</div>` : '<span class="muted small">Chưa có lớp hoàn thành</span>'}</td></tr>`;
      }).join('')}</tbody></table></div>`;
  },
};

async function ensureCustomer(name, extra = {}, overwrite = false) {
  name = String(name || '').trim(); if (!name) return null;
  const clean = Object.fromEntries(Object.entries(extra).filter(([, v]) => v !== undefined && v !== null && String(v).trim() !== ''));
  const c = findCustomerByName(name);
  if (c) {
    const upd = { ...c }; let changed = false;
    for (const [k, v] of Object.entries(clean)) if (overwrite ? upd[k] !== v : !upd[k]) { upd[k] = v; changed = true; }
    if (changed) await Store.save('customers', upd);
    return upd;
  }
  return Store.save('customers', { id: uid('cu'), name, ...clean }, name, 'Thêm');
}

function formGuard(getDirty, fileFields) {
  return async () => {
    if (!getDirty()) { fileFields.forEach((x) => x.rollback()); return true; }
    const ok = await confirmBox('Các thay đổi chưa được lưu sẽ bị bỏ. Đóng biểu mẫu?', { ok: 'Bỏ thay đổi', danger: true });
    if (ok) fileFields.forEach((x) => x.rollback());
    return ok;
  };
}

/* ---------- bảng nhập "chi phí khác" (dùng cho lớp và hợp đồng) ---------- */
function costRowsEditor(container, rows, { presets = [], onChange = () => {}, readOnly = !S.role.canEdit } = {}) {
  const list = (rows || []).map((r) => ({ id: r.id || uid('cp'), name: r.name || '', amount: Number(r.amount) || 0, note: r.note || '' }));
  const dis = readOnly ? 'disabled' : '';
  function render() {
    container.innerHTML = `${list.length ? `<div class="costrows">${list.map((r, i) => `<div class="costrow" data-i="${i}">
        <input class="input" data-k="name" value="${esc(r.name)}" placeholder="Tên khoản chi – VD: đi lại, ăn ở, in thẻ…" ${dis} aria-label="Tên khoản chi">
        <input class="input num" data-k="amount" data-money inputmode="numeric" value="${r.amount ? money(r.amount) : ''}" placeholder="Số tiền (đ)" ${dis} aria-label="Số tiền">
        <input class="input" data-k="note" value="${esc(r.note)}" placeholder="Ghi chú (không bắt buộc)" ${dis} aria-label="Ghi chú">
        ${readOnly ? '' : `<button type="button" class="btn icon ghost" data-rm="${i}" aria-label="Xóa khoản chi">${ic('trash')}</button>`}</div>`).join('')}</div>` : '<div class="muted small" style="margin-bottom:6px">Chưa có khoản chi phí khác.</div>'}
      ${readOnly ? '' : `<div class="costadd"><button type="button" class="btn sm" data-add="">${ic('plus')} Thêm chi phí khác</button>${presets.map((p) => `<button type="button" class="chip" data-add="${esc(p)}">＋ ${esc(p)}</button>`).join('')}</div>`}`;
    bindMoney(container);
  }
  container.addEventListener('input', (e) => {
    const row = e.target.closest('.costrow'); const k = e.target.dataset.k; if (!row || !k) return;
    const r = list[Number(row.dataset.i)]; if (k === 'amount') r.amount = parseMoney(e.target.value); else r[k] = e.target.value;
    onChange();
  });
  container.addEventListener('click', (e) => {
    const a = e.target.closest('[data-add]'); const rm = e.target.closest('[data-rm]');
    if (a) { list.push({ id: uid('cp'), name: a.dataset.add, amount: 0, note: '' }); render(); const rowsEl = container.querySelectorAll('.costrow'); rowsEl[rowsEl.length - 1]?.querySelector(a.dataset.add ? '[data-k=amount]' : '[data-k=name]')?.focus(); onChange(); }
    if (rm) { list.splice(Number(rm.dataset.rm), 1); render(); onChange(); }
  });
  render();
  return { value: () => list.filter((r) => r.name.trim() || r.amount).map((r) => ({ id: r.id, name: r.name.trim() || 'Chi phí khác', amount: r.amount, note: r.note.trim() })), total: () => sum(list, (r) => r.amount) };
}
