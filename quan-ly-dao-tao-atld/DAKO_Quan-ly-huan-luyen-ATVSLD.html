const LIBS = {
  pdf: ['https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js', 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'],
  mammoth: ['https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js'],
  xlsx: ['https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'],
};
const scriptCache = {};
function loadScript(src) {
  if (!scriptCache[src]) {
    scriptCache[src] = new Promise((res, rej) => {
      const s = document.createElement('script'); s.src = src; s.async = true;
      s.onload = res; s.onerror = () => { delete scriptCache[src]; rej(new Error('Không tải được thư viện – kiểm tra kết nối mạng.')); };
      document.head.append(s);
    });
  }
  return scriptCache[src];
}
async function lib(name) {
  for (const src of LIBS[name]) await loadScript(src);
  if (name === 'pdf') { const p = window.pdfjsLib; if (p && !p.GlobalWorkerOptions.workerSrc) p.GlobalWorkerOptions.workerSrc = LIBS.pdf[1]; return p; }
  if (name === 'mammoth') return window.mammoth;
  if (name === 'exceljs') return window.ExcelJS;
  return window.XLSX;
}

/* ---------- file viewer ---------- */
function sanitizeHTML(html) {
  const doc = new DOMParser().parseFromString(`<div>${html}</div>`, 'text/html');
  const allowed = new Set(['P', 'BR', 'STRONG', 'B', 'EM', 'I', 'U', 'S', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'UL', 'OL', 'LI', 'TABLE', 'THEAD', 'TBODY', 'TR', 'TD', 'TH', 'A', 'IMG', 'SUP', 'SUB', 'SPAN', 'DIV', 'BLOCKQUOTE']);
  const walk = (node) => {
    for (const el of Array.from(node.children)) {
      if (!allowed.has(el.tagName)) { el.replaceWith(...Array.from(el.childNodes)); continue; }
      for (const a of Array.from(el.attributes)) {
        const n = a.name.toLowerCase();
        const keep = (n === 'href' && /^(https?:|#)/i.test(a.value)) || (n === 'src' && el.tagName === 'IMG' && /^data:image\//i.test(a.value)) || ['colspan', 'rowspan', 'alt'].includes(n);
        if (!keep) el.removeAttribute(a.name);
      }
      if (el.tagName === 'A') { el.setAttribute('target', '_blank'); el.setAttribute('rel', 'noopener'); }
      walk(el);
    }
  };
  walk(doc.body.firstChild);
  return doc.body.firstChild.innerHTML;
}

function openViewer(files, start = 0, title = '') {
  files = (files || []).filter(Boolean);
  if (!files.length) { toast('Chưa có file để xem.'); return; }
  let idx = Math.min(start, files.length - 1); let token = 0;
  const m = openModal({
    title: esc(title || 'Xem file'), size: 'wide',
    body: `${files.length > 1 ? `<div class="vtabs">${files.map((f, i) => `<button type="button" class="chip" data-i="${i}" aria-pressed="${i === idx}">${esc(f.name)}</button>`).join('')}</div>` : ''}
      <div class="toolbar" style="margin:0"><b class="grow" data-name></b><span data-tools style="display:flex;gap:6px;flex-wrap:wrap"></span></div>
      <div class="viewer" data-view></div>`,
  });
  const view = m.el.querySelector('[data-view]');
  m.el.querySelectorAll('.vtabs .chip').forEach((b) => b.addEventListener('click', () => { idx = Number(b.dataset.i); m.el.querySelectorAll('.vtabs .chip').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); show(); }));
  async function show() {
    const my = ++token; const f = files[idx];
    m.el.querySelector('[data-name]').textContent = f.name;
    const direct = Store.backend.directUrl(f);
    const absDirect = direct ? new URL(direct, location.href).href : '';
    m.el.querySelector('[data-tools]').innerHTML = `${absDirect ? `<a class="btn sm" href="${esc(absDirect)}" target="_blank" rel="noopener">${ic('ext')} Mở tab mới</a>` : ''}<button type="button" class="btn sm" data-dl>${ic('down')} Tải về</button>`;
    m.el.querySelector('[data-dl]').onclick = async () => { try { await Store.backend.download(f.name, await Store.backend.getBlob(f)); } catch (e) { toast(e.message, 'bad'); } };
    view.innerHTML = '<div class="msg">Đang mở file…</div>';
    try {
      const kind = fileKind(f);
      if (kind === 'img') {
        const u = await Store.backend.objectUrl(f); if (my !== token) return;
        view.innerHTML = `<img class="full" alt="${esc(f.name)}" src="${esc(u)}">`;
      } else if (kind === 'pdf') {
        const [pdfjs, blob] = await Promise.all([lib('pdf'), Store.backend.getBlob(f)]); if (my !== token) return;
        const pdf = await pdfjs.getDocument({ data: new Uint8Array(await blob.arrayBuffer()), isEvalSupported: false }).promise;
        view.innerHTML = `<div class="msg small" style="padding:8px">${pdf.numPages} trang</div>`;
        const width = Math.min(1000, view.clientWidth - 24);
        const max = Math.min(pdf.numPages, 40);
        for (let p = 1; p <= max; p++) {
          if (my !== token) return;
          const page = await pdf.getPage(p);
          const base = page.getViewport({ scale: 1 });
          const scale = (width / base.width) * (window.devicePixelRatio || 1);
          const vp = page.getViewport({ scale });
          const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height; cv.style.width = width + 'px';
          view.append(cv);
          await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
        }
        if (pdf.numPages > max) view.insertAdjacentHTML('beforeend', `<div class="msg">Đã hiển thị ${max}/${pdf.numPages} trang – bấm “Tải về” để xem đầy đủ.</div>`);
      } else if (kind === 'docx') {
        const [mammoth, blob] = await Promise.all([lib('mammoth'), Store.backend.getBlob(f)]); if (my !== token) return;
        const r = await mammoth.convertToHtml({ arrayBuffer: await blob.arrayBuffer() });
        view.innerHTML = `<div class="doc">${sanitizeHTML(r.value) || '<p>(Tài liệu trống)</p>'}</div>`;
      } else if (kind === 'sheet') {
        const [XLSX, blob] = await Promise.all([lib('xlsx'), Store.backend.getBlob(f)]); if (my !== token) return;
        const wb = XLSX.read(new Uint8Array(await blob.arrayBuffer()), { type: 'array' });
        let html = '';
        for (const name of wb.SheetNames.slice(0, 8)) {
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: false, defval: '' }).slice(0, 400);
          html += `<div style="padding:10px 12px"><div class="sec-title">${esc(name)}</div><div class="tbl-wrap"><table class="sheet">${rows.map((r) => `<tr>${r.slice(0, 40).map((c) => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div></div>`;
        }
        view.innerHTML = html || '<div class="msg">Bảng tính trống.</div>';
      } else {
        view.innerHTML = `<div class="msg"><b>Định dạng .${esc(extOf(f.name) || '?')} chưa xem trực tiếp được.</b><br>Bấm “Tải về” để mở bằng phần mềm trên máy. Nên lưu báo giá/hợp đồng dạng PDF để ai cũng xem được ngay.</div>`;
      }
    } catch (e) {
      if (my === token) view.innerHTML = `<div class="msg"><b>Không mở được file.</b><br>${esc(e.message || '')}<br>Hãy bấm “Tải về” để xem trên máy.</div>`;
    }
  }
  show();
}

/* ---------- bar chart (single series) ---------- */
function barChart(data, { height = 190, fmt = moneyShort } = {}) {
  const W = 640, H = height, padL = 46, padR = 8, padT = 10, padB = 24;
  const max = Math.max(1, ...data.map((d) => d.value));
  const step = niceStep(max / 3);
  const top = Math.ceil(max / step) * step;
  const iw = W - padL - padR, ih = H - padT - padB;
  const bw = iw / data.length;
  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ cột">`;
  for (let v = 0; v <= top + 1e-6; v += step) {
    const y = padT + ih - (v / top) * ih;
    svg += `<line class="grid" x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}"/><text x="${padL - 6}" y="${y + 4}" text-anchor="end">${esc(fmt(v))}</text>`;
  }
  data.forEach((d, i) => {
    const h = (d.value / top) * ih; const x = padL + i * bw; const w = Math.max(4, bw - 6);
    const y = padT + ih - h;
    const r = Math.min(4, h / 2);
    const path = h > 0 ? `M${x + 3},${padT + ih} V${y + r} q0,-${r} ${r},-${r} H${x + 3 + w - r} q${r},0 ${r},${r} V${padT + ih} Z` : '';
    svg += `<g data-tip="${esc(d.tip || d.label + ': ' + fmt(d.value))}"><rect class="hit" x="${x}" y="${padT}" width="${bw}" height="${ih}"/>${path ? `<path class="bar${d.cur ? ' cur' : ''}" d="${path}"/>` : ''}<title>${esc(d.tip || '')}</title></g>`;
    svg += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle"${d.cur ? ' style="font-weight:700;fill:var(--fg)"' : ''}>${esc(d.label)}</text>`;
  });
  return `<div class="chart-box">${svg}</svg></div>`;
}
/** Biểu đồ "cột lồng": cột nhạt = series a (doanh thu), cột đậm hẹp bên trong = series b (lợi nhuận, có thể âm). */
function bulletChart(data, names, { height = 220, fmt = moneyShort } = {}) {
  const W = 640, H = height, padL = 56, padR = 8, padT = 12, padB = 24;
  const maxV = Math.max(1, ...data.map((d) => Math.max(d.a, d.b, 0)));
  const minV = Math.min(0, ...data.map((d) => Math.min(d.a, d.b)));
  if (!data.some((d) => d.a || d.b)) return `<div class="empty"><b>Chưa có hợp đồng đã ký trong năm</b>Doanh thu và lợi nhuận hiện ra khi báo giá được chuyển thành hợp đồng.</div>`;
  const step = Math.max(1000000, niceStep((maxV - minV) / 4 || 1));
  const top = Math.ceil(maxV / step) * step; const bot = Math.floor(minV / step) * step;
  const iw = W - padL - padR, ih = H - padT - padB;
  const y = (v) => padT + ih - ((v - bot) / (top - bot || 1)) * ih;
  const bw = iw / data.length;
  const bar = (x, w, v) => {
    if (!v) return '';
    const y0 = y(0), y1 = y(v); const h = Math.abs(y1 - y0); const r = Math.min(4, h / 2, w / 2);
    if (v > 0) return `M${x},${y0} V${y1 + r} q0,-${r} ${r},-${r} H${x + w - r} q${r},0 ${r},${r} V${y0} Z`;
    return `M${x},${y0} V${y1 - r} q0,${r} ${r},${r} H${x + w - r} q${r},0 ${r},-${r} V${y0} Z`;
  };
  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(names.join(' và '))} theo tháng">`;
  for (let v = bot; v <= top + 1e-6; v += step) svg += `<line class="grid${Math.abs(v) < 1e-6 ? ' zero' : ''}" x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}"/><text x="${padL - 6}" y="${y(v) + 4}" text-anchor="end">${esc(fmt(v))}</text>`;
  data.forEach((d, i) => {
    const x = padL + i * bw; const w = Math.max(6, bw - 10); const wi = Math.max(3, w * 0.42);
    svg += `<g data-tip="${esc(d.tip)}"><rect class="hit" x="${x}" y="${padT}" width="${bw}" height="${ih}"/><path class="bar-a${d.cur ? ' cur' : ''}" d="${bar(x + 5, w, d.a)}"/><path class="bar-b" d="${bar(x + 5 + (w - wi) / 2, wi, d.b)}"/><title>${esc(d.tip)}</title></g>`;
    svg += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle"${d.cur ? ' style="font-weight:700;fill:var(--fg)"' : ''}>${esc(d.label)}</text>`;
  });
  return `<div class="chart-legend"><span><i class="sw a"></i>${esc(names[0])}</span><span><i class="sw b"></i>${esc(names[1])}</span></div><div class="chart-box">${svg}</svg></div>`;
}
function niceStep(raw) {
  if (raw <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}
document.addEventListener('mousemove', (e) => {
  const g = e.target.closest?.('.chart-box g[data-tip]');
  const box = e.target.closest?.('.chart-box');
  $$('.chart-tip').forEach((t) => { if (!box || t.parentNode !== box || !g) t.remove(); });
  if (!g || !box) return;
  let tip = box.querySelector('.chart-tip');
  if (!tip) { tip = document.createElement('div'); tip.className = 'chart-tip'; box.append(tip); }
  tip.textContent = g.dataset.tip;
  const r = box.getBoundingClientRect();
  tip.style.left = Math.min(r.width - 60, Math.max(60, e.clientX - r.left)) + 'px';
  tip.style.top = e.clientY - r.top + 'px';
});

const ST_PAGE = 100;

const studentKeyOfCompany = (v) => (v.customerId ? 'cid:' + v.customerId : 'name:' + norm(v.company));

function studentFilter() {
  const q = norm(S.ui.stSearch || ''); const co = S.ui.stCompany || ''; const g = S.ui.stGroup || ''; const ty = S.ui.stType || ''; const stt = S.ui.stStatus || ''; const yr = S.ui.stYear || '';
  return allStudents().filter((x) => {
    const v = x.v;
    if (co && studentKeyOfCompany(v) !== co) return false;
    if (g && String(v.group) !== g) return false;
    if (ty && v.certType !== ty) return false;
    if (yr && !(v.issueDate || '').startsWith(yr)) return false;
    if (stt && certStatus(v.expiry).key !== stt) return false;
    if (q && !norm([v.name, v.certNo, v.cccd, v.company, x.s.position, x.r.decisionNo].join(' ')).includes(q)) return false;
    return true;
  });
}
function batchesOf(list) {
  const map = new Map();
  for (const r of S.rosters) {
    const id = r.batchId || r.id;
    const b = map.get(id) || { id, parts: [], count: 0 };
    b.parts.push(r); b.count += rosterCount(r); map.set(id, b);
  }
  const out = Array.from(map.values());
  out.forEach((b) => { b.parts.sort((a, c) => (a.part || 1) - (c.part || 1)); b.r = b.parts[0]; });
  return out.sort((a, b) => (b.r.issueDate || b.r.courseTo || '').localeCompare(a.r.issueDate || a.r.courseTo || ''));
}

          <td class="nowrap num">${esc(fmtD(v.issueDate))}</td><td class="nowrap num">${esc(fmtD(v.expiry))}${v.expiryAuto ? '<span class="muted small" title="Tự tính theo hiệu lực của nhóm"> *</span>' : ''}</td><td>${pill(st.label, st.tone)}</td>
          <td class="nowrap small">${card ? `<span class="tag" title="Có hình thẻ/GCN">${ic('idcard', 'ti')} ${card}</span>` : ''}${qd ? ` <span class="tag" title="Có quyết định cấp">QĐ</span>` : ''}${!card && !qd ? '<span class="muted">—</span>' : ''}</td></tr>`; }).join('')}
      </tbody></table></div>
      <div class="pager"><span class="muted small">Hiển thị ${money(from + 1)}–${money(from + rows.length)} / ${money(list.length)} học viên · <span title="Hạn tự tính khi sổ cấp không ghi hạn">* hạn tự tính</span></span>
        <span class="grow"></span><button type="button" class="btn sm" data-act="st-page" data-v="-1"${S.ui.stPage <= 0 ? ' disabled' : ''}>${ic('left')} Trước</button><span class="small">Trang ${S.ui.stPage + 1}/${pages}</span><button type="button" class="btn sm" data-act="st-page" data-v="1"${S.ui.stPage >= pages - 1 ? ' disabled' : ''}>Sau ${ic('right')}</button></div>`;

  batchesHTML(list) {
    const keys = new Set(list.map((x) => x.r.batchId || x.r.id));

    if (!bs.length) return `<div class="panel">${emptyBox('Không có đợt cấp phù hợp bộ lọc')}</div>`;
    return `<div class="panel tbl-wrap"><table class="tbl"><thead><tr><th>Đợt cấp</th><th>Công ty</th><th>Nhóm</th><th>Loại giấy</th><th>Khóa học</th><th>Ngày cấp</th><th>Quyết định</th><th class="r">Học viên</th><th>Hồ sơ</th></tr></thead><tbody>
      ${bs.map((b) => { const r = b.r; const dfiles = b.parts.flatMap((p) => p.decisionFiles || []); const ofiles = b.parts.flatMap((p) => p.files || []);
        return `<tr data-act="roster-view" data-id="${esc(b.id)}"><td><span class="strong">${esc(r.title || 'Đợt cấp')}</span>${b.parts.length > 1 ? `<div class="muted small">${b.parts.length} phần</div>` : ''}</td><td class="small">${esc(r.customerName || '')}</td><td>${esc(groupsShort(r.groups)) || '—'}</td><td class="small">${esc(r.certType || '')}</td>
          <td class="nowrap num small">${esc(fmtDateRange(r.courseFrom, r.courseTo))}</td><td class="nowrap num">${esc(fmtD(r.issueDate))}</td><td class="small">${esc(r.decisionNo || '')}${r.decisionDate ? ` · ${esc(fmtD(r.decisionDate))}` : ''}</td><td class="r strong">${money(b.count)}</td>
          <td><div class="cell-files">${fileButtons(dfiles, 'QĐ')}${ofiles.length ? fileButtons(ofiles, 'Hồ sơ') : ''}</div></td></tr>`; }).join('')}
      </tbody></table></div>`;
  },
};

/* ---------- chi tiết học viên ---------- */
function studentDetail(rid, key) {
  const m = openModal({ title: '', size: 'wide' }); m.refresh = render; render();

    const r = roster(rid); const s = r && (r.students || []).find((x) => x.k === key);
    if (!r || !s) { m.close(); return; }
    const v = studentView(s, r); const st = certStatus(v.expiry);
    const cards = studentFiles(s, ['the']); const photos = studentFiles(s, ['anh']); const others = studentFiles(s, ['qd', 'khac']);
    const cls = r.classId && klass(r.classId); const q = r.quoteId && quote(r.quoteId); const cu = r.customerId && customer(r.customerId);
    const imgs = cards.filter((f) => fileKind(f) === 'img'); const nonImg = cards.filter((f) => fileKind(f) !== 'img');

    m.el.querySelector('.modal-h h2').textContent = v.name || 'Học viên';
    m.body.innerHTML = `<div class="detail-top">${photos[0] ? `<span class="photo lg"><img data-file="${esc(photos[0].id)}" alt="Ảnh ${esc(v.name)}"></span>` : `<span class="photo lg" aria-hidden="true">${esc(initials(v.name))}</span>`}
      <div class="grow" style="min-width:240px;display:flex;flex-direction:column;gap:10px"><div style="display:flex;gap:6px;flex-wrap:wrap">${pill(v.certType || 'Chưa rõ loại giấy', 'info')}${v.certNo ? pill('Số ' + v.certNo, 'muted') : ''}${pill(st.label, st.tone)}${v.group ? pill('Nhóm ' + v.group, 'muted') : ''}</div>
      <dl class="dl">${dd('Ngày sinh', esc(v.dob))}${dd('Giới tính', esc(s.gender))}${dd('Quốc tịch', esc(s.nationality))}${dd('Số CCCD', esc(v.cccd))}${dd('Chức vụ / công việc', esc(s.position))}
        ${dd('Đơn vị', cu ? `<a href="#" data-act="customer-view" data-id="${esc(cu.id)}">${esc(v.company)}</a>` : esc(v.company))}</dl></div></div>
      <div><div class="sec-title">Thẻ / Giấy chứng nhận</div><dl class="dl">${dd('Số thẻ/GCN', esc(v.certNo))}${dd('Ngày cấp', esc(fmtD(v.issueDate)))}${dd('Hiệu lực đến', v.expiry ? esc(fmtD(v.expiry)) + (v.expiryAuto ? ' <span class="muted small">(tự tính)</span>' : '') : '')}
        ${dd('Nhóm huấn luyện', v.group ? `Nhóm ${v.group} – ${esc(GROUPS[v.group]?.desc || '')}` : '')}${dd('Nội dung huấn luyện', esc(v.content))}${dd('Thời gian học', esc(fmtDateRange(v.from, v.to)) + (v.hours ? ` · ${esc(v.hours)} giờ` : ''))}${dd('Kết quả', esc(s.result))}
        ${s.notes ? `<div class="full"><dt>Ghi chú</dt><dd style="white-space:pre-wrap">${esc(s.notes)}</dd></div>` : ''}</dl></div>
      <div><div class="sec-title">Hình thẻ / GCN</div>${imgs.length ? `<div class="gallery">${imgs.map((f) => `<button type="button" class="shot" data-act="file-view" data-fid="${esc(f.id)}" title="${esc(f.name)}"><img data-file="${esc(f.id)}" alt="${esc(f.name)}"></button>`).join('')}</div>` : ''}${nonImg.length ? filesBlock(nonImg) : ''}${!cards.length ? '<div class="muted small">Chưa có hình thẻ/GCN – gửi file cho Claude để đối chiếu và gắn đúng học viên.</div>' : ''}</div>
      <div><div class="sec-title">Quyết định cấp &amp; hồ sơ đợt</div><dl class="dl" style="margin-bottom:8px">${dd('Đợt cấp', `<a href="#" data-act="roster-view" data-id="${esc(r.batchId || r.id)}">${esc(r.title || 'Đợt cấp')}</a>`)}${dd('Số quyết định', esc(r.decisionNo) + (r.decisionDate ? ' · ' + esc(fmtD(r.decisionDate)) : ''))}</dl>
        ${filesBlock([...(r.decisionFiles || []), ...others], 'Chưa có quyết định cấp')}</div>
      <div><div class="sec-title">Khóa học</div>${cls ? `<ul class="list" style="border:1px solid var(--line);border-radius:10px">${classLi(cls)}</ul>` : '<div class="muted small">Chưa gắn với lớp trong lịch giảng dạy.</div>'}
        ${q ? `<div style="margin-top:8px"><button type="button" class="btn sm" data-act="quote-view" data-id="${esc(q.id)}">${ic('sign')} ${esc(isContract(q) ? 'Hợp đồng ' + (q.contractNo || q.no || '') : 'Báo giá ' + (q.no || ''))}</button></div>` : ''}</div>`;
    if (!m.foot) { m.el.insertAdjacentHTML('beforeend', '<div class="modal-f"></div>'); m.foot = m.el.querySelector('.modal-f'); }
    m.foot.innerHTML = `${editorStamp(r)}<span class="sp"></span><span class="edit-only" style="display:flex;gap:8px"><button type="button" class="btn danger" data-x="del">${ic('trash')} Xóa học viên</button><button type="button" class="btn primary" data-x="edit">${ic('edit')} Sửa</button></span>`;
    m.foot.querySelector('[data-x=del]').onclick = async () => { if (await deleteStudent(r, s)) m.close(); };
    m.foot.querySelector('[data-x=edit]').onclick = () => { m.close(); studentForm(r, s); };
    hydrate(m.el); fillNames(m.el);
  }
}

async function saveRoster(doc, label, action) {
  const size = JSON.stringify(doc).length;
  if (size > 240000) { toast('Đợt cấp quá lớn để lưu trong một phần – hãy tạo đợt cấp mới cho các học viên tiếp theo.', 'bad'); throw new Error('too_big'); }
  STUDENT_CACHE.src = null;
  return Store.save('rosters', doc, label, action);
}

function studentForm(r, existing) {
  if (!S.role.canEdit) return;
  const s = existing ? clone(existing) : { k: uid('hv'), nationality: 'Việt Nam', group: (r.groups || [])[0] || '', files: [] };
  const files = s.files || [];
  const m = openModal({
    title: existing ? 'Sửa thông tin học viên' : 'Thêm học viên', sub: esc(`${r.title || 'Đợt cấp'} · ${r.customerName || ''}`), size: 'wide',
    body: `<form id="sf" novalidate autocomplete="off"><fieldset class="sec"><legend>Thông tin cá nhân</legend><div class="fgrid">
        ${f('sf-name', 'Họ và tên', inp('sf-name', s.name, 'required placeholder="VD: NGUYỄN VĂN A"'), { req: true, cls: 'span2' })}
        ${f('sf-gender', 'Giới tính', `<select class="input" id="sf-gender">${opt('', '— Chọn —', !s.gender)}${['Nam', 'Nữ'].map((g) => opt(g, g, s.gender === g)).join('')}</select>`)}
        ${f('sf-dob', 'Ngày sinh', inp('sf-dob', s.dob, 'placeholder="dd/mm/yyyy hoặc năm sinh"'))}
        ${f('sf-nat', 'Quốc tịch', inp('sf-nat', s.nationality, 'placeholder="Việt Nam"'))}
        ${f('sf-cccd', 'Số CCCD', inp('sf-cccd', s.cccd, 'inputmode="numeric" placeholder="12 số CCCD"'))}
        ${f('sf-pos', 'Chức vụ / công việc', inp('sf-pos', s.position, 'placeholder="VD: Thợ hàn, Tổ trưởng…"'), { cls: 'span2' })}
      </div></fieldset>
      <fieldset class="sec"><legend>Thẻ / Giấy chứng nhận</legend><div class="fgrid">
        ${f('sf-group', 'Nhóm', `<select class="input" id="sf-group">${opt('', 'Theo đợt cấp', !s.group)}${Object.keys(GROUPS).map((g) => opt(g, 'Nhóm ' + g, String(s.group) === g)).join('')}</select>`)}
        ${f('sf-type', 'Loại giấy', `<select class="input" id="sf-type">${opt('', 'Theo đợt cấp', !s.certType)}${CERT_TYPES.map((t) => opt(t, t, s.certType === t)).join('')}</select>`)}
        ${f('sf-no', 'Số thẻ/GCN', inp('sf-no', s.certNo, 'placeholder="VD: DAKO-N3-05/2026"'))}
        ${f('sf-issue', 'Ngày cấp', inp('sf-issue', s.issueDate, 'type="date"'), { hint: r.issueDate ? 'Để trống = theo đợt cấp ' + fmtD(r.issueDate) : '' })}
        ${f('sf-exp', 'Hiệu lực đến', inp('sf-exp', s.expiry, 'type="date"'), { hint: 'Để trống = tự tính theo nhóm' })}
        ${f('sf-result', 'Kết quả', inp('sf-result', s.result, 'placeholder="Đạt / điểm"'))}
        ${f('sf-content', 'Nội dung huấn luyện', inp('sf-content', s.content, 'placeholder="VD: Nhóm 3: Hàn, cắt kim loại"'), { cls: 'full' })}
        ${f('sf-notes', 'Ghi chú', `<textarea class="input" id="sf-notes" rows="2" placeholder="Ngày nhận thẻ, người nhận ký, ghi chú khác…">${esc(s.notes || '')}</textarea>`, { cls: 'full' })}
      </div></fieldset>
      <fieldset class="sec"><legend>Hồ sơ học viên</legend><div class="fgrid">
        <div class="f"><span class="lbl">Ảnh 3×4</span><div data-photo></div></div>
        <div class="f span2"><span class="lbl">Hình thẻ / GCN (ảnh hoặc PDF)</span><div data-cards></div></div>
        <div class="f full"><span class="lbl">Hồ sơ khác</span><div data-others></div></div>
      </div></fieldset></form>`,
    foot: `<span class="sp"></span><button type="button" class="btn" data-cancel>Hủy</button><button type="button" class="btn primary" data-save>${ic('check')} Lưu học viên</button>`,
  });
  const root = m.el;
  const ph = mountFileField(root.querySelector('[data-photo]'), files.filter((x) => x.kind === 'anh').slice(0, 1), { image: true });
  const cards = mountFileField(root.querySelector('[data-cards]'), files.filter((x) => x.kind === 'the'), { accept: 'image/*,application/pdf', hint: 'Ảnh chụp/scan mặt trước – mặt sau' });
  const others = mountFileField(root.querySelector('[data-others]'), files.filter((x) => !['anh', 'the'].includes(x.kind)));
  const read = () => ({ name: val(root, 'sf-name'), gender: val(root, 'sf-gender'), dob: val(root, 'sf-dob'), nationality: val(root, 'sf-nat'), cccd: val(root, 'sf-cccd'), position: val(root, 'sf-pos'),
    group: val(root, 'sf-group') ? Number(val(root, 'sf-group')) : '', certType: val(root, 'sf-type'), certNo: val(root, 'sf-no'), issueDate: val(root, 'sf-issue'), expiry: val(root, 'sf-exp'), result: val(root, 'sf-result'), content: val(root, 'sf-content'), notes: val(root, 'sf-notes') });
  const snap = JSON.stringify(read());
  m.guard = formGuard(() => JSON.stringify(read()) !== snap || ph.dirty() || cards.dirty() || others.dirty(), [ph, cards, others]);
  root.querySelector('[data-cancel]').onclick = () => m.tryClose();
  root.querySelector('[data-save]').onclick = async (ev) => {
    const d = read();
    if (!d.name) { toast('Cần nhập họ tên học viên.', 'bad'); return; }
    const dup = d.certNo && allStudents().find((x) => x.s.k !== s.k && norm(x.s.certNo) === norm(d.certNo));
    if (dup) { toast(`Số ${d.certNo} đã cấp cho ${dup.v.name} (${dup.v.company}).`, 'bad'); return; }
    const newFiles = [...(ph.value() ? [{ ...ph.value(), kind: 'anh' }] : []), ...cards.value().map((x) => ({ ...x, kind: 'the' })), ...others.value().map((x) => ({ ...x, kind: x.kind && x.kind !== 'the' && x.kind !== 'anh' ? x.kind : 'khac' }))];
    const stu = { ...s, ...d, files: newFiles };
    let target = roster(r.id) || r;
    const doc = clone(target);
    doc.students = doc.students || [];
    const i = doc.students.findIndex((x) => x.k === s.k);
    if (i >= 0) doc.students[i] = stu; else doc.students.push(stu);
    ev.target.disabled = true;
    try {
      await saveRoster(doc, `${stu.name} – ${doc.title || doc.customerName || 'đợt cấp'}`, existing ? 'Cập nhật' : 'Thêm');
      ph.commit(); cards.commit(); others.commit(); m.guard = null; m.close(); toast(existing ? 'Đã cập nhật học viên.' : 'Đã thêm học viên.', 'ok');
    } catch (e) { ev.target.disabled = false; }
  };
}

async function deleteStudent(r, s) {
  if (!(await confirmBox(`Xóa học viên <b>${esc(s.name)}</b> khỏi đợt cấp “${esc(r.title || '')}” cùng hình thẻ/GCN đã gắn?`, { ok: 'Xóa học viên', danger: true }))) return false;
  const doc = clone(roster(r.id) || r); doc.students = (doc.students || []).filter((x) => x.k !== s.k);
  try { await saveRoster(doc, `${s.name} – ${doc.title || ''}`, 'Xóa'); (s.files || []).forEach((x) => Store.backend.delFile(x)); toast('Đã xóa học viên.', 'ok'); return true; } catch (e) { return false; }
}

/* ---------- đợt cấp ---------- */
function rosterDetail(batchId) {
  const m = openModal({ title: '', size: 'wide' }); m.refresh = render; render();
  function render() {
    const parts = rostersOfBatch(batchId); if (!parts.length) { m.close(); return; }
    const r = parts[0]; const studs = parts.flatMap((p) => (p.students || []).map((s) => ({ s, p })));
    const cls = r.classId && klass(r.classId); const q = r.quoteId && quote(r.quoteId);
    m.el.querySelector('.modal-h h2').textContent = r.title || 'Đợt cấp thẻ/GCN';
    const dd = (label, v) => `<div><dt>${label}</dt><dd>${v || '<span class="muted" title="Chưa nhập – bấm Sửa đợt cấp">Chưa nhập</span>'}</dd></div>`;
    m.body.innerHTML = `<dl class="dl">${dd('Công ty', r.customerId && customer(r.customerId) ? `<a href="#" data-act="customer-view" data-id="${esc(r.customerId)}">${esc(r.customerName)}</a>` : esc(r.customerName))}${dd('Nhóm', esc(groupsText(r.groups)))}${dd('Loại giấy', esc(r.certType))}
        ${dd('Khóa học', esc(fmtDateRange(r.courseFrom, r.courseTo)) + (r.hours ? ` · ${esc(r.hours)} giờ` : ''))}${dd('Ngày cấp', esc(fmtD(r.issueDate)))}${dd('Quyết định', esc(r.decisionNo) + (r.decisionDate ? ' · ' + esc(fmtD(r.decisionDate)) : ''))}
        ${dd('Lớp trong lịch', cls ? `<a href="#" data-act="class-view" data-id="${esc(cls.id)}">${esc(classLabel(cls))} · ${esc(fmtDateRange(cls.startDate, cls.endDate))}</a>` : '')}${dd('Báo giá / hợp đồng', q ? `<a href="#" data-act="quote-view" data-id="${esc(q.id)}">${esc(q.contractNo || q.no || '')}</a>` : '')}
        ${r.notes ? `<div class="full"><dt>Ghi chú</dt><dd style="white-space:pre-wrap">${esc(r.notes)}</dd></div>` : ''}</dl>
      <div><div class="sec-title">Quyết định cấp thẻ/GCN</div>${filesBlock(parts.flatMap((p) => p.decisionFiles || []), 'Chưa có file quyết định')}</div>
      <div><div class="sec-title">Hồ sơ khác của đợt (sổ cấp, danh sách, biên bản…)</div>${filesBlock(parts.flatMap((p) => p.files || []), 'Chưa có file')}</div>
      <div><div class="sec-title">Học viên (${studs.length})<span class="actions edit-only"><button type="button" class="btn xs" data-x="add">${ic('plus')} Thêm học viên</button></span></div>
        ${studs.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="r">#</th><th>Họ và tên</th><th>Ngày sinh</th><th>CCCD</th><th>Chức vụ</th><th>Số thẻ/GCN</th><th>Hiệu lực đến</th><th>Hình</th></tr></thead><tbody>${studs.map(({ s, p }, i) => { const v = studentView(s, p); return `<tr data-act="student-view" data-id="${esc(p.id)}" data-key="${esc(s.k)}"><td class="r muted">${i + 1}</td><td class="strong">${esc(v.name)}</td><td class="small">${esc(v.dob)}</td><td class="num small">${esc(v.cccd)}</td><td class="small">${esc(s.position || '')}</td><td class="nowrap num">${esc(v.certNo)}</td><td class="nowrap num">${esc(fmtD(v.expiry))}</td><td>${studentFiles(s, ['the']).length ? ic('idcard', 'ti') : ''}</td></tr>`; }).join('')}</tbody></table></div>` : '<div class="muted small">Chưa có học viên.</div>'}</div>`;
    if (!m.foot) { m.el.insertAdjacentHTML('beforeend', '<div class="modal-f"></div>'); m.foot = m.el.querySelector('.modal-f'); }
    m.foot.innerHTML = `${editorStamp(r)}<span class="sp"></span><span class="edit-only" style="display:flex;gap:8px"><button type="button" class="btn danger" data-x="del">${ic('trash')} Xóa đợt cấp</button><button type="button" class="btn primary" data-x="edit">${ic('edit')} Sửa đợt cấp</button></span>`;
    const on = (sel, fn) => m.el.querySelector(sel)?.addEventListener('click', fn);
    on('[data-x=edit]', () => { m.close(); rosterForm(batchId); });
    on('[data-x=del]', async () => { if (await deleteBatch(batchId)) m.close(); });
    on('[data-x=add]', async () => {
      let last = parts[parts.length - 1];
      if (rosterCount(last) >= ROSTER_PART_MAX) {
        const nx = { ...clone(last), id: uid('ro'), part: (last.part || 1) + 1, batchId, students: [], decisionFiles: [], files: [] };
        delete nx.createdAt; delete nx.updatedAt;
        try { last = await saveRoster(nx, `${r.title || 'Đợt cấp'} – phần ${nx.part}`, 'Thêm'); } catch (e) { return; }
      }
      m.close(); studentForm(last, null);
    });
    hydrate(m.el); fillNames(m.el);
  }
}

function rosterForm(batchId, preset = {}) {

  const parts = batchId ? rostersOfBatch(batchId) : [];
  const r = parts[0] ? clone(parts[0]) : { groups: [], certType: '', students: [], decisionFiles: [], files: [], ...preset };
  const m = openModal({
    title: batchId ? 'Sửa đợt cấp thẻ/GCN' : 'Thêm đợt cấp thẻ/GCN', sub: 'Thông tin chung của đợt áp dụng cho học viên chưa ghi riêng', size: 'wide',

        ${f('rf-title', 'Tên đợt cấp', inp('rf-title', r.title, 'placeholder="VD: Thẻ an toàn nhóm 3 – Cty ABC – 11/2026"'), { cls: 'span2', req: true })}
        ${f('rf-customer', 'Công ty', inp('rf-customer', r.customerName, 'list="rf-customers" placeholder="Gõ để chọn công ty đã có"') + custList('rf-customers'), { cls: 'span2' })}
        <div class="f full"><span class="lbl">Nhóm huấn luyện</span>${groupChecks('rf-group', r.groups)}</div>
        ${f('rf-type', 'Loại giấy', `<select class="input" id="rf-type">${opt('', '— Theo nhóm —', !r.certType)}${CERT_TYPES.map((t) => opt(t, t, r.certType === t)).join('')}</select>`)}
        ${f('rf-from', 'Khóa học từ ngày', inp('rf-from', r.courseFrom, 'type="date"'))}
        ${f('rf-to', 'Đến ngày', inp('rf-to', r.courseTo, 'type="date"'))}
        ${f('rf-hours', 'Số giờ', inp('rf-hours', r.hours, 'type="number" min="1" placeholder="VD: 24"'))}
        ${f('rf-issue', 'Ngày cấp', inp('rf-issue', r.issueDate, 'type="date"'))}
        ${f('rf-dno', 'Số quyết định cấp', inp('rf-dno', r.decisionNo, 'placeholder="VD: 15/QĐ-DAKO"'))}
        ${f('rf-ddate', 'Ngày quyết định', inp('rf-ddate', r.decisionDate, 'type="date"'))}
        ${f('rf-class', 'Lớp trong lịch giảng dạy', '<select class="input" id="rf-class"></select>', { cls: 'span2' })}
        ${f('rf-quote', 'Báo giá / hợp đồng', '<select class="input" id="rf-quote"></select>', { cls: 'span2' })}
        ${f('rf-notes', 'Ghi chú', `<textarea class="input" id="rf-notes" rows="2" placeholder="Nơi cấp, người lập sổ, ghi chú khác…">${esc(r.notes || '')}</textarea>`, { cls: 'full' })}
        <div class="f full"><span class="lbl">Quyết định cấp thẻ/GCN</span><div data-dfiles></div></div>
        <div class="f full"><span class="lbl">Hồ sơ khác (sổ cấp Excel, danh sách ký nhận, biên bản…)</span><div data-ofiles></div></div>
      </div></fieldset></form>`,
    foot: `<span class="sp"></span><button type="button" class="btn" data-cancel>Hủy</button><button type="button" class="btn primary" data-save>${ic('check')} Lưu đợt cấp</button>`,
  });
  const root = m.el;
  const df = mountFileField(root.querySelector('[data-dfiles]'), parts.flatMap((p) => p.decisionFiles || []));
  const of = mountFileField(root.querySelector('[data-ofiles]'), parts.flatMap((p) => p.files || []));
  function fillSelects() {
    const cu = findCustomerByName(val(root, 'rf-customer'));
    const cs = S.classes.filter((c) => (cu && c.customerId === cu.id) || c.id === r.classId).sort(sortClasses).reverse();
    root.querySelector('#rf-class').innerHTML = opt('', cs.length ? '— Chưa gắn lớp —' : '— Công ty chưa có lớp —', !r.classId) + cs.map((c) => opt(c.id, `${fmtDateRange(c.startDate, c.endDate)} · ${groupsText(c.groups)} · ${c.students || 0} HV`, c.id === r.classId)).join('');
    const qs = S.quotes.filter((q) => (cu && q.customerId === cu.id) || q.id === r.quoteId);
    root.querySelector('#rf-quote').innerHTML = opt('', qs.length ? '— Chưa gắn —' : '— Công ty chưa có báo giá —', !r.quoteId) + qs.map((q) => opt(q.id, `${q.contractNo ? 'HĐ ' + q.contractNo : 'BG ' + (q.no || '')} · ${fmtD(q.contractDate || q.date)}`, q.id === r.quoteId)).join('');
  }
  fillSelects();
  root.querySelector('#rf-customer').addEventListener('change', fillSelects);
  const read = () => ({ title: val(root, 'rf-title'), customerName: val(root, 'rf-customer'), groups: checkedVals(root, 'rf-group').map(Number), certType: val(root, 'rf-type'), courseFrom: val(root, 'rf-from'), courseTo: val(root, 'rf-to'), hours: val(root, 'rf-hours'),
    issueDate: val(root, 'rf-issue'), decisionNo: val(root, 'rf-dno'), decisionDate: val(root, 'rf-ddate'), classId: val(root, 'rf-class') || null, quoteId: val(root, 'rf-quote') || null, notes: val(root, 'rf-notes') });
  const snap = JSON.stringify(read());
  m.guard = formGuard(() => JSON.stringify(read()) !== snap || df.dirty() || of.dirty(), [df, of]);
  root.querySelector('[data-cancel]').onclick = () => m.tryClose();
  root.querySelector('[data-save]').onclick = async (ev) => {
    const d = read();
    if (!d.title) { toast('Cần nhập tên đợt cấp.', 'bad'); return; }
    ev.target.disabled = true;
    try {
      const cu = d.customerName ? await ensureCustomer(d.customerName) : null;
      const base = { ...d, customerId: cu?.id || null, customerName: cu?.name || d.customerName };
      if (!parts.length) {
        const id = uid('ro');
        await saveRoster({ ...r, ...base, id, batchId: id, part: 1, students: [], decisionFiles: df.value(), files: of.value() }, base.title, 'Thêm');
      } else {
        for (let i = 0; i < parts.length; i++) {
          const p = roster(parts[i].id) || parts[i];
          await saveRoster({ ...p, ...base, batchId: p.batchId || batchId, decisionFiles: i === 0 ? df.value() : [], files: i === 0 ? of.value() : [] }, i === 0 ? base.title : '', 'Cập nhật');
        }
      }
      df.commit(); of.commit(); m.guard = null; m.close(); toast('Đã lưu đợt cấp.', 'ok');
    } catch (e) { ev.target.disabled = false; }
  };
}

async function deleteBatch(batchId) {
  const parts = rostersOfBatch(batchId); const n = sum(parts, rosterCount);
  if (!(await confirmBox(`Xóa đợt cấp <b>${esc(parts[0]?.title || '')}</b> cùng <b>${n}</b> học viên, quyết định và hình thẻ/GCN đã gắn? Không hoàn tác được.`, { ok: 'Xóa đợt cấp', danger: true }))) return false;
  try {
    for (const p of parts) {
      await Store.remove('rosters', p, `${p.title || 'Đợt cấp'}${parts.length > 1 ? ' – phần ' + (p.part || 1) : ''}`);
      [...(p.decisionFiles || []), ...(p.files || []), ...(p.students || []).flatMap((s) => s.files || [])].forEach((x) => Store.backend.delFile(x));
    }
    STUDENT_CACHE.src = null; toast('Đã xóa đợt cấp.', 'ok'); return true;
  } catch (e) { return false; }
}

/** Kỳ đang xem dùng chung cho Tổng quan và Doanh thu – Lợi nhuận. */
function viewPeriod(kind, ym) {
  if (kind === 'all') return { from: '0000-01-01', to: '9999-12-31', label: 'Tất cả thời gian' };
  const p = periodOf(ym + '-01', kind);
  return { from: p.start, to: p.end, label: p.label };
}
const periodSeg = (cur, act, opts = ['month', 'quarter', 'year']) => opts.map((k) => `<button type="button" data-act="${act}" data-v="${k}" aria-pressed="${cur === k}">${{ month: 'Tháng', quarter: 'Quý', year: 'Năm', all: 'Tất cả' }[k]}</button>`).join('');
const stepOf = (kind) => ({ month: 1, quarter: 3, year: 12 }[kind] || 0);

    </div></section>`;

/** Biểu đồ doanh thu (cột nhạt) và lợi nhuận (cột đậm bên trong) theo tháng, tính từ hợp đồng đã ký. */
function revenueChart(year, curYm) {
  const data = Array.from({ length: 12 }, (_, i) => {
    const ym = `${year}-${pad(i + 1)}`;
    const qs = S.quotes.filter((q) => isContract(q) && (q.contractDate || '').startsWith(ym));
    const pn = qs.map(contractPnl);
    const rev = sum(pn, (p) => p.rev); const prof = sum(pn, (p) => p.profit);
    return { label: 'T' + (i + 1), a: rev, b: prof, cur: ym === curYm, tip: `${fmtYM(ym)}: doanh thu ${moneyD(rev)} · lợi nhuận ${moneyD(prof)}${rev ? ` (${pct(prof / rev)})` : ''} · ${qs.length} HĐ` };
  });
  return bulletChart(data, ['Doanh thu (HĐ đã ký)', 'Lợi nhuận']);
}

function classLi(c) {
  const conflict = conflictsFor(c).length;
  return `<li class="clickable" data-act="class-view" data-id="${esc(c.id)}"><span class="when"><b>${c.startDate.slice(8, 10)}</b><span>${dowOf(c.startDate)} · T${Number(c.startDate.slice(5, 7))}</span></span>
    <div class="grow"><div class="t">${esc(classLabel(c))}${conflict ? ' ' + pill('Trùng lịch GV', 'bad') : ''}</div>
    <div class="s">${esc([fmtDateRange(c.startDate, c.endDate), c.startTime && `${c.startTime}–${c.endTime || ''}`, groupsText(c.groups), c.students ? c.students + ' HV' : ''].filter(Boolean).join(' · '))}</div>
    <div class="s">${rtag(c.region)} · ${esc(c.location || 'Chưa có địa điểm')}</div>
    <div class="s">${(c.trainerIds || []).length ? 'GV: ' + esc(trainerNames(c.trainerIds)) : '<span style="color:var(--warn);font-weight:600">Chưa phân công giảng viên</span>'}</div></div>
    <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">${classPill(c)}${docButtons(c)}</div></li>`;
}
function docButtons(c) {
  const q = c.quoteId && quote(c.quoteId);
  if (!q) return '';
  return `<span style="display:flex;gap:4px">${(q.quoteFiles || []).length ? fileButtons(q.quoteFiles, 'BG') : ''}${(q.contractFiles || []).length ? fileButtons(q.contractFiles, 'HĐ') : ''}</span>`;
}

          <div>${phoneLink(x.phone)}</div>

          <div class="tags">${specsT.slice(0, 3).map((s) => `<span class="tag">${esc(s)}</span>`).join('')}${specsT.length > 3 ? `<span class="tag">+${specsT.length - 3}</span>` : ''}</div>
          <div class="small muted">${(x.groups || []).length ? 'Dạy ' + esc(groupsText(x.groups)) : 'Chưa chọn nhóm được dạy'}${x.employment ? ' · ' + esc(x.employment) : ''}</div>
          ${x.status === 'paused' ? pill('Tạm ngưng', 'muted') : cert && cert.tone !== 'ok' ? pill('Chứng chỉ: ' + cert.text, cert.tone) : ''}
        </div></div>
        <div class="tcard-bot">${today.length ? pill('Hôm nay: đang dạy', 'accent') : pill('Hôm nay: rảnh', 'ok')}<span>Tháng ${Number(ym.slice(5))}: <b>${load.days}</b> ngày dạy</span>
          ${L.amount ? `<span class="next">Thù lao ${esc(moneyShort(L.amount))} · đã trả ${esc(moneyShort(L.paid))} · ${L.remain > 0 ? `<b style="color:var(--accent)">còn nợ ${esc(moneyD(L.remain))}</b>` : '<b style="color:var(--ok)">đã thanh toán đủ</b>'}</span>` : ''}
          ${nx ? `<span class="next">Lớp tới: ${esc(fmtDM(nx.startDate))} · ${esc(classLabel(nx))}</span>` : ''}</div>
      </article>`;
    }).join('')}</div>`;
    hydrate(body);
  },
  ledgerRange() {
    const v = S.ui.ledPeriod;
    if (v === 'all') return { from: '', to: '', label: 'Tất cả thời gian' };
    if (v.startsWith('y:')) { const y = v.slice(2); return { from: `${y}-01-01`, to: `${y}-12-31`, label: `Năm ${y}` }; }
    const ym = v.slice(2); return { from: ym + '-01', to: monthEnd(ym), label: fmtYM(ym) };
  },
  ledger() {
    const el = this.el; const tools = el.querySelector('[data-tools]');
    const y = todayISO().slice(0, 4); const ym0 = todayISO().slice(0, 7);
    const opts = [['all', 'Tất cả thời gian'], [`y:${y}`, `Năm ${y}`], [`y:${Number(y) - 1}`, `Năm ${Number(y) - 1}`], ...Array.from({ length: 12 }, (_, i) => { const m = ymAdd(ym0, -i); return [`m:${m}`, fmtYM(m)]; })];
    if (tools.dataset.mode !== 'ledger') {
      tools.dataset.mode = 'ledger';
      tools.innerHTML = `<div class="search">${ic('search')}<input class="input" type="search" id="led-search" placeholder="Tìm giảng viên, khách hàng…" value="${esc(S.ui.ledSearch || '')}" data-input="led-search"></div>
        <select class="input" id="led-period" style="width:auto" data-input="led-period" aria-label="Kỳ theo ngày lớp">${opts.map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join('')}</select>
        <div class="chips" data-ledstate></div>`;
    }
    el.querySelector('#led-period').value = S.ui.ledPeriod;
    el.querySelector('[data-ledstate]').innerHTML = [['owe', 'Còn nợ'], ['all', 'Tất cả'], ['paid', 'Đã thanh toán đủ']].map(([v, l]) => `<button type="button" class="chip" data-act="led-state" data-v="${v}" aria-pressed="${S.ui.ledState === v}">${l}</button>`).join('');
    const R = this.ledgerRange(); const s = norm(S.ui.ledSearch || '');
    const groups = S.trainers
      .filter((x) => S.ui.trRegion === 'all' || x.region === S.ui.trRegion || (x.otherRegions || []).includes(S.ui.trRegion))
      .map((x) => {
        const L = trainerLedger(x.id, R.from, R.to);
        let rows = L.rows.filter((r) => !s || norm([x.name, x.phone, classLabel(r.c), r.f.contractNo].join(' ')).includes(s));
        if (S.ui.ledState === 'owe') rows = rows.filter((r) => r.remain !== 0 || r.label === 'Chưa nhập thù lao');
        if (S.ui.ledState === 'paid') rows = rows.filter((r) => r.label === 'Đã thanh toán đủ');
        return { x, rows, amount: sum(rows, (r) => r.amount), paid: sum(rows, (r) => r.paid), remain: sum(rows, (r) => Math.max(0, r.remain)) };
      }).filter((g) => g.rows.length).sort((a, b) => b.remain - a.remain || a.x.name.localeCompare(b.x.name, 'vi'));
    const all = S.trainers.map((x) => trainerLedger(x.id, R.from, R.to));
    const body = el.querySelector('[data-body]');
    let html = `<div class="kpis">${kpi('Tổng thù lao (HĐ thuê GV)', moneyShort(sum(all, (L) => L.amount)), `${R.label} · ${sum(all, (L) => L.rows.length)} lượt dạy`)}${kpi('Đã trả (tạm ứng + thanh toán)', moneyShort(sum(all, (L) => L.paid)), moneyD(sum(all, (L) => L.paid)))}${kpi('Còn phải trả', moneyShort(sum(all, (L) => L.remain)), `${all.filter((L) => L.remain > 0).length} giảng viên còn nợ`, sum(all, (L) => L.remain) > 0)}</div>`;
    if (!groups.length) { body.innerHTML = html + `<div class="panel">${emptyBox(S.classes.length ? 'Không có khoản thù lao phù hợp bộ lọc' : 'Chưa có lớp nào', 'Thù lao từng lớp nhập khi phân công giảng viên trong tab Lịch giảng dạy.')}</div>`; return; }
    html += `<div class="panel tbl-wrap"><table class="tbl"><thead><tr><th>Ngày lớp</th><th>Khách hàng / lớp</th><th class="r">Số ngày</th><th>HĐ thuê GV</th><th class="r">Thù lao</th><th class="r">Đã trả</th><th class="r">Còn lại</th><th>Tình trạng</th><th></th></tr></thead>`;
    for (const g of groups) {
      html += `<tbody><tr class="grp" data-act="trainer-view" data-id="${esc(g.x.id)}"><td colspan="4">${avatar(g.x, 'sm')} <b>${esc(g.x.name)}</b> <span class="muted small">${esc(g.x.phone || '')} · ${esc(regionName(g.x.region))} · ${g.rows.length} lớp</span></td>${moneyCell(g.amount, 'strong')}${moneyCell(g.paid, 'strong')}<td class="r strong" style="color:${g.remain > 0 ? 'var(--accent)' : 'var(--ok)'}">${money(g.remain)}</td><td colspan="2"></td></tr>`;
      for (const r of g.rows) {
        html += `<tr data-act="fee-open" data-id="${esc(r.c.id)}" data-trainer="${esc(g.x.id)}"><td class="nowrap num">${esc(fmtDateRange(r.c.startDate, r.c.endDate))}</td><td>${esc(classLabel(r.c))}<div class="muted small">${esc(groupsText(r.c.groups))}${r.c.students ? ' · ' + r.c.students + ' HV' : ''}${r.c.status === 'cancelled' ? ' · đã hủy' : ''}</div></td><td class="r">${r.days}</td>
          <td class="small">${esc(r.f.contractNo || '')}${(r.f.files || []).length ? ' ' + fileButtons(r.f.files, 'HĐ') : r.f.contractNo ? '' : '<span class="muted">—</span>'}</td>
          ${moneyCell(r.amount)}${moneyCell(r.paid)}<td class="r strong" style="color:${r.remain > 0 ? 'var(--accent)' : r.remain < 0 ? 'var(--bad)' : 'var(--ok)'}">${money(r.remain)}</td><td>${pill(r.label, r.tone)}</td>
          <td class="r"><button type="button" class="btn xs edit-only" data-act="fee-pay" data-id="${esc(r.c.id)}" data-trainer="${esc(g.x.id)}">${ic('money')} Trả tiền</button></td></tr>`;
      }
      html += '</tbody>';
    }
    html += `<tfoot><tr><td colspan="4">Tổng ${groups.length} giảng viên</td>${moneyCell(sum(groups, (g) => g.amount))}${moneyCell(sum(groups, (g) => g.paid))}${moneyCell(sum(groups, (g) => g.remain))}<td colspan="2"></td></tr></tfoot></table></div>
      <p class="small muted" style="margin-top:8px">Bấm một dòng để sửa thù lao, số HĐ thuê giảng viên, tải file hợp đồng và ghi nhận tạm ứng/thanh toán.</p>`;
    body.innerHTML = html; hydrate(body);
  },
};

    const qs = S.quotes.filter((q) => isContract(q) && (kind === 'all' || ((q.contractDate || '') >= P.from && (q.contractDate || '') <= P.to)))
      .sort((a, b) => (b.contractDate || '').localeCompare(a.contractDate || ''));
    const rows = qs.map((q) => ({ q, p: contractPnl(q) }));
    const T = (f) => sum(rows, (r) => f(r.p));
    const rev = T((p) => p.rev); const prof = T((p) => p.profit);
    let html = `<div class="kpis">${kpi('Doanh thu', moneyShort(rev), `${rows.length} hợp đồng đã ký · ${moneyD(rev)}`)}
      ${kpi('Thù lao giảng viên', moneyShort(T((p) => p.gv)), rows.some((r) => r.p.gvEstimated) ? 'có số ước tính' : moneyD(T((p) => p.gv)))}
      ${kpi('Hoa hồng', moneyShort(T((p) => p.com.gross)), `Thực trả ${moneyShort(T((p) => p.com.net))} · thuế ${moneyShort(T((p) => p.com.tax))}`)}
      ${kpi('Chi phí khác', moneyShort(T((p) => p.other)), moneyD(T((p) => p.other)))}
      ${kpi('Lợi nhuận', moneyShort(prof), rev ? `Tỷ suất ${pct(prof / rev)}` : '—', false, prof < 0 ? 'neg' : 'pos')}
      ${kpi('Đã thu / còn phải thu', moneyShort(T((p) => p.paid)), `Còn phải thu ${moneyD(T((p) => p.remain))}`, T((p) => p.remain) > 0)}</div>`;
    const year = kind === 'all' ? todayISO().slice(0, 4) : P.from.slice(0, 4);
    html += `<section class="panel" style="margin-bottom:16px"><div class="panel-h"><h2>Doanh thu &amp; lợi nhuận theo tháng – năm ${year}</h2></div><div class="panel-b">${revenueChart(year, kind === 'month' ? S.ui.pfMonth : null)}</div></section>`;
    if (!rows.length) {
      html += `<div class="panel">${emptyBox('Chưa có hợp đồng đã ký trong kỳ', 'Doanh thu chỉ tính khi báo giá được chuyển thành hợp đồng (điền số hợp đồng, ngày ký ở tab Báo giá).', '<a class="btn sm" href="#bao-gia">Đến tab Báo giá</a>')}</div>`;
    } else {
      html += `<div class="panel tbl-wrap"><table class="tbl wide"><thead><tr><th>Số HĐ</th><th>Ngày ký</th><th style="min-width:200px">Khách hàng</th><th class="r">Doanh thu</th><th class="r">Thù lao GV</th><th class="r" title="Tổng hoa hồng đại lý (gồm thuế)">HH đại lý</th><th class="r" title="Tổng hoa hồng cán bộ quản lý phía khách hàng (gồm thuế)">HH cán bộ KH</th><th class="r">Trong đó thuế HH</th><th class="r">Chi phí khác</th><th class="r">Lợi nhuận</th><th class="r">Tỷ suất</th></tr></thead><tbody>
        ${rows.map(({ q, p }) => `<tr data-act="pnl-view" data-id="${esc(q.id)}"><td class="nowrap strong">${esc(q.contractNo || q.no || '')}</td><td class="nowrap num">${esc(fmtD(q.contractDate))}</td><td><span class="strong">${esc(q.customerName)}</span><div class="muted small">${p.classes.length} lớp</div>${p.notes.length ? `<div class="small" style="color:var(--warn)">${esc(p.notes.join('; '))}</div>` : ''}</td>
          ${moneyCell(p.rev)}<td class="r">${money(p.gv)}${p.gvEstimated ? '<div class="muted small">ước tính</div>' : ''}</td>${moneyCell(p.com.agent + p.com.other)}${moneyCell(p.com.manager)}${moneyCell(p.com.tax)}${moneyCell(p.other)}
          <td class="r strong" style="color:${p.profit < 0 ? 'var(--bad)' : 'var(--ok)'}">${money(p.profit)}</td><td class="r">${p.rev ? pct(p.margin) : '—'}</td></tr>`).join('')}
        </tbody><tfoot><tr><td colspan="3">Tổng ${rows.length} hợp đồng</td>${moneyCell(rev)}${moneyCell(T((p) => p.gv))}${moneyCell(T((p) => p.com.agent + p.com.other))}${moneyCell(T((p) => p.com.manager))}${moneyCell(T((p) => p.com.tax))}${moneyCell(T((p) => p.other))}${moneyCell(prof)}<td class="r">${rev ? pct(prof / rev) : ''}</td></tr></tfoot></table></div>
        <p class="small muted" style="margin-top:8px">Bấm một hợp đồng để nhập hoa hồng đại lý, hoa hồng cán bộ quản lý khách hàng (thuế khấu trừ ${esc(String(settings().commissionTax ?? 20))}%, sửa được) và các chi phí khác.</p>`;
    }
    const noContract = S.classes.filter((c) => c.status !== 'cancelled' && !contractOfClass(c) && (kind === 'all' || (c.startDate >= P.from && c.startDate <= P.to)));
    if (noContract.length) {
      html += `<section class="panel" style="margin-top:16px"><div class="panel-h"><h2>Lớp chưa có hợp đồng đã ký</h2>${pill(`${noContract.length} lớp · ${moneyShort(sum(noContract, (c) => Number(c.price) || 0))} chưa tính doanh thu`, 'warn')}</div><div class="panel-b flush"><ul class="list">${noContract.sort(sortClasses).slice(0, 12).map(classLi).join('')}</ul></div></section>`;
    }
    el.querySelector('[data-body]').innerHTML = html;
    hydrate(el);
  },
};

const opt = (v, label, sel) => `<option value="${esc(v)}"${sel ? ' selected' : ''}>${esc(label)}</option>`;
const val = (root, id) => (root.querySelector('#' + id)?.value ?? '').trim();
const checkedVals = (root, name) => $$(`input[name="${name}"]:checked`, root).map((i) => i.value);
const groupChecks = (name, sel) => `<div class="checks">${Object.entries(GROUPS).map(([g, v]) => `<label title="${esc(v.desc)}"><input type="checkbox" name="${name}" value="${g}"${(sel || []).map(Number).includes(Number(g)) ? ' checked' : ''}> Nhóm ${g}</label>`).join('')}</div>`;

const f = (id, label, input, { cls = '', hint = '', req = false } = {}) => `<div class="f ${cls}"><label for="${id}">${label}${req ? ' <span class="req">*</span>' : ''}</label>${input}${hint ? `<span class="hint" data-hint="${id}">${hint}</span>` : ''}</div>`;
const inp = (id, value, attrs = '') => `<input class="input" id="${id}" value="${esc(value ?? '')}" ${attrs}>`;

const editorStamp = (r) => (r?.updatedAt ? `<span class="muted small">Cập nhật ${esc(fmtStamp(r.updatedAt))}${r.updatedBy ? `<span data-uid="${esc(r.updatedBy)}"></span>` : ''}${r.via === 'claude' ? ' · nhập qua Claude' : ''}</span>` : '');
const notSet = (hint = 'Chưa nhập – bấm Sửa để bổ sung') => `<span class="muted" title="${esc(hint)}">Chưa nhập</span>`;
const mbox = (k, v, cls = '', sub = '') => `<div class="m ${cls}"><div class="k">${k}</div><div class="v">${v}</div>${sub ? `<div class="k">${sub}</div>` : ''}</div>`;

async function ensureCustomer(name, extra = {}, overwrite = false) {
  name = String(name || '').trim(); if (!name) return null;
  const clean = Object.fromEntries(Object.entries(extra).filter(([, v]) => v !== undefined && v !== null && String(v).trim() !== ''));
  const c = findCustomerByName(name);
  if (c) {
    const upd = { ...c }; let changed = false;
    for (const [k, v] of Object.entries(clean)) if (overwrite ? upd[k] !== v : !upd[k]) { upd[k] = v; changed = true; }
    if (changed) await Store.save('customers', upd);
    return upd;
  }
  return Store.save('customers', { id: uid('cu'), name, ...clean }, name, 'Thêm');
}

function formGuard(getDirty, fileFields) {
  return async () => {
    if (!getDirty()) { fileFields.forEach((x) => x.rollback()); return true; }
    const ok = await confirmBox('Các thay đổi chưa được lưu sẽ bị bỏ. Đóng biểu mẫu?', { ok: 'Bỏ thay đổi', danger: true });
    if (ok) fileFields.forEach((x) => x.rollback());
    return ok;
  };
}

/* ---------- bảng nhập "chi phí khác" (dùng cho lớp và hợp đồng) ---------- */
function costRowsEditor(container, rows, { presets = [], onChange = () => {}, readOnly = !S.role.canEdit } = {}) {
  const list = (rows || []).map((r) => ({ id: r.id || uid('cp'), name: r.name || '', amount: Number(r.amount) || 0, note: r.note || '' }));
  const dis = readOnly ? 'disabled' : '';
  function render() {
    container.innerHTML = `${list.length ? `<div class="costrows">${list.map((r, i) => `<div class="costrow" data-i="${i}">
        <input class="input" data-k="name" value="${esc(r.name)}" placeholder="Tên khoản chi – VD: đi lại, ăn ở, in thẻ…" ${dis} aria-label="Tên khoản chi">
        <input class="input num" data-k="amount" data-money inputmode="numeric" value="${r.amount ? money(r.amount) : ''}" placeholder="Số tiền (đ)" ${dis} aria-label="Số tiền">
        <input class="input" data-k="note" value="${esc(r.note)}" placeholder="Ghi chú (không bắt buộc)" ${dis} aria-label="Ghi chú">
        ${readOnly ? '' : `<button type="button" class="btn icon ghost" data-rm="${i}" aria-label="Xóa khoản chi">${ic('trash')}</button>`}</div>`).join('')}</div>` : '<div class="muted small" style="margin-bottom:6px">Chưa có khoản chi phí khác.</div>'}
      ${readOnly ? '' : `<div class="costadd"><button type="button" class="btn sm" data-add="">${ic('plus')} Thêm chi phí khác</button>${presets.map((p) => `<button type="button" class="chip" data-add="${esc(p)}">＋ ${esc(p)}</button>`).join('')}</div>`}`;
    bindMoney(container);
  }
  container.addEventListener('input', (e) => {
    const row = e.target.closest('.costrow'); const k = e.target.dataset.k; if (!row || !k) return;
    const r = list[Number(row.dataset.i)]; if (k === 'amount') r.amount = parseMoney(e.target.value); else r[k] = e.target.value;
    onChange();
  });
  container.addEventListener('click', (e) => {
    const a = e.target.closest('[data-add]'); const rm = e.target.closest('[data-rm]');
    if (a) { list.push({ id: uid('cp'), name: a.dataset.add, amount: 0, note: '' }); render(); const rowsEl = container.querySelectorAll('.costrow'); rowsEl[rowsEl.length - 1]?.querySelector(a.dataset.add ? '[data-k=amount]' : '[data-k=name]')?.focus(); onChange(); }
    if (rm) { list.splice(Number(rm.dataset.rm), 1); render(); onChange(); }
  });
  render();
  return { value: () => list.filter((r) => r.name.trim() || r.amount).map((r) => ({ id: r.id, name: r.name.trim() || 'Chi phí khác', amount: r.amount, note: r.note.trim() })), total: () => sum(list, (r) => r.amount) };
}

    root.querySelector('[data-picker]').innerHTML = list.length ? list.map((x) => {
      const busy = d.startDate ? busyClasses(x.id, range, existing?.id) : [];
      const specs = (x.specialties || []).slice(0, 3).join(', ');
      const okGroup = !d.groups.length || !(x.groups || []).length || d.groups.every((g) => (x.groups || []).includes(g));
      return `<label class="${busy.length ? 'busy' : ''}"><input type="checkbox" name="cf-tr" value="${esc(x.id)}"${selected.has(x.id) ? ' checked' : ''}>${avatar(x)}<span class="info"><span class="n">${esc(x.name)}</span> <span class="muted small">${esc(x.phone || '')}</span>
        <span class="s" style="display:block">${busy.length ? `<b style="color:var(--bad)">Đã có lịch:</b> ${esc(busy.map((b) => `${classLabel(b)} ${fmtDateRange(b.startDate, b.endDate)} ${b.startTime || ''}–${b.endTime || ''}`).join('; '))}` : '<b style="color:var(--ok)">Rảnh</b>'}${x.region !== d.region ? ' · vùng ' + esc(regionName(x.region)) : ''}</span>
        <span class="s muted" style="display:block">${esc(specs)}${!okGroup ? ' · <span style="color:var(--warn)">chưa đăng ký dạy ' + esc(groupsText(d.groups.filter((g) => !(x.groups || []).includes(g)))) + '</span>' : ''}${x.dailyRate ? ' · ' + esc(moneyShort(x.dailyRate)) + '/ngày' : ' · chưa có thù lao/ngày'}</span></span></label>`;
    }).join('') : `<div class="empty">${d.region ? 'Vùng này chưa có giảng viên đang hoạt động. Tick “Hiện cả giảng viên vùng khác” hoặc thêm giảng viên.' : 'Chọn vùng đào tạo.'}</div>`;
    hydrate(root.querySelector('[data-picker]'));
  }
  function renderFees(d) {
    const days = classDays(d);
    for (const tid of selected) {
      if (!feeMap.has(tid)) feeMap.set(tid, { trainerId: tid, amount: feeAuto(tid, d), auto: true, payments: [] });
      const fe = feeMap.get(tid); if (fe.auto) fe.amount = feeAuto(tid, d);
    }
    const box = root.querySelector('[data-fees]');
    if (!selected.size) { box.innerHTML = '<div class="muted small">Chọn giảng viên ở danh sách trên – thù lao từng người sẽ hiện ở đây.</div>'; return; }
    const focused = document.activeElement?.dataset?.fee;
    box.innerHTML = `<div class="feerows">${[...selected].map((tid) => {
      const x = trainer(tid); const fe = feeMap.get(tid); const auto = feeAuto(tid, d); const paid = feePaid(fe);
      return `<div class="feerow"><span class="grow"><b>${esc(x?.name || 'Giảng viên')}</b><span class="muted small"> · ${x?.dailyRate ? `${esc(money(x.dailyRate))} đ/ngày × ${days} ngày = ${esc(money(auto))} đ` : 'chưa nhập thù lao/ngày – nhập số tiền thỏa thuận'}</span>${paid ? `<span class="small" style="color:var(--ok)"> · đã trả ${esc(money(paid))} đ</span>` : ''}</span>
        <input class="input num" data-fee="${esc(tid)}" data-money inputmode="numeric" value="${fe.amount ? money(fe.amount) : ''}" placeholder="Thù lao lớp này (đ)" aria-label="Thù lao ${esc(x?.name || '')}">
        ${!fe.auto && auto ? `<button type="button" class="btn xs" data-act-local="fee-auto" data-tid="${esc(tid)}">Theo thù lao/ngày</button>` : ''}</div>`;
    }).join('')}</div><div class="hint small muted" style="margin-top:4px">Số HĐ thuê giảng viên, file hợp đồng và các lần tạm ứng/thanh toán nhập ở màn hình chi tiết lớp (nút “Thù lao &amp; trả tiền”).</div>`;
    bindMoney(box);
    if (focused) { const el = box.querySelector(`[data-fee="${focused}"]`); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
  }
  function renderQuotes(d) {
    const sel = root.querySelector('#cf-quote'); const cur = sel.value || c.quoteId || '';
    const qs = S.quotes.filter((q) => norm(q.customerName) === norm(d.customerName) || q.id === cur);
    sel.innerHTML = opt('', qs.length ? '— Chưa gắn báo giá —' : d.customerName ? '— Khách này chưa có báo giá —' : '— Nhập khách hàng trước —', !cur) + qs.map((q) => opt(q.id, `${q.no || 'BG'} · ${fmtD(q.date)} · ${QUOTE_STATUS[q.status]?.label || ''}${q.contractNo ? ' · HĐ ' + q.contractNo : ''}`, q.id === cur)).join('');
    const q = sel.value && quote(sel.value);
    root.querySelector('[data-hint="cf-quote"]').innerHTML = q ? `${fileButtons(q.quoteFiles, 'Xem báo giá')} ${fileButtons(q.contractFiles, 'Xem hợp đồng')}${isContract(q) ? '' : ' <span class="muted">· báo giá chưa ký – chưa tính hoa hồng/doanh thu HĐ</span>'}` : 'Gắn để xem nhanh báo giá, hợp đồng và phân bổ hoa hồng của hợp đồng.';
  }
  function refresh(src) {
    const d = read();
    const cu = findCustomerByName(d.customerName);
    root.querySelector('[data-hint="cf-customer"]').textContent = !d.customerName ? '' : cu ? `Khách hàng đã có · ${customerStats(cu.id).classes} lớp trước đây` : 'Khách hàng mới – sẽ được thêm vào danh sách khách hàng';
    if (src === 'cf-customer' && cu) {
      if (!val(root, 'cf-contact') && cu.contact) root.querySelector('#cf-contact').value = cu.contact;
      if (!val(root, 'cf-cphone') && cu.phone) root.querySelector('#cf-cphone').value = cu.phone;
      if (cu.region && !existing && !root.querySelector('input[name="cf-region"]:checked')) { const r = root.querySelector(`input[name="cf-region"][value="${cu.region}"]`); if (r) r.checked = true; }
    }
    const sg = suggestedDays(d.groups, d.kind);
    root.querySelector('[data-hours]').innerHTML = d.groups.length ? `${d.groups.map((g) => `Nhóm ${g}: ${GROUPS[g].desc.toLowerCase()} – cấp ${GROUPS[g].paper}`).join(' · ')}<br>Thời lượng tối thiểu gợi ý: <b>${sg.hrs} giờ ≈ ${sg.days} ngày</b>${d.kind === 'Huấn luyện định kỳ' ? ' (định kỳ ≈ 50% lần đầu)' : ''}${sg.days && d.startDate ? ` <button type="button" class="btn xs" data-act-local="apply-days" data-days="${sg.days}">Đặt ngày kết thúc ${fmtD(addDays(d.startDate, sg.days - 1))}</button>` : ''}` : 'Chọn nhóm để gợi ý thời lượng (số giờ theo Cài đặt).';
    if (src === 'cf-from' && d.endDate < d.startDate) root.querySelector('#cf-to').value = d.startDate;
    const d2 = read();
    root.querySelector('[data-hint="cf-to"]').textContent = d2.endDate < d2.startDate ? 'Ngày kết thúc trước ngày bắt đầu' : `${classDays(d2)} ngày học`;
    if (src !== 'fee' && src !== 'costs') renderPicker(d2);
    if (src !== 'fee') renderFees(d2);
    const tmp = { ...read(), id: existing?.id || '__new' };
    const cx = conflictsFor(tmp);
    root.querySelector('[data-conflict]').innerHTML = cx.length ? `<div class="banner warn" style="margin:0"><b>Trùng lịch:</b>&nbsp;${esc(cx.map((x) => `${trainerNames(x.trainers)} đang dạy ${classLabel(x.cls)} (${fmtDateRange(x.cls.startDate, x.cls.endDate)} ${x.cls.startTime || ''}–${x.cls.endTime || ''})`).join('; '))}</div>` : '';
    root.querySelector('[data-override]').classList.toggle('hide', !cx.length);
    const tier = tierFor(d2.students);
    if (priceMode === 'auto' && src !== 'cf-price') { const p = tier ? tier.price : 0; root.querySelector('#cf-price').value = p ? money(p) : ''; }
    const pNow = parseMoney(val(root, 'cf-price'));
    root.querySelector('[data-hint="cf-price"]').innerHTML = `${esc(tierText(d2.students))}${tier && pNow !== tier.price ? ` · <b style="color:var(--accent)">Giá điều chỉnh</b> <button type="button" class="btn xs" data-act-local="price-auto">Dùng giá bảng</button>` : ''}`;
    if (src === 'cf-customer' || src === 'init' || src === 'cf-quote') renderQuotes(d2);
    const draft = { ...read(), id: existing?.id || '__new' };
    const P = classPnl(draft, draft);
    root.querySelector('[data-com]').innerHTML = P.contract ? `Phân bổ <b>${pct(P.share)}</b> hoa hồng của hợp đồng ${esc(P.contract.contractNo || P.contract.no || '')}: tổng <b>${esc(money(P.com.gross))} đ</b> (thực trả ${esc(money(P.com.net))} đ, thuế ${esc(money(P.com.tax))} đ)${P.otherAlloc ? ` · chi phí khác của HĐ phân bổ ${esc(money(P.otherAlloc))} đ` : ''}. <button type="button" class="btn xs" data-act="pnl-view" data-id="${esc(P.contract.id)}">Sửa hoa hồng tại hợp đồng</button>`
      : '<span class="muted">Lớp chưa gắn hợp đồng đã ký nên chưa có hoa hồng. Hoa hồng đại lý / cán bộ quản lý khách hàng nhập theo hợp đồng ở tab Doanh thu – Lợi nhuận.</span>';
    root.querySelector('[data-moneybox]').innerHTML = mbox('Doanh thu lớp', money(P.rev)) + mbox('Thù lao giảng viên', money(P.gv)) + mbox('Hoa hồng (gồm thuế)', money(P.com.gross)) + mbox('Chi phí khác', money(P.other)) + mbox(`Lợi nhuận${P.rev ? ` (${pct(P.margin)})` : ''}`, money(P.profit), P.profit < 0 ? 'neg' : 'pos');
    if (src === 'cf-quote') {
      const q = quote(val(root, 'cf-quote'));
      if (q && !d2.groups.length && (q.groups || []).length) { q.groups.forEach((g) => { const cb = root.querySelector(`input[name="cf-group"][value="${g}"]`); if (cb) cb.checked = true; }); refresh('groups'); }
    }
  }
  form.addEventListener('input', (e) => {
    const id = e.target.id || e.target.name;
    if (e.target.dataset.fee) { const fe = feeMap.get(e.target.dataset.fee); fe.amount = parseMoney(e.target.value); fe.auto = false; refresh('fee'); return; }
    if (e.target.closest('[data-costs]')) return;
    if (id === 'cf-price') priceMode = 'manual';
    if (['cf-notes', 'cf-title', 'cf-location', 'cf-contact', 'cf-cphone', 'cf-passed'].includes(id)) return;
    if (e.target.name === 'cf-tr') return;
    refresh(id);
  });
  form.addEventListener('change', (e) => {
    if (e.target.name === 'cf-tr') { if (e.target.checked) selected.add(e.target.value); else selected.delete(e.target.value); refresh('picker'); return; }
    if (e.target.type === 'radio' || e.target.type === 'checkbox' || e.target.tagName === 'SELECT') refresh(e.target.id || e.target.name);
  });
  root.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act-local]'); if (!b) return;
    if (b.dataset.actLocal === 'apply-days') { root.querySelector('#cf-to').value = addDays(val(root, 'cf-from'), Number(b.dataset.days) - 1); refresh('cf-to'); }
    if (b.dataset.actLocal === 'price-auto') { priceMode = 'auto'; refresh('price-auto'); }
    if (b.dataset.actLocal === 'fee-auto') { const fe = feeMap.get(b.dataset.tid); fe.auto = true; refresh('fee-auto'); }
  });
  refresh('init');
  const snap = JSON.stringify(read());
  m.guard = formGuard(() => JSON.stringify(read()) !== snap || files.dirty(), [files]);
  root.querySelector('[data-cancel]').onclick = () => m.tryClose();
  root.querySelector('[data-del]')?.addEventListener('click', async () => { if (await deleteClass(existing)) { m.guard = null; m.close(); } });
  root.querySelector('[data-save]').onclick = async (ev) => {
    const d = read(); const err = [];
    if (!d.customerName) err.push('tên khách hàng');
    if (!d.startDate) err.push('ngày bắt đầu');
    if (d.endDate < d.startDate) err.push('ngày kết thúc phải sau ngày bắt đầu');
    if (!d.region) err.push('vùng đào tạo');
    if (!(d.students > 0)) err.push('số học viên');
    if (err.length) { toast('Cần nhập: ' + err.join(', '), 'bad'); return; }
    const cx = conflictsFor({ ...d, id: existing?.id || '__new' });
    if (cx.length && !root.querySelector('#cf-override').checked) { toast('Giảng viên bị trùng lịch – đổi giảng viên/ngày, hoặc tick “Vẫn lưu dù trùng lịch”.', 'bad'); root.querySelector('[data-conflict]').scrollIntoView({ block: 'center' }); return; }
    ev.target.disabled = true;
    try {
      const cu = await ensureCustomer(d.customerName, { contact: d.contact, phone: d.contactPhone, region: d.region });
      const rec = { ...(existing || {}), ...d, customerId: cu.id, customerName: cu.name, files: files.value() };
      rec.fees = rec.fees.map((x) => { const o = { ...x }; delete o.removed; return o; });
      rec.costTrainer = sum(rec.fees.filter((x) => rec.trainerIds.includes(x.trainerId)), (x) => x.amount);
      delete rec.costTravel; delete rec.costOther; delete rec.costTrainerMode; delete rec.vatRate;
      if (rec.status === 'done' && (rec.passed === '' || rec.passed === undefined)) rec.passed = rec.students;
      await Store.save('classes', rec, `${cu.name} – ${fmtDateRange(rec.startDate, rec.endDate)}`);
      files.commit(); m.guard = null; m.close();
      toast(existing ? 'Đã cập nhật lớp.' : 'Đã thêm lớp vào lịch.', 'ok');
      S.ui.selDate = rec.startDate; if (!classInMonth(rec, S.ui.month) && S.ui.tab === 'lich') S.ui.month = ymOf(rec.startDate);
      scheduleRender();
    } catch (e) { ev.target.disabled = false; }
  };
}

async function deleteClass(c) {
  if (!c) return false;
  const paid = sum(classFees(c), feePaid);
  if (!(await confirmBox(`Xóa lớp <b>${esc(classLabel(c))}</b> (${esc(fmtDateRange(c.startDate, c.endDate))})? Các file hồ sơ lớp cũng bị xóa.${paid ? `<br><br><b>Lưu ý:</b> lớp đã ghi nhận trả thù lao giảng viên ${esc(moneyD(paid))} – xóa lớp sẽ mất các khoản này. Nên chuyển trạng thái “Đã hủy” thay vì xóa.` : ''}`, { ok: 'Xóa lớp', danger: true }))) return false;
  try { await Store.remove('classes', c, `${classLabel(c)} – ${fmtDateRange(c.startDate, c.endDate)}`); [...(c.files || []), ...(c.fees || []).flatMap((x) => x.files || [])].forEach((x) => Store.backend.delFile(x)); toast('Đã xóa lớp.', 'ok'); return true; } catch (e) { return false; }
}

async function markDone(c) {
  const rec = { ...c, status: 'done', passed: c.passed === '' || c.passed === undefined ? c.students : c.passed };
  try { await Store.save('classes', rec, `${classLabel(c)} – hoàn thành`, 'Hoàn thành'); toast('Đã đánh dấu lớp hoàn thành.', 'ok'); } catch (e) { /* đã báo lỗi */ }
}

    m.foot.querySelector('[data-x=edit]').onclick = () => { m.close(); classForm(c); };
    hydrate(m.el); fillNames(m.el);
  }
}

/* ---------- thù lao một giảng viên trong một lớp: số tiền, HĐ thuê GV, tạm ứng / thanh toán ---------- */
function feeModal(classId, trainerId, { pay = false } = {}) {
  const c0 = klass(classId); const x = trainer(trainerId);
  if (!c0) return;
  const ro = !S.role.canEdit;
  const base = classFees(c0).find((fe) => fe.trainerId === trainerId) || { trainerId, amount: feeAuto(trainerId, c0), auto: true, payments: [] };
  const fe = clone(base); fe.payments = fe.payments || [];
  const auto = feeAuto(trainerId, c0);
  const m = openModal({
    title: `Thù lao giảng viên – ${esc(x?.name || 'Giảng viên')}`, sub: esc(`${classLabel(c0)} · ${fmtDateRange(c0.startDate, c0.endDate)} · ${classDays(c0)} ngày`), size: '',
    body: `<div class="fgrid">
        ${f('fm-amount', 'Thù lao lớp này (đ)', moneyInp('fm-amount', fe.amount, 'Số tiền theo hợp đồng thuê giảng viên'), { hint: x?.dailyRate ? `Theo thù lao/ngày: ${money(x.dailyRate)} × ${classDays(c0)} ngày = ${money(auto)} đ` : 'Giảng viên chưa có thù lao/ngày – nhập số thỏa thuận' })}
        ${f('fm-cno', 'Số hợp đồng thuê giảng viên', inp('fm-cno', fe.contractNo, 'placeholder="VD: 12/2026/HĐGV-DAKO"'))}
        ${f('fm-cdate', 'Ngày ký hợp đồng', inp('fm-cdate', fe.contractDate, 'type="date"'))}
        ${f('fm-note', 'Ghi chú', inp('fm-note', fe.note, 'placeholder="Điều khoản thanh toán, tài khoản nhận…"'), { cls: 'full' })}
        <div class="f full"><span class="lbl">File hợp đồng thuê giảng viên / chứng từ chi</span><div data-files></div></div>
      </div>
      <div><div class="sec-title">Tạm ứng &amp; thanh toán</div><div data-pays></div>
        ${ro ? '' : `<div class="payadd"><input class="input" id="fm-pdate" type="date" value="${todayISO()}" aria-label="Ngày trả"><select class="input" id="fm-pkind" aria-label="Loại">${PAY_KINDS.map((k) => opt(k, k, k === 'Tạm ứng')).join('')}</select><input class="input num" id="fm-pamount" data-money inputmode="numeric" placeholder="Số tiền trả (đ)" aria-label="Số tiền"><input class="input" id="fm-pnote" placeholder="Nội dung – VD: tạm ứng trước khi dạy" aria-label="Nội dung"><button type="button" class="btn sm" data-addpay>${ic('plus')} Ghi nhận</button></div>`}
      </div><div class="money-box" data-sum></div>`,
    foot: ro ? '' : `<span class="sp"></span><button type="button" class="btn" data-cancel>Hủy</button><button type="button" class="btn primary" data-save>${ic('check')} Lưu</button>`,
  });
  const root = m.el; bindMoney(root);
  const files = mountFileField(root.querySelector('[data-files]'), fe.files || []);
  if (ro) $$('input, select', root).forEach((el) => (el.disabled = true));
  function renderPays() {
    const amount = parseMoney(val(root, 'fm-amount')); const paid = sum(fe.payments, (p) => p.amount);
    root.querySelector('[data-pays]').innerHTML = fe.payments.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Ngày</th><th>Loại</th><th class="r">Số tiền</th><th>Nội dung</th><th></th></tr></thead><tbody>${fe.payments.slice().sort((a, b) => (a.date || '').localeCompare(b.date || '')).map((p) => `<tr style="cursor:default"><td class="num">${esc(fmtD(p.date))}</td><td>${esc(p.kind || '')}</td>${moneyCell(p.amount)}<td>${esc(p.note || '')}</td><td class="r">${ro ? '' : `<button type="button" class="btn xs ghost" data-rmpay="${esc(p.id)}" aria-label="Xóa khoản trả">${ic('trash')}</button>`}</td></tr>`).join('')}</tbody></table></div>` : '<div class="muted small">Chưa có khoản tạm ứng / thanh toán nào.</div>';
    const due = (c0.status === 'cancelled' ? 0 : amount) - paid;
    root.querySelector('[data-sum]').innerHTML = mbox('Thù lao', money(c0.status === 'cancelled' ? 0 : amount)) + mbox('Đã trả', money(paid), 'pos') + (due < 0 ? mbox(c0.status === 'cancelled' ? 'Cần thu hồi tạm ứng' : 'Đã trả dư', money(-due), 'neg') : mbox('Còn phải trả', money(due), due > 0 ? 'hl' : 'pos'));
    const pa = root.querySelector('#fm-pamount'); if (pa && !pa.value && amount - paid > 0) pa.placeholder = `Còn lại ${money(amount - paid)} đ`;
  }
  renderPays();
  root.querySelector('#fm-amount').addEventListener('input', renderPays);
  root.addEventListener('click', (e) => {
    if (e.target.closest('[data-addpay]')) {
      const amount = parseMoney(val(root, 'fm-pamount'));
      if (!(amount > 0)) { toast('Nhập số tiền đã trả.', 'bad'); root.querySelector('#fm-pamount').focus(); return; }
      fe.payments.push({ id: uid('tt'), date: val(root, 'fm-pdate') || todayISO(), kind: val(root, 'fm-pkind') || 'Thanh toán', amount, note: val(root, 'fm-pnote') });
      root.querySelector('#fm-pamount').value = ''; root.querySelector('#fm-pnote').value = ''; renderPays();
      toast('Đã thêm – bấm Lưu để ghi vào công cụ.');
    }
    const rm = e.target.closest('[data-rmpay]'); if (rm) { fe.payments = fe.payments.filter((p) => p.id !== rm.dataset.rmpay); renderPays(); }
  });
  const read = () => ({ amount: parseMoney(val(root, 'fm-amount')), contractNo: val(root, 'fm-cno'), contractDate: val(root, 'fm-cdate'), note: val(root, 'fm-note'), payments: fe.payments });
  const snap = JSON.stringify(read());
  if (!ro) {
    m.guard = formGuard(() => JSON.stringify(read()) !== snap || files.dirty(), [files]);
    root.querySelector('[data-cancel]').onclick = () => m.tryClose();
    root.querySelector('[data-save]').onclick = async (ev) => {
      const d = read(); const c = klass(classId) || c0;
      const list = classFees(c).map((x2) => ({ ...x2 }));
      const i = list.findIndex((x2) => x2.trainerId === trainerId);
      const entry = { ...(i >= 0 ? list[i] : { trainerId }), ...d, auto: d.amount === auto && !!auto, files: files.value() };
      delete entry.removed;
      if (i >= 0) list[i] = entry; else list.push(entry);
      const rec = { ...c, fees: list.map((x2) => { const o = { ...x2 }; delete o.removed; return o; }) };
      rec.costTrainer = sum(rec.fees.filter((x2) => (rec.trainerIds || []).includes(x2.trainerId)), (x2) => x2.amount);
      delete rec.costTrainerMode;
      ev.target.disabled = true;
      try {
        const newPaid = sum(d.payments, (p) => p.amount) - feePaid(base);
        await Store.save('classes', rec, `Thù lao ${x?.name || 'GV'} – ${classLabel(c)}${newPaid > 0 ? ` (trả ${moneyShort(newPaid)})` : ''}`, newPaid > 0 ? 'Trả thù lao' : 'Cập nhật');
        files.commit(); m.guard = null; m.close(); toast('Đã lưu thù lao giảng viên.', 'ok');
      } catch (e) { ev.target.disabled = false; }
    };
  }
  if (pay && !ro) setTimeout(() => root.querySelector('#fm-pamount')?.focus(), 60);
}

async function deleteTrainer(x) {
  if (!x) return false;
  const used = S.classes.filter((c) => (c.trainerIds || []).includes(x.id) || (c.fees || []).some((fe) => fe.trainerId === x.id));
  if (used.length) { toast(`Không xóa được: ${x.name} đã có ${used.length} lớp trong lịch. Hãy chuyển trạng thái “Tạm ngưng” để giữ lịch sử và công nợ.`, 'bad'); return false; }
  if (!(await confirmBox(`Xóa giảng viên <b>${esc(x.name)}</b> cùng ảnh và hồ sơ đính kèm?`, { ok: 'Xóa giảng viên', danger: true }))) return false;
  try { await Store.remove('trainers', x, x.name); [x.photo, ...(x.files || [])].filter(Boolean).forEach((f2) => Store.backend.delFile(f2)); toast('Đã xóa giảng viên.', 'ok'); return true; } catch (e) { return false; }
}

        ${f('qf-owner', 'Người phụ trách', inp('qf-owner', q.owner, 'placeholder="Nhân viên kinh doanh / đại lý"'))}

    foot: `${existing ? `<button type="button" class="btn danger" data-del>${ic('trash')} Xóa</button>` : ''}<span class="sp"></span><button type="button" class="btn" data-cancel>Hủy</button><button type="button" class="btn primary" data-save>${ic('check')} Lưu báo giá</button>`,
  });

  const cf = mountFileField(root.querySelector('[data-cfiles]'), q.contractFiles);
