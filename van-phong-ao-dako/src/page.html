<title>Văn phòng ảo DAKO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/*__STYLES__*/
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <img src="__LOGO__" alt="Logo DAKO Marine Technology">
      <div>
        <div class="eyebrow">Công ty Cổ phần Kỹ thuật Hàng hải DAKO</div>
        <div class="brand-title">Văn phòng ảo · <em>Huấn luyện ATVSLĐ</em></div>
      </div>
    </div>
    <div class="top-actions">
      <div class="giver" role="group" aria-label="Trưởng phòng giao việc">
        <span>Giao việc:</span>
        <button data-giver-btn="nga" aria-pressed="true">Mrs. Nga</button>
        <button data-giver-btn="lich" aria-pressed="false">Mr. Lịch</button>
      </div>
      <div class="seg" role="group" aria-label="Kiểu văn phòng">
        <button data-scene="sang" aria-pressed="true">Sáng</button>
        <button data-scene="dem" aria-pressed="false">Đêm biển</button>
        <button data-scene="banve" aria-pressed="false">Bản vẽ</button>
      </div>
    </div>
  </header>

  <main class="main">
    <section class="stage" id="stage" aria-label="Văn phòng 3D">
      <canvas id="cv" aria-label="Văn phòng 3D: rê chuột vào nhân viên để xem kết quả đầu ra, bấm để mở phiên chat giao việc"></canvas>
      <div class="fallback" id="fallback" hidden></div>
      <div class="tags" id="tags"></div>
      <div class="tip card" id="tip" hidden role="tooltip"></div>
      <div class="pinned card" id="pinned" hidden role="dialog" aria-label="Kết quả đầu ra"></div>
      <div class="hint-bar">Rê chuột vào nhân viên để xem kết quả đầu ra · Bấm vào nhân viên để mở phiên chat giao việc</div>
      <div class="zoom">
        <button id="zIn" aria-label="Phóng to">+</button>
        <button id="zOut" aria-label="Thu nhỏ">−</button>
        <button id="zFit" aria-label="Xem toàn cảnh"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
    </section>

    <aside class="side" aria-label="Nhân sự">
      <h2>TRƯỞNG PHÒNG</h2>
      <div class="boss-list" id="bossList"></div>
      <h2>NHÂN VIÊN <span class="sub">· <span id="giverName">Mrs. Nga</span> đang giao việc</span></h2>
      <ul class="staff-list" id="staffList"></ul>
    </aside>
  </main>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
