<title>Văn phòng ảo DAKO</title>

<style>
:root {
  /* Bố cục: thanh thương hiệu navy · sân khấu 3D + cột nhân sự bên phải */
  --navy: #0B3F9E; --gold: #F0A81C; --gold-ink: #8A5A00; --on-gold: #1B1300; --on-navy: #FFFFFF;
  --band: #0B3F9E; --band-2: #082C70; --on-band: #FFFFFF; --band-muted: #BFD0F2;
  --bg: #EDF2F9; --panel: #FFFFFF; --panel-2: #F5F8FD; --ink: #0D1A33; --muted: #56678A; --line: #D6DFED; --sky: #E3ECFA;
  --ok: #17905A; --shadow: 0 12px 32px rgba(9, 34, 86, .16);
  --f-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-disp: "Anton", "Arial Narrow", Impact, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --navy: #3F7BE6; --gold: #F5B532; --gold-ink: #F5B532; --on-gold: #1B1300; --on-navy: #FFFFFF;
    --band: #0A1F4D; --band-2: #06153A; --on-band: #FFFFFF; --band-muted: #93A9D6;
    --bg: #06122B; --panel: #0C1C3D; --panel-2: #10234A; --ink: #E7EDF8; --muted: #97A8C9; --line: #1C3263; --sky: #13295A;
    --ok: #3CC488; --shadow: 0 12px 32px rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --navy: #3F7BE6; --gold: #F5B532; --gold-ink: #F5B532; --on-gold: #1B1300; --on-navy: #FFFFFF;
  --band: #0A1F4D; --band-2: #06153A; --on-band: #FFFFFF; --band-muted: #93A9D6;
  --bg: #06122B; --panel: #0C1C3D; --panel-2: #10234A; --ink: #E7EDF8; --muted: #97A8C9; --line: #1C3263; --sky: #13295A;
  --ok: #3CC488; --shadow: 0 12px 32px rgba(0, 0, 0, .45); color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
a { color: var(--navy); }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; min-height: 0; }

.top { background: linear-gradient(100deg, var(--band), var(--band-2)); color: var(--on-band); border-bottom: 3px solid var(--gold);
  display: flex; align-items: center; justify-content: space-between; gap: 12px 18px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand img { width: 46px; height: 46px; border-radius: 50%; background: #FFFFFF; padding: 2px; flex: none; }
.eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--band-muted); font-weight: 600; }
.brand-title { font-family: var(--f-disp); font-size: 24px; letter-spacing: .02em; line-height: 1.1; }
.brand-title em { font-style: normal; color: var(--gold); }
.top-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.giver, .seg { display: inline-flex; align-items: center; background: rgba(255, 255, 255, .1); border-radius: 999px; padding: 3px; gap: 2px; }
.giver > span { font-size: 12px; color: var(--band-muted); padding: 0 6px 0 10px; font-weight: 600; }
.giver button, .seg button { padding: 6px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: var(--band-muted); }
.giver button[aria-pressed="true"] { background: var(--gold); color: var(--on-gold); }
.seg button[aria-pressed="true"] { background: var(--on-band); color: var(--band-2); }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; min-height: 0; }
.stage { position: relative; min-height: 0; overflow: hidden; background: var(--bg); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
.tags { position: absolute; inset: 0; pointer-events: none; }
.ptag { position: absolute; left: 0; top: 0; pointer-events: auto; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px 4px 4px; border-radius: 999px; background: rgba(8, 22, 52, .9); color: #FFFFFF; font-size: 12px; box-shadow: 0 4px 14px rgba(0, 0, 0, .2); will-change: transform; }
.ptag .num { width: 20px; height: 20px; font-size: 11px; }
.ptag .pt-job { color: #C9D6EE; }
.ptag.boss { padding: 3px 10px; background: #F0A81C; color: #1B1300; font-weight: 700; }
.ptag.boss:not(.on) { background: rgba(8, 22, 52, .9); color: #F7C35A; }
.num { width: 24px; height: 24px; border-radius: 50%; background: var(--gold); color: var(--on-gold); display: inline-grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; font-variant-numeric: tabular-nums; }
.num.boss { background: var(--navy); color: var(--gold); }

.card { position: absolute; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-top: 4px solid var(--gold); border-radius: 14px; box-shadow: var(--shadow); padding: 12px 14px; z-index: 4; }
.tip { left: 0; top: 0; width: min(340px, calc(100% - 16px)); pointer-events: none; }
.pinned { right: 16px; top: 16px; width: min(360px, calc(100% - 32px)); max-height: calc(100% - 32px); overflow: auto; }
.pinned .close { position: absolute; right: 8px; top: 8px; }
.oc-head { display: flex; gap: 10px; align-items: flex-start; padding-right: 22px; }
.oc-head .num { width: 30px; height: 30px; font-size: 14px; }
.oc-head b { display: block; font-size: 15px; }
.oc-head small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.35; }
.oc-label { margin-top: 10px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--gold-ink); font-weight: 700; }
.oc-list { margin: 4px 0 0; padding: 0; list-style: none; display: grid; gap: 5px; font-size: 13px; }
.oc-list li { padding-left: 18px; position: relative; line-height: 1.4; }
.oc-list li::before { content: ""; position: absolute; left: 2px; top: .55em; width: 8px; height: 8px; border-radius: 2px; background: var(--navy); }
.oc-need { margin-top: 10px; font-size: 12.5px; color: var(--muted); }
.oc-need span { font-weight: 700; color: var(--ink); }
.oc-hint { margin-top: 10px; font-size: 12px; font-weight: 600; color: var(--navy); }
.card .btn { margin-top: 12px; width: 100%; justify-content: center; }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 999px; font-weight: 700; font-size: 13.5px; white-space: nowrap; text-decoration: none; }
.btn.sm { padding: 6px 11px; font-size: 12.5px; }
.btn.gold { background: var(--gold); color: var(--on-gold); }
.btn.gold:hover { filter: brightness(1.06); }
.icon-btn { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--panel); font-size: 18px; }
.hint-bar { position: absolute; left: 16px; bottom: 16px; right: 70px; width: fit-content; max-width: calc(100% - 90px); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 12.5px; color: var(--muted); z-index: 1; }
.zoom { position: absolute; right: 16px; bottom: 16px; display: grid; gap: 6px; z-index: 2; }
.zoom button { width: 36px; height: 36px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); display: grid; place-items: center; font-size: 18px; font-weight: 600; }
.fallback { position: absolute; inset: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; align-content: start; }
.fb-card { background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--gold); border-radius: 12px; padding: 12px; display: grid; gap: 4px; color: var(--ink); text-decoration: none; }

.side { background: var(--panel); border-left: 1px solid var(--line); overflow: auto; padding: 14px 16px 20px; min-height: 0; }
.side h2 { font-family: var(--f-disp); font-weight: 400; font-size: 17px; letter-spacing: .06em; margin: 6px 0 10px; color: var(--ink); }
.side h2 .sub { font-family: var(--f-body); font-size: 12px; letter-spacing: 0; color: var(--muted); font-weight: 500; }
.boss-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 18px; }
.boss-card { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); text-align: left; flex-wrap: wrap; }
.boss-card[aria-pressed="true"] { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.av { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; flex: none; }
.av.boss { background: var(--navy); color: var(--gold); box-shadow: inset 0 0 0 2px var(--gold); }
.bc-main { display: grid; line-height: 1.25; min-width: 0; flex: 1; }
.bc-main small { color: var(--muted); font-size: 11.5px; }
.bc-state { font-size: 11px; font-weight: 700; color: var(--gold-ink); width: 100%; }
.staff-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.staff-card { border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2); padding: 10px 12px; cursor: pointer; transition: border-color .15s; }
.staff-card:hover, .staff-card:focus-within { border-color: var(--gold); }
.sc-top { display: flex; align-items: flex-start; gap: 10px; }
.sc-main { display: grid; flex: 1; min-width: 0; line-height: 1.35; }
.sc-main span { color: var(--muted); font-size: 12.5px; }
.sc-out { display: none; margin: 8px 0 0 34px; padding: 0 0 0 14px; font-size: 12.5px; color: var(--ink); }
.sc-out li { margin: 2px 0; }
.staff-card:hover .sc-out, .staff-card:focus-within .sc-out { display: block; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--band-2); color: var(--on-band); padding: 10px 16px; border-radius: 12px; z-index: 40; box-shadow: var(--shadow); max-width: min(560px, calc(100% - 32px)); font-size: 13px; }

@media (max-width: 1100px) { .main { grid-template-columns: minmax(0, 1fr) 320px; } }
@media (max-width: 760px) {
  .app { height: auto; min-height: 100%; }
  .eyebrow { display: none; } .brand-title { font-size: 18px; } .brand img { width: 34px; height: 34px; }
  .top-actions { width: 100%; justify-content: space-between; }
  .main { grid-template-columns: 1fr; }
  .stage { height: 62vh; }
  .side { border-left: 0; border-top: 1px solid var(--line); }
  .ptag .pt-job { display: none; }
  .hint-bar { display: none; }
  .sc-out { display: block; }
  .pinned { left: 8px; right: 8px; top: auto; bottom: 8px; width: auto; max-height: 70%; }
}
@media (prefers-reduced-motion: reduce) { .staff-card { transition: none; } }

</style>

  /* ---------- Biển tên ---------- */

<script>
/* Văn phòng ảo DAKO – giao diện: danh sách nhân sự, thẻ kết quả đầu ra, mở phiên chat giao việc. */
(() => {
  const D = window.DOI_NGU;
  const NV = Object.fromEntries(D.nhan_vien.map(n => [n.id, n]));
  const TP = Object.fromEntries(D.truong_phong.map(t => [t.id, t]));
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  const ARROW = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>';
  let giver = TP[store.get('vp-giver')] ? store.get('vp-giver') : D.truong_phong[0].id;
  let pinned = null;

  /* ---------- Thẻ kết quả đầu ra ---------- */
  function outputsCard(nv, opts = {}) {
    return `<div class="oc-head"><span class="num">${nv.so}</span><div><b>${esc(nv.ten)}</b><small>${esc(nv.viec)}</small></div></div>
      <div class="oc-label">Kết quả đầu ra</div>
      <ul class="oc-list">${nv.dau_ra.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
      <div class="oc-need"><span>Cần gửi kèm:</span> ${esc(nv.can)}</div>
      ${opts.link ? `<a class="btn gold" href="${esc(nv.link)}" target="_blank" rel="noopener">${esc(TP[giver].ten)} giao việc cho ${esc(nv.ten)} ${ARROW}</a>` : `<div class="oc-hint">Bấm vào ${esc(nv.ten)} để mở phiên chat giao việc</div>`}`;
  }
  function showTip(id, e) {
    const tip = $('#tip');
    if (!id || pinned) { tip.hidden = true; return; }
    const st = $('#stage').getBoundingClientRect();
    if (TP[id]) tip.innerHTML = `<div class="oc-head"><span class="num boss">${esc(TP[id].ten.split(' ').pop()[0])}</span><div><b>${esc(TP[id].ten)}</b><small>${esc(TP[id].chuc_danh)} · ${esc(TP[id].mo_ta)}</small></div></div><div class="oc-hint">Bấm để chọn ${esc(TP[id].ten)} là người giao việc</div>`;
    else tip.innerHTML = outputsCard(NV[id]);
    tip.hidden = false;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = e.clientX - st.left + 16, y = e.clientY - st.top + 16;
    if (x + w > st.width - 8) x = e.clientX - st.left - w - 16;
    if (y + h > st.height - 8) y = Math.max(8, st.height - h - 8);
    tip.style.transform = `translate(${Math.round(Math.max(8, x))}px, ${Math.round(y)}px)`;
  }
  function pin(id) {
    pinned = id; const el = $('#pinned');
    if (!id) { el.hidden = true; Office.highlight(null); return; }
    $('#tip').hidden = true;
    el.innerHTML = `<button class="icon-btn close" data-act="unpin" aria-label="Đóng">×</button>${outputsCard(NV[id], { link: true })}`;
    el.hidden = false; Office.highlight(id);
  }

  /* ---------- Mở phiên chat ---------- */
  function openChat(id) {
    const nv = NV[id]; if (!nv) return;
    Office.dispatch(giver, id);
    const a = document.createElement('a'); a.href = nv.link; a.target = '_blank'; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    pin(id);
    toast(`${TP[giver].ten} giao việc cho ${nv.ten}: phiên chat “${nv.viec}” mở ở tab mới. Không thấy tab mới thì bấm nút vàng trong thẻ.`);
  }
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 6000); }

  /* ---------- Danh sách bên phải ---------- */
  function renderSide() {
    $('#bossList').innerHTML = D.truong_phong.map(t => `<button class="boss-card" data-giver="${t.id}" aria-pressed="${t.id === giver}">
      <span class="av boss">${esc(t.ten.split(' ').pop()[0])}</span><span class="bc-main"><b>${esc(t.ten)}</b><small>${esc(t.chuc_danh)}</small></span>

      <div class="sc-top"><span class="num">${n.so}</span><span class="sc-main"><b>${esc(n.ten)}</b><span>${esc(n.viec)}</span></span>

  }
  function renderTags() {
    $('#tags').innerHTML = D.nhan_vien.map(n => `<button class="ptag" data-staff="${n.id}"><span class="num">${n.so}</span><b>${esc(n.ten)}</b><span class="pt-job">${esc(n.bien)}</span></button>`).join('')

    if (!Office.ready) return;

      const p = Office.project(a);
      el.style.transform = staff ? `translate(${Math.round(p.x)}px, ${Math.round(p.y + 6)}px) translate(-50%, 0)` : `translate(${Math.round(p.x)}px, ${Math.round(p.y - 10)}px) translate(-50%, -100%)`;
    });
  }
  function setGiver(id) { giver = id; store.set('vp-giver', id); renderSide(); renderTags(); if (pinned) pin(pinned); }

  /* ---------- Sự kiện ---------- */
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act],[data-giver],[data-giver-btn],[data-scene],[data-open],[data-staff]'); if (!b) return;

    if (b.dataset.open) { Office.dispatch(giver, b.dataset.open); return; }     // thẻ <a> tự mở tab mới
    if (b.dataset.staff && b.classList.contains('ptag')) return openChat(b.dataset.staff);
    if (b.dataset.staff && b.classList.contains('staff-card')) return pin(b.dataset.staff);
  });
  $('#staffList').addEventListener('mouseover', e => { const c = e.target.closest('.staff-card'); Office.highlight(c ? c.dataset.staff : pinned); });
  $('#staffList').addEventListener('mouseleave', () => Office.highlight(pinned));
  $('#zIn').addEventListener('click', () => Office.zoomBy(1.25));
  $('#zOut').addEventListener('click', () => Office.zoomBy(0.8));
  $('#zFit').addEventListener('click', () => Office.fit());
  document.addEventListener('keydown', e => { if (e.key === 'Escape') pin(null); });

  /* ---------- Khởi động ---------- */
  renderSide();
  const ok = Office.init($('#stage'), $('#cv'), D, { logo: window.LOGO });
  if (!ok) {
    $('#cv').hidden = true; const fb = $('#fallback'); fb.hidden = false;
    fb.innerHTML = D.nhan_vien.map(n => `<a class="fb-card" href="${esc(n.link)}" target="_blank" rel="noopener"><span class="num">${n.so}</span><b>${esc(n.ten)}</b><span>${esc(n.viec)}</span></a>`).join('');
  }
  const dark = matchMedia('(prefers-color-scheme: dark)').matches || document.documentElement.dataset.theme === 'dark';
  const sc0 = store.get('vp-scene') || (dark ? 'dem' : 'sang');
  Office.setTheme(sc0); document.querySelectorAll('[data-scene]').forEach(x => x.setAttribute('aria-pressed', x.dataset.scene === sc0));
  Office.fit(false);
  renderTags();
  Office.onFrame(ch => { if (ch) placeTags(); });
  Office.onHover((u, e) => {
    const id = u && (u.person || (u.boss ? null : null));
    if (!pinned) Office.highlight(NV[id] ? id : null);
    showTip(u && u.person ? u.person : null, e);
  });
  Office.onPick((u, e) => {
    if (!u) return pin(null);
    if (u.boss) return;
    const id = u.person;
    if (TP[id]) return setGiver(id);
    if (!NV[id]) return;
    if (e && e.pointerType === 'touch') return pin(id);     // chạm: xem đầu ra trước, bấm nút vàng để mở phiên chat
    openChat(id);
  });
  if (document.fonts) { document.fonts.ready.then(() => Office.redrawBoards()); ['Anton', 'JetBrains Mono'].forEach(f => document.fonts.load(`40px "${f}"`).then(() => Office.redrawBoards()).catch(() => {})); }
})();

</script>
